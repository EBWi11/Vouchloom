version: 1
topics:
  - id: project_arrow
    summary: "Separate Apache Arrow IPC file, stream, tensor, and Parquet readers."
    project_names: ["arrow"]
    content: |
      Use these public landmarks as search priors and verify them in the checked-in
      version. Arrow targets distinguish IPC file, stream, tensor stream, and
      Parquet-to-Arrow carriers. Files need the random-access container and footer;
      streams need ordered schema, dictionary, record-batch, and termination messages;
      Parquet needs its footer, schema, row groups, column chunks, pages, and enabled
      codecs. Readers can drain all batches, validate or stringify them, reopen Parquet
      under several batch sizes, and visit every row group, so initial parsing is not the
      final checkpoint.

      Track FlatBuffer lengths, offsets and alignment, signed counts, array offsets and
      child lengths, dictionary state, Parquet definition/repetition levels, page sizes,
      logical versus physical types, decimal widths, and codec availability. IPC
      dictionaries can evolve across messages and be resolved when later batches
      reference them. Treat shallow and recursive validation as separate state.

      Run-end encoding has one strictly increasing run-ends child and one values child.
      Logical nulls belong to the values child; the parent representation has no
      validity bitmap. During IPC materialization, keep the parent null-count and buffer
      slots distinct from each child's field node, validity/data buffers, offset, and
      length. Validate the parent representation before deriving a null count, then
      validate both children and the final run end against the logical array span.

      During Parquet conversion, keep level entries, produced values, validity state,
      offset storage, and encoded-substream counts distinct. Some encodings decode
      intermediate lengths or retain prior-value state before materialization. Track
      signedness, counts, cumulative output, and allocation as separate domains and
      phases.
  - id: project_binutils
    summary: "Navigate Binutils targets without confusing tools, BFD, and backends."
    project_names: ["binutils"]
    content: |
      Verify these public landmarks in the checked-in version. Binutils separates
      command-line tools, the BFD object/archive abstraction and format backends, the
      assembler, and shared libraries. A source directory does not identify the
      executed target. Bind its entrypoint first, then follow BFD target selection or
      the tool-specific reader into the owning backend.

      Keep assembler source separate from object carriers. gas can expand macros and
      repetitions before parsing tokens; inspection tools instead open through BFD,
      select a backend, and traverse its records. Their framing and state differ.

      Common fuzz executables are not interchangeable front ends. A disassembly target
      can consume architecture, machine, and flavour controls plus raw instruction bytes
      and call libopcodes without opening an object. A minimal BFD target may check only
      archive format; embedding an object member does not reach its object backend unless
      the harness iterates the member and checks that format. The readelf target uses
      readelf's own ELF parser and can be linked to non-BFD support libraries, so its
      acceptance does not prove a BFD callback ran. Objdump instead opens through BFD and
      may traverse headers, sections, relocations, private data, and disassembly, while
      objcopy adds input-to-output transformation, symbol and debug handling, section
      compression, writer state, and teardown. Match the claimed module and lifecycle
      phase to the exact exported executable before constructing its carrier.

      Object files and archives require coherent headers, section/member tables,
      offsets, alignment, string tables, and backend selection. Distinguish file-size
      from section-relative bounds, and determine whether the harness uses a filename,
      memory buffer, temporary file, or selected target flavor.

      COFF and PE symbol tables are sequences of fixed-width records. A primary
      symbol's auxiliary-record count consumes the following records, so keep the
      declared symbol count, remaining table bytes, auxiliary count, and record width
      in one span proof. COMDAT handling can inspect section-symbol auxiliaries during
      object recognition, before any DWARF consumer runs. Standard COFF and bigobj
      use different external record layouts and swap routines; bind the selected BFD
      target before transferring offsets or sizes between them.

      ELF object attributes use a versioned section containing vendor subsections
      and nested file, section, or symbol attribute records. Vendor names and some
      attribute values are NUL-terminated strings, while tags and integer values can
      use LEB128. Keep the section end, vendor-subsection end, nested-record end,
      string terminator, and variable-length integer cursor in one containment proof;
      a child declaration must never extend the span established by its parent.

      Archive-oriented BFD targets may recognize object files only after selecting an
      archive member and processing a symbol map; a bare object can be valid yet never
      reach its backend. For GNU or BSD ar carriers, preserve global magic, fixed-width
      member headers, even-byte padding, name and string-table conventions, and armap
      encoding. Then keep the embedded object's header, sections, offsets, alignment,
      and string tables coherent through member dispatch.

      Debug-section compression is a BFD transformation, not only compression-header
      parsing. Objcopy selects compression or decompression before object-format
      recognition; the selected backend later decides the per-section action after
      section flags, name, and contents are known. ELF `SHF_COMPRESSED` sections use the
      generic ABI header, while legacy `.zdebug_*` sections use a distinct convention;
      do not transfer acceptance rules between them or across backends. Recompression
      can replace a malloc-owned contents buffer with storage owned by the BFD arena.
      After replacement, success and error cleanup must follow the new owner. Prove the
      backend, selected action, compression status, and current contents owner before
      following a compression failure path.
  - id: project_assimp
    summary: "Trace Assimp format detection, scene graphs, and postprocessing."
    project_names: ["assimp"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. A common Assimp fuzzer passes the complete artifact to the
      in-memory importer without an extension hint, so content probing selects a
      format-specific AssetLib reader. The artifact must be a coherent supported 3D
      asset rather than a generic Assimp envelope. Formats that require external
      sidecars cannot assume those resources exist through a memory-only entrypoint.
      A 3MF artifact is an OPC package carried by ZIP, so archive directory and part
      selection precede the 3D model reader and must be preserved as their own layer.

      Format readers can also pass embedded resource names through Assimp's shared
      filesystem filter before attempting sidecar lookup. URI-scheme prefixes, UNC
      prefixes, separators, and escaped octets are recognized while normalizing that
      bounded string. Keep the current iterator and remaining characters together
      when testing multi-character prefixes, including at the end of a short name.

      Trace importer registry and probe -> selected reader -> shared stream and optional
      decompression -> scene nodes, meshes, faces, materials, bones, animations, and
      textures -> configured postprocess -> optional exporter/blob serialization ->
      importer and exporter cleanup. Successful parsing can be followed by triangulation,
      normal or tangent generation, vertex joining, mesh splitting, cache optimization,
      and validation; some variants then serialize the scene through a format writer.
      A late fault can belong to either secondary path. Preserve container chunks and
      offsets, scene parent-child relationships, mesh vertex/index/face counts, bone
      weights, and material or texture references. Prove importer selection and the
      postprocess or export stage before constructing the causal field.

      After a format reader builds `aiScene`, import runs requested structure validation,
      then scene preprocessing, then the remaining configured postprocess steps. A reader
      that skips or recovers from malformed records must keep declared, allocated,
      initialized, and logical mesh counts consistent; each face array and optional
      vertex-attribute array must satisfy the count later consumed by preprocessing.
      Primitive-type sorting can then replace one mixed mesh with several outputs and
      rewrite node mesh references, so preserve face classification, old-to-new mapping,
      and ownership through cleanup.

      Shared postprocess stages consume scenes produced by many independent AssetLib
      readers, so a crash at a common postprocess function does not establish the
      upstream producer identity. Treat importer selection and the intermediate scene
      defect as part of the causal route. When a reader reports or recovers from a
      malformed record, receipt the declared, initialized, and logical array state that
      crosses into the first shared consumer; a different importer reaching the same
      downstream write is an adjacent route until that producer relation is justified.
  - id: project_c_blosc2
    summary: "Separate c-blosc2 chunk, frame, compress, and round-trip targets."
    project_names: ["c-blosc2"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. c-blosc2 targets distinguish standalone chunks from frames or
      super-chunks and compression from decompression. A chunk decompressor can treat
      the whole artifact as one Blosc chunk and compare its compressed-size field with
      the available bytes. A frame target first reconstructs frame metadata and a chunk
      table. Compression targets treat the artifact as raw input while also reusing
      leading bytes for compression level, filters, codec, and block or chunk geometry;
      those control bytes can remain part of the data being compressed. Some targets
      then decompress and compare the result.

      Bind the exact target before choosing a carrier. Keep uncompressed bytes,
      compressed bytes, block size, chunk size, chunk count, frame offsets, chunk spans,
      filter metadata, and actual remaining input distinct. Follow header or frame ->
      codec/filter pipeline -> block/chunk loop -> output allocation -> optional
      round-trip check. A frame seed is not a bare chunk, and successful compression is
      not the last checkpoint when the harness validates decompression afterward.

      A Blosc block using the zlib codec contains a nested zlib wrapper and DEFLATE
      bitstream. DEFLATE match distance is a one-based backward offset into bytes already
      produced or the active history window; zero, reserved codes, or a distance beyond
      that history are invalid. Keep outer compressed-block length, bit cursor,
      literal/length-distance symbols, produced output, output capacity, zlib header and
      trailer, and Adler state as separate domains through the wrapper return path.

      Keep DEFLATE invalidity classes separate. A defined length symbol paired with a
      defined, nonzero distance that exceeds the available history tests the history
      contract. A reserved length or distance symbol instead tests symbol-table
      validation, even when both cases eventually enter nearby copy code. When the
      active relation concerns produced history, preserve legal Huffman symbols and
      cross only the distance-versus-produced-byte boundary.

      For a dynamic DEFLATE block, expand the header before constructing data symbols.
      HLIT, HDIST, and HCLEN store counts minus their format constants; code-length
      entries follow the DEFLATE permutation, symbols 0 through 15 state lengths
      directly, and 16 through 18 repeat earlier or zero lengths using their defined
      extra bits. Expand exactly the declared literal/length and distance counts and
      verify the canonical trees before encoding data. Huffman codes are emitted most
      significant bit first even though other packed DEFLATE fields are read least
      significant bit first.
  - id: project_ffmpeg
    summary: "Separate FFmpeg container, codec, filter, and conversion contracts."
    project_names: ["ffmpeg"]
    content: |
      FFmpeg separates libavformat probing/demux/AVIO, libavcodec parsing/decoding,
      bitstream filters, and conversion. Bind the exported executable and build-time
      specialization because one source can produce many targets. Decoder targets consume
      packets plus controls or extradata; demux, BSF, and SWS targets differ.

      Treat the build as a generated-target inventory: public patterns include
      `ffmpeg_AV_CODEC_ID_<codec>_fuzzer`, `ffmpeg_BSF_<filter>_fuzzer`,
      `ffmpeg_DEMUXER_fuzzer`, and `ffmpeg_dem_<demuxer>_fuzzer`. Verify loops, components,
      and `$OUT`; never derive a target from prose.
      Resolve generic/per-demuxer collisions and `target_dec_fuzzer` codec specialization
      before binding an input contract.

      Trace codec controls/extradata -> parser -> packet decode -> frame/reference ->
      flush/cleanup, or demux probe/forced format -> header/index -> stream -> packet loop.
      Keep declared versus available sizes, offsets, dimensions, channels, strides,
      planes, and reference state distinct; appended bytes may be harness controls. Use a
      verified elementary-stream or same-container fixture and prove which bytes the harness
      removes. For concealment faults, track who initializes each plane, which slices or
      blocks remain unwritten, reference state, and the first recovery/filter read.
      `target_dec_fuzzer` can split data into a packet sequence; keep delimiters and
      per-packet keyframe or flush state separate from trailing controls. H.263 slice
      reconstruction, in-loop filtering, and frame-end concealment are distinct stages.
      Enumerate consumers in order; recovery need not be the first partial-macroblock read.

      Do not infer picture-type reachability from a target or codec name. The accepted
      sequence/profile syntax and decoded picture type select I/P/B and frame/field
      macroblock paths. Missing-reference handling may allocate a dummy instead of requiring
      an earlier packet; keep current output, synthetic reference, and decoded prior frame as
      distinct initialization origins. Treat entropy/VLC parsing, inverse transform, block
      output, filtering, and concealment as ordered failure boundaries. A semantic
      block-decode error is distinct from bit exhaustion and must propagate before later
      stages consume coefficient or pixel state.

      Audio frame allocation and codec production are separate. The default buffer path
      sizes its pool from channel layout, sample format, and `nb_samples`; planar formats
      expose per-channel planes through `extended_data`; packed formats use one interleaved
      plane. Pool capacity does not prove zero initialization or full production. A codec
      mode may emit a shorter core frame before a postprocessor consumes a nominal window.
      Track allocated and written spans, consumer read width, and decoder variant and object
      type independently.

      Per-demuxer targets bind the outer input format before open and normally bypass
      top-level format probing, but nested content probing may remain. An outer demuxer can
      call common probes from its own packet path. When source shows that edge, keep the
      outer target and nested callback separate. The nested callback is not target
      substitution; a direct nested target is. Fuzzed
      `avio_read` may return short or fail, leaving a destination suffix uninitialized;
      byte helpers have a separate EOF contract. For headers, tags, and GUIDs,
      separate requested length, actual return, initialized destination prefix, and later
      consumer. Continuation decoding must stay inside that prefix.

      MXF demuxing has nested key domains. An outer KLV packet key selects a local set;
      local tags carry typed values, and an indirect value contains its own type key. Do not
      transfer an outer-key read to the nested value. At each layer separate requested key
      width, actual AVIO return, initialized prefix, enclosing length, and first consumer.

      MXF index segments are grouped by IndexSID/BodySID. Keep start, duration,
      edit-unit byte count and VBR offsets distinct. Partition KLVs precede essence;
      accepted segments and repeated lookups prove index use.

  - id: project_flac
    summary: "Separate FLAC streams, structured API sequences, PCM, and tool inputs."
    project_names: ["flac"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. FLAC targets have distinct contracts: a complete native stream
      for media-parser decoding; datasource sequences that interleave decoder or encoder
      controls with stream or PCM chunks; and configuration regions followed by native
      or Ogg-FLAC data for seek and metadata APIs. Encoder targets derive codec options
      before consuming PCM; reencoders copy decoded metadata and samples.

      The legacy public fuzzer_decoder uses fuzzing-headers Datasource, not naked FLAC:
      each scalar is a native-endian uint32 length plus scalar bytes; GetData is the same
      prefix plus its span. It reads nine framed booleans: native-versus-Ogg (true selects
      native), serial and MD5, respond type/application/all, then ignore
      type/application/all; a false setter consumes no nested value. The loop is a framed
      boolean then a framed uint8 opcode: 0 flush, 1 reset, 2 one frame, 3 metadata, 4
      stream, 5 skip, 6 seek, and 7 through 12 getters. Processing re-enters callbacks on
      the same cursor. Verify the checked-in layout and read back the cursor before
      treating an embedded STREAMINFO or frame as decoder-visible.

      Command-line targets can split NUL-delimited arguments from a remainder written as
      the input file. A metaflac target can further divide that remainder between the
      FLAC file and stdin used by an import operation. Bind this split before treating
      cue text, options, or file bytes as the parser-visible payload. Trace marker or Ogg
      pages -> STREAMINFO and metadata blocks -> frame headers, subframes, and residuals
      -> PCM callbacks -> seek, analysis, metadata write, finish, verification, or
      re-encoding. Preserve metadata spans and counts, total samples, block sizes,
      channels, bits per sample, frame/sample numbering, seek offsets, Ogg granules, LPC
      order, Rice partitions, PCM interleaving, and callback state. Do not treat an API
      sequence as a standalone FLAC file or stop at metadata when the harness drains
      frames or writes state back.

      Partitioned Rice residual decoding has bit-reader and partition state distinct
      from the enclosing frame. For FIXED and LPC subframes, predictor order consumes
      warm-up samples and reduces the residual count in the first Rice partition; check
      it against both frame blocksize and that partition's sample span before residual
      decode or signal restoration. CLI decoding can also place optional
      signal-processing stages between metadata setup and PCM output; include those
      states when tracing a complete decode route.

      For a bit-reader tail claim, require a same-artifact, same-official-target
      owner-boundary receipt: allocation half-open byte/word bounds, consumed-word and
      bit cursor, final partial-word initialized padding, supplying callback, and
      observed load address. Logical exhaustion is not memory OOB when the load remains
      in live storage. Checksum accumulation is a separate consumer of that buffer during
      callback refill and compaction; track its start offset, alignment, consumed-word
      count, and reset, skip, or seek transitions rather than transferring a bound from
      the decode cursor. An early-returning harness or different decoder cannot supply it.

      Treat metadata error recovery as an explicit state transition. Record the metadata
      read result, state before the writer, writer return, committed state after it,
      frame-sync re-entry, callback-provided initialized span, bit-reader cursor, and
      first load from one artifact and target. Change one metadata or frame relation that
      produces the transition; a state name, logical EOF, or load inside live initialized
      storage is not an uninitialized-read witness.
  - id: project_gdal
    summary: "Bind GDAL drivers, virtual files, archives, and direct geometries."
    project_names: ["gdal"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. GDAL targets span raster datasets, OGR data sources, direct
      WKB or WKT geometry, spatial-reference text, and format-specific drivers. Dataset
      targets can materialize the whole artifact under a virtual filename. Multi-file
      formats can instead package the artifact as an archive. Some targets open a named
      member through a virtual archive path, while others pass the archive's virtual
      filename directly to the selected driver. The registered driver, virtual filename,
      and open path together determine the carrier; WKB is binary while WKT or
      spatial-reference text can require NUL rules.

      Trace virtual I/O and archive member -> driver probe/open -> format directory,
      chunk, or sidecars -> raster band or feature/geometry model -> checksum or full
      enumeration -> close. Successful raster open can be followed by band/block reads;
      OGR targets can visit every layer and feature. Track member names and sidecar
      relationships, offsets and counts, raster dimensions, blocks and strides, layer
      and feature counts, and geometry ring or point counts. A single format fragment
      cannot replace a required archive or companion-file set.

      Resolve the concrete driver even for a single-file input. The OGR KML path parses
      XML and builds a mutable feature-layer list during open. The LIBERTIFF raster path
      uses GDAL's bundled TIFF parser; its IFD entries store small values inline and
      larger values through file offsets. Do not transfer validation assumptions between
      that bundled parser and another TIFF implementation.

      The OGR NTF driver reads fixed-column text records. File metadata establishes the
      coordinate representation and field widths that later 2D or 3D geometry records
      use when slicing coordinate fields. Bind those declared widths before feature
      enumeration, and keep record length, field start/end columns, numeric precision,
      and coordinate dimensionality as separate domains.

      Arc/Info Binary Coverage is a directory dataset rather than one opaque binary
      stream. The AVC reader classifies the coverage layout from its component names,
      derives the coverage and INFO paths, and inventories sections such as ARC, PAL,
      CNT, LAB, TXT or TX6, PRJ, and attribute tables. Unix-style, PC, and hybrid
      coverages differ in suffix conventions and table placement. An archive-backed
      target must therefore preserve the coverage-directory root and any sibling INFO
      relationship before driver open can select a component reader.

      OGR exposes supported coverage sections as layers and opens their component files
      when features are requested; open success alone does not prove record decoding.
      Component dispatch depends on section type, coverage family, byte order, and
      precision. Text-annotation variants use different record layouts and derive text
      and vertex storage from record size plus signed counts; some paths adjust or
      duplicate points before later access. Validate transformed counts, allocation
      geometry, and the remaining record span together. Keep index-file offsets,
      component-file offsets, INFO table definitions, and layer feature state in separate
      coordinate and ownership domains.

      The MRF driver normally relates XML metadata to data and index sidecars, but its
      LERC path can also recognize a standalone Lerc2 blob and infer a single-tile
      dataset from the codec header. Bind sidecar-backed MRF versus direct LERC first,
      then trace header-derived dimensions, sample type, block geometry, tile span, and
      decompressor input as separate domains.
  - id: project_ghostscript
    summary: "Navigate Ghostscript language, stream, and device execution layers."
    project_names: ["ghostscript"]
    content: |
      Ghostscript combines interpreters, PDF, filters,
      devices, and memory managers. Bind complete-job, stream/filter, or lower-API
      contracts first; PDF, PostScript, and raw-filter carriers are not interchangeable.

      Target names impose a downstream-device constraint: `gstoraster_pdf_fuzzer`
      requires `%PDF-`; `gstoraster_ps_fuzzer` consumes a byte-zero
      selector before PostScript; `gstoraster_fuzzer` sends the job to CUPS. Device-named
      writer fuzzers select output devices, not raw writer input.

      Trace parse/execute -> device open -> page/render or clist -> error continuation ->
      close. A warning or repair-time free is not final when a later retry, render, writer,
      or teardown is required. Bind the interpreter, graphics/device, or filter state
      required by the fault.

      Memory-device construction and later parameter updates are distinct lifecycle
      edges. Opening establishes dimensions, resolution, media size, raster geometry,
      and backing storage; a later parameter operation can propose new values while that
      storage remains live. For an update-related route, preserve the pre-update
      allocation, prove which geometry fields changed, and reach a later render consumer;
      an oversized device created that way initially exercises a different path.

      PDF inline images live inside a content stream: BI builds a compact image dictionary,
      ID starts image data, and EI returns to content tokenization. Dimensions, component
      count, bit depth, filters, and masks govern both render geometry and how much the
      temporary image stream consumes. Trace image setup -> filter chain -> image-plane
      consumption -> source-stream position -> next token. Image errors can be downgraded
      to warnings, so the first observable fault may occur after content parsing resumes.

      GhostPDF repair is a state transition, not an in-place parser retry. It can rebuild
      or grow xref storage, clear interpreter-stack objects, reposition the main stream,
      and retry an indirect dereference. Treat pre-repair xref-entry pointers, stack
      objects, stream cursors, and cached objects as aliases whose validity must be
      re-established. Prove repair success, the retried lookup, the ownership or reference
      transition, and the first post-repair consumer.

      PDF font reachability forces resource and font resolution through page resources,
      Font, Encoding/CMap, and content. Embedded Type 1 uses PostScript names,
      dictionaries, and eexec/lenIV; CFF/Type1C uses indexed binary DICT data. Their
      CharStrings are bytecode with a separate stack. Keep parser spans, key/value sizes,
      glyph selection, logical depth, and capacity separate. Writer-side copied and
      completed fonts can cross interpreter, device, and final-VM lifetimes; track subset
      publication and the memory manager owning every partial object.

      Type 42 and TrueType differ from Type 1 and CFF. Bind the SFNT directory plus cmap,
      metrics, maxp, loca, and glyf, then prove whether resources select Ghostscript's
      native Type 42 outliner/interpreter or the FAPI/FreeType bridge; compiled support
      alone does not. Native TrueType can consume fpgm/prep during setup and glyph or
      composite-point instructions during outlining, so prove the glyph, engine, and phase.

      Clist faults require a command-list device transition; vector writers may bypass it. Prove
      that a device or compositor creates a clist writer, records the command, and later
      enters playback. Keep source raster, padded rows, serialized bytes, playback decoding,
      band geometry, and final target-device copy as separate spans.

      Distinguish typed ref/GC clumps from their non-GC backing heap: a raw limit does not
      identify the failing child allocation, and freeing a typed object can run its
      finalizer immediately. Record an allocator-domain receipt from the same artifact and
      target: owner bounds, initialization, free/realloc path, and controlled geometry.
      Stop if input-uncontrollable. A logical OOB or UAF is only reach evidence until it
      crosses an owner or freed allocation.
  - id: project_graphicsmagick
    summary: "Bind GraphicsMagick coder targets and secondary write paths."
    project_names: ["graphicsmagick"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. A GraphicsMagick coder target commonly fixes one image format
      at build time, wraps the artifact in a Magick++ Blob, sets that format, and calls
      Image::read. When the coder is writable, the same target can write the decoded
      image back to a blob; an enhancement target can instead auto-detect a format and
      then process the image. The target name and build definition determine the format
      and whether a secondary encoder path is reachable.

      Trace Magick++ Image -> blob/read dispatch -> format selection -> the selected
      coder and any delegated external codec -> image, pixel, colormap, frame, and
      profile storage.
      If writing is enabled, continue through the encoder rather than attributing every
      fault to decoding. Preserve the selected format's header and chunk or directory
      structure, dimensions, channels, bit depth, frame or layer counts, row geometry,
      profiles, and declared spans. Treat harness memory and dimension limits, caught
      exceptions, and normal coder rejection as execution semantics, not as the target
      memory-safety condition.

      For TIFF compression delegated to another codec, keep three byte domains
      separate: the delegated codec's decoded sample representation, the TIFF
      scanline or tile span derived from declared BitsPerSample and SamplesPerPixel,
      and the GraphicsMagick pixel-cache region imported from those rows. Matching
      width and height does not prove that every byte in the declared row span was
      produced or initialized. On a read-then-write target, also trace which depth and
      compression metadata survive the reader and determine the secondary encoder.
      Coder-target builds can statically link separately built codec libraries rather
      than the host library or an in-tree compatibility copy. Use a host decoder only
      to check carrier structure; its acceptance, rejection, or guard set cannot refute
      the bound target until the backend revision and build gates are shown equivalent.

      Floating-point-to-integer conversion can be diagnosed by a locally enabled
      undefined-behavior check yet remain recoverable in the bound target. Record the
      target instrumentation and exception path, then follow the converted value into
      pixel, row, geometry, or allocation state. Treat a local conversion diagnostic as
      reach evidence until the actual target reports it or a downstream invalid memory
      operation makes it observable.

      Some container coders extract an embedded image and pass it back through blob
      format selection. Keep the outer coder, the embedded format promised by the
      container, and the coder actually selected for the extracted blob distinct. A
      synthesized signature prefix does not by itself lock the secondary dispatch.
      DICOM secondary inputs have a preamble and element stream whose explicit- or
      implicit-VR records carry declared value lengths. Textual values use format-level
      even-length padding; preserve that span separately from any C-string terminator
      expected by the consuming coder.

      In the TIFF reader, `QuantumTransferMode` selects the `ImportImagePixelArea`
      quantum type from PhotometricInterpretation, sample format, SamplesPerPixel,
      PlanarConfiguration, the active plane, and matte state. Keep file samples,
      samples consumed by that quantum type, and PixelPacket components actually
      initialized in the current cache region as separate sets. ExtraSamples can mark
      associated alpha independently of that import coverage. Alpha disassociation
      consumes opacity plus color components, so bind it to the selected photometric and
      import mapping rather than to the presence of an alpha tag alone; grayscale,
      palette, separated, LogL/LogLuv, direct RGB, and fallback RGBA paths do not
      materialize identical cache state. PTIF writing clones and repeatedly resizes the
      decoded image for pyramid levels. Audit post-read matte and colorspace at each
      filter input: they can make a reader-unwritten cache component observable before
      final encoding.
  - id: project_gpac
    summary: "Bind GPAC ISO-media and filter-graph targets without overreach."
    project_names: ["gpac"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. GPAC includes ISO media parsing, a filter-session core,
      demux/reframe/decode/inspect filters, and shared bitstream, XML, and URL helpers.
      Visible build artifacts can expose at least two downstream interface families:
      opening a file through the ISO BMFF parser, or loading one into a filter session
      for probe and deep bitstream analysis. These references rank candidate chains;
      they do not prove the artifact-to-entrypoint transformation.

      Other stable media families include the MPEG-TS demuxer, which assembles PSI/PMT
      sections and manages elementary-stream objects, and the DASH client, which reaches
      MPD and segment-template/URL processing through a DASH demux filter. Direct buffer
      probes and generic filter sessions can reach related media modules with different
      wrapper state, carrier, and teardown obligations.

      Do not infer a target grammar from an object name or build reference alone. Some
      builds reference external harness sources that may be absent from the checked-in
      tree; when the exact entrypoint is absent, keep its transformation unknown and
      prove only the visible build binding and downstream interfaces. For ISO media,
      track box header and size, parent-child nesting, full-box version and flags, fragments,
      sample tables, data maps, and actual data spans. For filter paths, track session,
      filter, PID, packet, property, queue, probe, and cleanup state before constructing
      a container.

      In ISO BMFF, a parent's declared byte budget and bytes still available in the
      underlying file are separate spans. A child may read successfully from the file
      before the parent-size relation is checked. A warning, size clamp, skip, or repair
      proves that inconsistent nesting was observed; it is not itself an invalid
      operation. Identify the later consumer that trusts the accepted parent-child state
      while preserving required full-box fields and handler dispatch.

      Filter selection is staged. Source loading can negotiate through URL probes, data
      probes, MIME or file extensions, and capability matching. An extensionless local
      file may still select a demux or text filter by content, while a URL-only source
      requires the URL carrier itself. A generic inspect sink can consume a raw PID
      without instantiating a decoder, compositor, scene loader, or network packet
      source. Prove the selected filter's configuration and process callbacks, resulting
      PID properties, and first packet consumer before transferring a shared-helper
      hypothesis.

      Adaptive and control front ends remain distinct. DASH consumes XML MPD state; HLS
      parses master or media M3U8 playlists and can translate them into the MPD model.
      HLS marker, scalar, URI-followed, and attribute-list tags have different cardinality
      contracts; preserve lines, quoting, required following URIs, and the actual parsed
      attribute count. RTSP can begin from a URL, while SDP is a separate text carrier.
      Capture replay instead nests packet, ROUTE/LCT signaling and object reconstruction,
      cached resource or MPD, and DASH spans. Keep those identities and URL transformations
      separate from session creation and later network I/O.

      Elementary and text filters have separate staged contracts. Ogg demuxing converts
      sync pages and lacing into per-serial packet streams, parses initial codec headers,
      declares a PID, and copies packet data before later page-buffer reuse; distinguish
      sync-page, stream-body, packet, property, and PID lifetimes. WebVTT passes content
      and BOM probing plus text-mode selection before Unicode line conversion and
      cue-state parsing. MP3 reframing validates and scans headers before frame-size and
      bitrate helpers; another caller of the same helper can have different gates. Do
      not transfer acceptance or lifetime evidence between these filters.
  - id: project_harfbuzz
    summary: "Bind HarfBuzz font and synthetic-object target grammars."
    project_names: ["harfbuzz"]
    content: |
      Use these public landmarks as search priors and verify them in source. HarfBuzz
      targets have distinct grammars. Shape, draw, and subset targets commonly treat the
      main bytes as an OpenType font, but can reuse tail bytes as variation, glyph,
      codepoint, or axis controls while those bytes remain in the font blob. Repacker
      targets instead consume a synthetic graph of table tags, blobs, and links; set
      targets consume encoded set operations. Build the exact target's byte ledger.

      For font paths, trace the SFNT/OpenType directory into glyph, variation, layout,
      color, or math consumers while preserving the overlapping-tail interpretation.
      Keep SFNT directory records ordered by table tag as well as bounded and aligned;
      table lookup can use binary search, so valid offsets alone do not establish that
      a table is discoverable. During layout subsetting, a stored variation table is
      live only after retained GDEF, GSUB, or GPOS structures contribute variation
      indexes to the subset plan. Trace plan flags, glyph retention and remapping,
      table sanitization, and index collection before treating that store as consumed.
      Subsetting can use lazy iterator pipelines, while face-builder output reassembles
      table records into a new blob. Track iterator, allocation, and output-ownership
      states separately. For synthetic graphs, track object spans, parent indexes, link
      width, and referenced blobs rather than substituting a font file.

      OpenType GSUB and GPOS contextual or chained-contextual subtables combine
      backtrack, input, and lookahead coverage with lookup records that name a sequence
      position and another lookup. Applying a referenced lookup can change the live
      glyph buffer while the outer context retains positions. Track those positions,
      the current buffer index, glyph count, and error state together across recursive
      application; acceptance of the coverage arrays alone does not establish the
      later buffer state.

      Apple Advanced Typography substitution uses `mort` or `morx` chains containing
      typed subtables. Contextual subtables combine a state table and entry records with
      offset-based glyph lookup arrays. Keep chain, subtable, state/class/entry, lookup
      count, offset origin, and table extent separate through sanitization and shaping;
      `mort` and `morx` use related but different field widths.

      For TrueType outlines, close `head` location format, `maxp` glyph count, `loca`
      offsets, and `glyf` spans before reasoning about points. Simple glyph contours and
      instructions feed composite components whose flags choose point or coordinate
      arguments, transforms, and referenced glyphs. Metrics and variation paths add
      `hhea`/`hmtx`, `fvar` axes and record sizes, and `gvar` tuple or offset state. Prove
      each table sanitizer and cross-table count before changing outline geometry; a
      well-formed table directory alone does not establish the consumer state.

      Before a cross-table mutation, emit one receipt: official target and tail controls
      -> SFNT directory -> table tag and artifact span -> local count or offset ->
      cross-table owner such as `maxp.numGlyphs` or `fvar.axisCount` -> sanitizer result ->
      first consumer address or index. Read the relation back from the finished font and
      change only one proven mismatch. Stop if table sanitization, subset planning, or
      target-tail decoding clamps the value before that consumer.
  - id: project_htslib
    summary: "Trace HTSlib format probing, records, writers, and reopen passes."
    project_names: ["htslib"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. HTSlib's hts_open target treats the complete artifact as an
      in-memory file and format-probes it; there is no leading format selector. Sequence
      inputs must reach SAM, BAM, or CRAM header and record parsing. Variant inputs must
      similarly reach VCF or BCF headers and records. Depending on the version, the
      harness reads and writes once or reopens the same artifact for several output
      modes, so a fault can be in input parsing, normalized record state, an output
      encoder, or close.

      Trace container or compression -> header and reference dictionary -> record
      framing -> CIGAR, sequence, qualities, auxiliary or FORMAT fields -> writer. Keep
      BGZF block sizes, CRAM containers, slices and references, BAM or BCF record
      lengths, counts, offsets, type codes, and text versus binary coordinates distinct.
      An internal field is reachable only after the outer header and record body exist;
      a magic or isolated tag cannot create that state. Preserve a parseable record
      through the output mode used by the exact harness.

      Variant conversion targets commonly admit a record to the writer only after the
      reader has decoded and validated it. Binary BCF carries typed integer dictionary
      indexes that are checked against the synchronized header before a successful read;
      text VCF resolves tag names through the header dictionary and materializes internal
      indexes during parsing. Keep the on-disk field, header entry, packed record,
      unpacked record, record error state, and writer lookup as separate stages. A
      suspicious writer access is input-reachable only if some accepted producer can
      create its operand after every read-side check; a serialized sentinel that makes
      the read loop stop cannot exercise the writer.

      CRAM output has a separate reference state machine. Sequence-dictionary lines can
      establish reference names, lengths, and numeric IDs without making the reference
      bases resident. Bases may be attached explicitly, resolved from header metadata or
      a configured provider, embedded or generated by the encoder, or remain unavailable.
      During container encoding, failed lookup or generation can restart processing in
      no-reference mode, changing which record and checksum paths execute. Before a
      reference-dependent claim, prove ID mapping, the actual reference-byte owner and
      range, and the encoder mode after fallback. Keep BAM record coordinates, CRAM's
      internal coordinate convention, and reference-buffer offsets distinct.
  - id: project_hunspell
    summary: "Bind Hunspell query, affix, dictionary, and fixed-dictionary inputs."
    project_names: ["hunspell"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. Hunspell targets have two grammars. An aff/dic target can
      interpret the leading byte as the following query-word length. Treat its signed
      semantics and guard only as input-split conditions unless the claim or an observed
      fault specifically names that harness boundary; do not substitute them for a
      downstream library string, compound, or suggestion fault. It then splits the
      remainder in half: the first part becomes .aff and the second .dic. Hunspell loads
      both, calls spell on the query, and calls suggest after a miss. A late affix rule
      must therefore survive the word prefix and half split, with enough dictionary bytes
      to place the boundary. A
      fixed-dictionary target instead loads bundled .aff/.dic pairs during initialization
      and treats the complete artifact only as a query word.

      Trace SET and FLAG modes -> affix, compound, and replacement tables -> dictionary
      entries and flags -> normalization, spell, compound checks, and suggestion.
      Preserve line endings, declared entry counts, flag encoding, UTF-8 boundaries, and
      relationships among rules, stems, and dictionary flags. An isolated malformed
      directive is ineffective when the split places it in the word or dictionary span.

      Affix directives and later query processing are distinct UTF-8 consumers. Keep
      their byte spans, decoded-character state, and ownership separate when tracing
      malformed text through the aff/dic and query sides.
  - id: project_lwan
    summary: "Separate Lwan request, template, configuration, and pattern grammars."
    project_names: ["lwan"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. Lwan request and template targets do not share a grammar. A
      request target sends raw bytes through a bounded copy, then requires request
      finalization to accept a complete HTTP or enabled proxy request before the main
      parser runs. Post data, queries, cookies, encodings, ranges, and dates are parsed
      only after the request reaches the required state. Preserve the request line,
      CRLF headers, header terminator, body length, and any proxy preface.

      A template target copies bounded input, appends NUL, compiles it against a fixed
      variable and sequence descriptor, then frees the result. Configuration and pattern
      targets have separate text contracts; bind them rather than reusing HTTP bytes.
      Trace request finalization -> start line and headers -> deferred field parsers and
      cleanup, or template lexer -> variable and sequence lookup -> chunks,
      postprocessing, and free. Count stored header pointers separately from logical
      lines, and preserve delimiter placement for end-boundary faults.

      Configuration lexers track both a cursor and an explicit end. Template rendering
      introduces a separate destination-capacity and termination contract. Preserve
      those source and destination boundaries independently.
  - id: project_mapserver
    summary: "Separate MapServer mapfile and shapefile-set target contracts."
    project_names: ["mapserver"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. A MapServer map target accepts a bounded 10..10240-byte
      artifact, writes it unchanged as a temporary mapfile, loads it, then frees the map
      and resets errors. Supply a complete MAP ... END file and keep nested LAYER,
      CLASS, LABEL, CLUSTER, PROJECTION, SYMBOL, and POINT blocks balanced far enough to
      enter the affected loader. Error-path lifetime faults can require an object before
      EOF, an invalid value, or a repeated directive; a fully valid parse can bypass
      them. Preserve token boundaries, quotes, lengths, and embedded NUL bytes, and keep
      lexer spans distinct from strlen.

      A shape target instead splits one artifact into SHP, SHX, and DBF at two literal
      deadbeef delimiters, opens the three virtual files, and iterates shapes. Preserve
      matching shapefile headers, counts, offsets, record lengths, and companion-file
      relationships. Bind the exported target; map syntax cannot substitute for this
      three-file envelope.

      Projection arguments and symbol point lists are repeated-token collections with
      source-defined limits. Preserve token boundaries and balanced mapfile structure so
      the dedicated loader, not only the outer map parser, receives the collection.
  - id: project_librawspeed
    summary: "Separate RawSpeed containers, decoders, and component envelopes."
    project_names: ["librawspeed"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. RawSpeed separates container parsers, camera-family decoders,
      codec decompressors, and common RawImage, I/O, and metadata layers. Bind the exact
      fuzz target before choosing a carrier. Parser and TIFF-decoder targets consume
      real container bytes, while component or decompressor targets can consume a
      little-endian synthetic envelope. A common component envelope establishes width,
      height, sample type, components per pixel, and CFA state before target-specific
      fields and compressed data. A TIFF prefix cannot substitute for that envelope,
      and the envelope is not a valid RAW file.

      Track dimensions, components, data type, crop or tile coordinates, strip or slice
      indices and lengths, compressed-frame geometry, and the point where RawImage
      storage is allocated. Row and slice paths can require coverage and permutation
      invariants as well as individual bounds: missing, duplicate, or nonconsecutive
      rows may leave storage unwritten or make writers collide. Preserve a verified full
      fixture for parser targets. For component targets, encode every harness-consumed
      field in order and keep the remaining stream consistent with the selected codec.

      RawImage accessors can expose cropped and uncropped coordinate spaces. Keep the
      selected coordinate space, image dimensions, row geometry, and pixel-addressing
      arithmetic explicit rather than transferring assumptions between accessors.
  - id: project_libsndfile
    summary: "Trace libsndfile containers through repeated frame decoding."
    project_names: ["libsndfile"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. A common libsndfile build exports one sndfile fuzzer; similarly
      named standalone-engine and test-input files are support code, not separate raw
      contracts. The complete artifact is exposed through virtual seek/read callbacks
      and opened for reading, so it must be a recognizable libsndfile container with
      codec metadata rather than a bare compressed frame. Opening can decode an initial
      codec block. When open succeeds, the harness checks channel state, allocates a
      float frame, and repeatedly reads frames to EOF.

      Trace container probing -> headers, chunks, and declared sizes -> codec setup ->
      block or frame decode -> endian and sample conversion -> float output -> close.
      Preserve signatures, chunk and table offsets, alignment and padding, channel,
      sample-rate, and block geometry, codec configuration, data lengths, and enough
      payload to enter repeated reads. The checked-in build determines which external
      codecs are reachable. A parser-only header that never yields a frame misses the
      secondary decode path.

      Keep requested frame capacity, actual decoded samples, endian conversion span, and
      block-codec scratch geometry as distinct values across repeated reads.
  - id: project_libxaac
    summary: "Separate libxaac decoder bitstreams and encoder control envelopes."
    project_names: ["libxaac"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. libxaac decoder and encoder targets have different contracts.
      A decoder can treat the complete artifact as an AAC or xHE-AAC elementary stream;
      header shape selects configuration paths, and leading bytes can also control DRC
      while remaining part of the bitstream. Trace API memory tables -> header/config ->
      repeated execute, bytes-consumed, and output queries -> optional DRC gain processing
      -> input-over and cleanup. Control bytes are not automatically removed from the
      codec payload.

      An encoder instead derives codec, sample, and DRC configuration through a structured
      data provider. Scalar controls can come from one edge while samples use the
      remaining reservoir. A separate loudness pass can reread the complete artifact
      before frame encoding, so bytes can be dual-use; this is neither a simple control
      prefix followed by PCM nor an AAC file parser.

      Track provider order, consumed and available input, frame and output sizes,
      channel/layout/count arrays, API allocations, and nested DRC counts. Bind repeated
      decode state or the encoder's configuration, sample reservoir, loudness pass, and
      frame processing; never reuse a decoder seed as an encoder envelope.

      Rare valid module combinations can expose state absent from common paths. Track
      module enablement, DSP buffers, and bitstream-accounting state across every enabled
      predecessor as well as the encoded stream shape.

      MPEG Surround decoding has configuration and frame layers. Spatial configuration
      establishes the tree, channel topology, frequency resolution, parameter-band
      geometry, and residual-coding mode; a later SAC frame supplies parameter sets,
      slots, OTT/TTT data, smoothing, and residual payload. Only a successfully parsed
      frame may update the current spatial state. M1/M2 calculation and smoothing, hybrid
      QMF processing, and residual TNS then consume dimensions derived from both layers.
      Validate every count against the selected tree and each destination matrix before
      copying it into current state, and propagate a parse/configuration error before any
      matrix or residual DSP consumer.

      For decoder construction, bind the outer transport before composing inner bits:
      ADTS, LOAS/LATM, and a raw access unit have different framing and configuration
      ownership. Keep transport-frame length, AAC fill-element length, and spatial
      extension length as separate scopes. Write a per-access-unit timeline showing what
      configuration consumes, what each execute call consumes, and when spatial state is
      committed; a valid configuration payload does not substitute for a later frame
      payload. Round-trip each scope in decoder bit order before runtime testing.

      SBR does not use one interchangeable QMF pipeline. Audio object type, enhanced-SBR
      state, upsampling ratio, low-delay MPS, and harmonic-bandwidth processing select
      legacy or enhanced analysis and synthesis. The enhanced branch has its own
      modulation functions and can finish before the legacy complex-analysis QMF path.
      Bind the executed branch before transferring a QMF hypothesis. For that branch,
      prove the bank's channel/time-slot geometry and initialization of every real,
      imaginary, overlap, and scratch span consumed by modulation.

      Encoder route: samples -> core transform and psychoacoustics -> scalefactor
      estimation -> quantization and bit counting -> rate-distortion -> bit writing.
      AAC and USAC share tables and concepts but use different quantization loops and
      budgets. With SBR enabled, trace QMF -> correlation and tonality -> missing-harmonics
      and envelope compensation -> an ancillary payload that changes the core budget;
      its quotas and differences are producers, not direct PCM gain controls. Treat
      empty or zero-energy bands explicitly, preserve gain/table domains, and stop
      quantization after estimation or accounting errors.
  - id: project_leptonica
    summary: "Bind Leptonica image codecs, native objects, and operation controls."
    project_names: ["leptonica"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. Leptonica targets distinguish generic encoded images from
      native serialized objects. Many component targets pass the complete artifact to
      SPIX image decoding, while box arrays, image arrays, compressed image arrays, and
      recognizer state use their own serializers. Some geometry targets consume leading
      scalar controls, then probe and decode only the remaining bytes as an image; those
      controls are outside that image payload. Bind the exact reader first.

      Trace codec or native serializer -> PIX dimensions, depth, words-per-line,
      colormap, and raster -> conversion or clone -> rotation, scaling, morphology,
      quantization, segmentation, dewarping, border extraction, or recognition ->
      optional image/container write -> cleanup. Preserve row stride and depth, box
      coordinates and counts, component topology, masks, kernels, angles and centers,
      and copied versus borrowed raster ownership. Decoder success is only the first
      checkpoint when the harness applies downstream operations.

      Connected-component and segmentation operations can clip components, serialize
      BOXA or PIXA state, tile or display intermediates, and attach serialized bytes as
      PIX text before later processing. Follow transitive operation calls, not only
      symbols named in the fuzzer. Across memory-stream writers, keep logical size,
      capacity, ownership, and explicit versus implicit terminator initialization
      distinct before a C-string consumer. Orientation and deskew scoring likewise
      maintain separate candidate and aggregate state. Analysis, recognition, and
      display helpers can also emit diagnostic artifacts through image, PDF, or PS
      writers before returning, so follow their internal serialization and compression
      calls even when the fuzzer names no writer. For sub-byte-depth derived PIX data,
      logical pixels do not cover every row-end pad bit; prove that the producing
      operation initializes those bits before export rather than transferring that
      property from an earlier decoded image.
  - id: project_lcms
    summary: "Separate Little CMS ICC, IT8, paired-profile, and direct API inputs."
    project_names: ["lcms"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. Little CMS targets do not share one grammar. IT8-load targets
      pass a complete CGATS or IT8 table. Profile, transform, MD5, and PostScript targets
      require one or more ICC profiles; some split the payload into equal input and
      output profiles. Some targets remove leading machine-word controls before opening
      the remainder, while others reuse controls that remain inside the profile. Direct
      API targets derive numeric objects from bytes and need no ICC carrier. Bind the
      exact split or overlap.

      Trace ICC header and tag table -> typed tags -> curves, LUTs, pipelines, and
      transforms -> output; or CGATS lexer -> properties, formats, rows, references, and
      writer reload. Keep profile size, tag offsets and lengths, duplicate signatures,
      color-space channels, sample format, grid dimensions, intent, flags, curve
      parameters, and output capacity distinct. An ICC profile cannot replace an IT8
      table or byte-derived API target, and one valid half cannot compensate for an
      invalid paired profile.

      ICC CLUT tags carry grid dimensions, while LUT-style tags can carry multiple tone
      curves with independent table lengths. Preserve each dimension or length with its
      owning channel or curve through profile load, pipeline optimization,
      interpolation, and typed-tag writing. Loading and serialization are distinct
      validation boundaries.

      ICC parametric-curve tags carry a function selector and a selector-dependent
      parameter vector. Little CMS also uses internal inverse curve types that are
      produced by pipeline composition, optimization, or reversal rather than read
      directly from the serialized selector. Bind the profile direction, pipeline stage
      order, intent, flags, and selected transform target before transferring a curve
      condition between those phases. A libm infinity, NaN, or domain result is not by
      itself a sanitizer-visible C arithmetic fault; require the authoritative target's
      actual runtime signal.

      Transform creation is an active consumer: it combines input and output pipelines
      with intent, adaptation, colorimetric endpoint, and optimization helpers. Keep
      each helper's return status coupled to every produced value or structure through
      fallback paths; a syntactically valid profile or tag does not prove that later
      transform-construction state was initialized. Black Point Compensation is one
      link-time branch selected by intent and flags: it can query source and destination
      endpoints before any pixel conversion, so bind each profile query's status and
      produced endpoint independently. A clean address- or undefined-behavior-sanitized
      run does not establish that an endpoint was defined after a failed query; close
      that status-to-output edge from source or with an equivalent MemorySanitizer run.
  - id: project_libdwarf
    summary: "Separate libdwarf object-section consumers from raw utilities."
    project_names: ["libdwarf"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. libdwarf fuzzers commonly materialize the complete artifact
      and initialize from a path or descriptor. Structured DWARF consumers usually need
      an object format that exposes the required sections, such as ELF, Mach-O, or PE;
      an isolated DIE or attribute fragment is not enough for those targets. Raw utility
      targets, including direct checksum operations, can instead consume arbitrary file
      bytes without object initialization. Other targets stop after initialization or
      continue into units, DIEs and attributes, line data, location or range lists,
      frames, names, strings, indexes, debug links, or build IDs.

      Bind the target API before deciding which sections are required. Trace object
      format -> section discovery, decompression, and relocation -> unit header version,
      address size, and offset size -> abbreviations and forms -> target consumer ->
      deallocation and finish. Keep section offset and length, unit length, abbreviation
      offset, entry counts, and cross-section references in their own coordinate systems.
      Parser initialization success does not prove that the selected DWARF consumer ran.

      For type units, verify length, version, abbreviation offset, address size,
      signature, and type offset together; the type offset must identify a DIE in the
      unit. Decode final object fields, not generator constants. Path-based targets also
      require a launcher consumption witness before debug-link behavior is relevant.

      Abbreviation parsing is bounded by the loaded `.debug_abbrev` section, including
      LEB128-driven advances. Debug-link path initialization is a separate string and
      filesystem-resolution stage. Keep their section, cursor, and string boundaries
      distinct.

      Frame consumers distinguish `.debug_frame` from `.eh_frame`. Both organize call
      frame information around Common Information Entries and Frame Description Entries,
      with each FDE referring to a compatible CIE; augmentation data, pointer encodings,
      relocation, and address interpretation can differ between the two sections.
      Frame-list and lookup APIs can return arrays and entries associated with a
      `Dwarf_Debug` handle. Keep caller-owned result containers, handle-owned frame
      records, cached indexes, explicit deallocation, and final handle teardown as
      separate lifetime domains.

      DIE reference forms use different domains. The fixed-width and ULEB CU-reference
      forms are CU-relative before conversion to an offset in `.debug_info` or
      `.debug_types`; address and section-offset forms are section-relative; a
      signature reference can resolve through a type unit and change sections. An
      indirect form first selects another form. Bound the encoded value by the physical
      section, require the declared unit extent to fit that section, and then validate
      the resolved DIE in the selected section. A unit-derived end pointer must never
      extend the loaded-section boundary.
  - id: project_libarchive
    summary: "Trace libarchive filters, formats, entries, and drained data."
    project_names: ["libarchive"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. A common libarchive reader fuzzer treats the complete artifact
      as one archive stream, enables broad filter and format support, opens from memory
      or an equivalent one-shot callback, then iterates entries and drains each entry's
      data. That drain can continue through internal compression filters, dictionary or
      window state, sparse regions, split blocks, and entry-to-entry continuation.

      Trace filter bidding and decompression -> format bidding -> archive header ->
      entry metadata -> data blocks -> later accessors -> cleanup. Keep outer filter
      bytes, format headers, entry sizes and offsets, sparse maps, names, link targets,
      encryption state, and decompressed spans separate. Header recognition is not the
      endpoint when the harness drains data or queries metadata. An entry's bytes are
      ordinary member data, not a recursively opened archive unless the exact harness
      does that explicitly.

      Keep RAR and RAR5 reader state distinct. RAR filter state and RAR5
      sliding-window, dictionary, and block state have different ownership and lifetime
      transitions during expansion. The classic RAR marker is exactly seven bytes;
      bytes immediately after it belong to the first archive header rather than the
      marker. When starting from a uuencoded project fixture, verify both the decoded
      marker and acceptance by the checked-in reader before applying a custom block
      parser or mutation.

      Solid archives can carry decompressor tables, distances, write position, window
      allocation, and mask across entry boundaries. For RAR5, track header-advertised
      dictionary and unpacked sizes separately from the allocated window and the bytes
      actually produced. Changing a header size does not make compressed data expand.
      Start from a verified multi-entry solid fixture, preserve continuation semantics,
      encode enough output to cross the intended window transition, and recompute header
      integrity fields.

      RAR5 compressed blocks have an earlier bitstream layer. Huffman-table and symbol
      decoding use a bit cursor and fixed-width lookahead inside the current compressed
      block before any LZ distance is applied. Keep compressed-block size, byte address,
      bit address, lookahead width, decoded symbol, and later sliding-window coordinates
      as separate domains; a valid window relation does not prove that the symbol reader
      stayed inside its input block.
  - id: project_libavc
    summary: "Separate libavc decode streams and raw-frame encoder envelopes."
    project_names: ["libavc"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. libavc fuzzers separate AVC, MVC, and SVC elementary-stream
      decoders from raw-frame encoders. Decoder targets feed a complete H.264-family
      stream through header and repeated frame decode; selected bytes can also choose
      output color, architecture, cores, or target layer while remaining in the
      bitstream. AVC encoders can remove a configuration region before treating the
      remainder as YUV frames, while an SVC encoder can reuse controls in its sample
      reservoir. Bind the exact split or overlap.

      Trace NAL, SPS/PPS, and extension headers -> slices, references, and DPB ->
      prediction, transform, and output planes; or encoder configuration -> memory
      records and header mode -> frame planes -> rate control, motion search, layers,
      reconstruction or NAL-info export -> dynamic changes and drain. Preserve
      dimensions, chroma geometry, strides, NAL lengths, layer IDs, references, consumed
      bytes, frame sizes, QP/GOP/rate state, and resolution-change retry behavior. A
      selector cannot replace the NAL or frame state required by the target consumer.

      CABAC parsing has encoded-length and bit-reader lookahead state. MVC/SVC extensions
      can supply sequence geometry through additional parameter sets, while output
      planes and format conversion use their own geometry. Keep these layers distinct.

      The encoder API has three separate geometry domains: maximum dimensions used to
      size memory records and initialize the codec, active coded/display dimensions set
      by control commands, and the per-call `iv_raw_buf_t` description. The raw-buffer
      descriptor carries a pointer, width, height, and stride for each component; its
      chroma relationships depend on the selected packed, planar, or semiplanar color
      format. A successful initialization does not prove that a later dimension control
      succeeded, and a control failure must not leave a caller-built frame to be
      processed against older active state. Before following motion, conversion, or
      reconstruction code, reconcile allocation maxima, macroblock-aligned coded size,
      display size, every component's geometry, and the API return plus output error
      status at each transition.
  - id: project_libjpeg_turbo
    summary: "Separate libjpeg-turbo JPEG consumers and source-image encoders."
    project_names: ["libjpeg-turbo"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. libjpeg-turbo targets separate JPEG consumers from source-image
      encoders. Decompression and transform targets pass the complete artifact as a JPEG
      stream, parse its header, then decode pixels or coefficients under harness-selected
      precision, scaling, crop, colorspace, or YUV paths. Transform targets can continue
      through lossless coefficient operations and emit another JPEG.

      Compression or cjpeg-style targets instead materialize the complete artifact as a
      supported source image, load its raster, and encode it under harness-selected pixel
      format, subsampling, quality, entropy, restart, progressive, or lossless options.
      They do not accept a bare arbitrary pixel plane unless the exact target says so.
      Trace source loader or JPEG markers -> dimensions, precision, components, tables,
      and scans -> MCU or row buffers -> color conversion, DCT/IDCT or YUV planes ->
      entropy coding and output. Keep pitch, sample size, subsampling geometry,
      scan/restart counts, crop/scaling dimensions, coefficient blocks, and output
      capacity distinct.

      JPEG marker lengths include their length field, and transform paths can copy marker
      segments without decoding pixels. Fast Huffman paths combine bit-reader state with
      table offsets. Preserve marker framing and computed-index domains through the
      selected path.
  - id: project_libjxl
    summary: "Bind libjxl codestream, fields, ICC, entropy, and integration grammars."
    project_names: ["libjxl"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. Native libjxl builds expose separate grammars. A djxl target
      treats the artifact minus trailing controls as a JPEG XL codestream; controls can
      select streaming, pixel layout, callback output, orientation, CPU target, JPEG
      reconstruction, boxes, and later preview, frame, extra-channel, ICC, or pixel
      consumers. A fields target uses a leading selector before one header bitstream.
      An ICC target selects read or write before predicted ICC data or a complete
      profile and can round-trip it. An rANS target derives context parameters before
      the entropy stream. Color-description input is a raw byte string.

      Some integration builds instead export libvips pipelines: any supported image can
      reach libjxl only when loader probing selects JPEG XL, then continue through save
      or transform; mosaic-style targets can reserve tail controls outside the image.
      Bind the built executable rather than every fuzzer source in the tree. Keep the
      codestream or profile span, harness controls, dimensions, channels, orientation,
      stride, extra-channel geometry, box and reconstruction state, entropy contexts,
      and secondary output path distinct.

      Decoder output registration and late pixel conversion share a JxlPixelFormat
      contract covering channel, type, endian, and alignment state. Modular transforms
      can change channel layout and meta-channel counts during apply and reverse replay;
      model both passes.
  - id: project_libgit2
    summary: "Bind libgit2 config, transport, object, pack, patch, and index inputs."
    project_names: ["libgit2"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. libgit2 targets vary by revision. Config consumes text and
      iterates entries. Download-refs exposes the artifact as a smart-transport response
      and downloads into a temporary repository. Objects sends the same bytes to blob,
      tree, commit, and tag parsers without prepending an object header; tree bodies use
      binary mode, name, and OID entries, while commit and tag bodies are structured
      text.

      A packfile target can remove a leading append-checksum control, feed the remainder
      to an indexer, optionally append a hash, and commit. Patch parsing can remove a
      leading prefix-length control before patch text. Commit-graph and multi-pack-index
      targets reserve controls or alignment, optionally append a hash, parse the binary
      carrier, and perform a lookup. Bind the exported executable and exact control split
      first: config, smart protocol, loose-object body, pack, patch, commit-graph, and
      MIDX artifacts are not interchangeable. Trace parse or index -> normalized object
      or repository state -> iteration, lookup, commit, or cleanup; preserve delimiters,
      record counts, object IDs, offsets, fanouts, checksums, and temporary-repository
      ownership through the secondary consumer.

      Loose commit and tag bodies are explicit-length structured text. Header, signature,
      whitespace, and numeric parsing share the same bounded input while maintaining
      their own cursor state.

      Smart-protocol advertisements use pkt-line framing: each record declares its
      complete framed length, while flush and other control records have no ordinary
      payload. An advertised reference carries an object name and reference name; the
      initial advertisement can also carry a NUL-separated capability list. Trace
      stream receive -> retained transport bytes -> complete pkt-line -> reference and
      capability fields. Keep buffer capacity, bytes currently filled, declared record
      span, payload span, and termination of any string-like subfield distinct.
  - id: project_libheif
    summary: "Separate libheif file, raw-box, conversion, and encoder carriers."
    project_names: ["libheif"]
    content: |
      Use these public landmarks as search priors and verify them in source. A file
      target consumes a complete ISO-BMFF HEIF/AVIF artifact, enumerates items and
      metadata, then decodes images. Preserve box nesting, big-endian offsets/counts,
      item IDs, iloc extents, properties, reference graphs, and selected payload. A raw
      box target only iterates boxes; it does not interpret image context.

      Derived items can obtain geometry from properties before coded payload is read. A
      color-conversion target is not a container: its controls describe geometry,
      channels, chroma, colorspace, and plane layout. Keep item properties, plane sizes,
      stride, ownership, and output allocation as distinct state.

      An encoder target uses another envelope: leading controls select quality/lossless,
      optionally codec, and positive dimensions. The harness can allocate and zero fixed
      YCbCr420 source planes rather than take them from later bytes. File, raw-box,
      conversion-plane, and encoder artifacts are not interchangeable.
  - id: project_libplist
    summary: "Separate libplist binary, XML, JSON, and OpenStep parser inputs."
    project_names: ["libplist"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. libplist binds one target to one complete representation:
      bplist is binary plist, xplist is XML plist, jplist is JSON, and oplist is OpenStep
      text. Each passes the artifact and explicit size directly to its matching parser,
      then frees the returned tree. There is no harness prefix, split, or cross-format
      probing. Do not substitute another representation.

      Trace format header or lexer -> container and scalar nodes -> child attachment ->
      root return -> recursive free. For binary plists, preserve trailer fields, offset
      and object tables, reference widths, counts, and object spans. For text formats,
      preserve token bounds, nesting, separators, quoted or escaped strings, numeric
      spans, and data encodings. The artifact is not automatically NUL-terminated; keep
      the explicit parser length distinct from any conversion expecting a C string. A
      root allocation is insufficient for nested-container or cleanup faults: construct
      the smallest complete tree that reaches the specific node transition.

      JSMN-style JSON parsers return a flat token array plus an authoritative produced-
      token count. Treat token type, half-open source span, immediate-child count, and
      the consumer's subtree-advance rule as separate invariants. Parser success does
      not prove a recursive object builder stays within the produced token count; trace
      the token index at every container entry and return, and validate object key/value
      pairing and subtree extent independently. In object traversal, prove the index is
      in range both before fetching the next key and again after advancing from that key
      to its value. A dangling key and an overstated next-pair extent are distinct parser
      states even when both eventually place the cursor one past the produced array.
  - id: project_libredwg
    summary: "Trace LibreDWG format dispatch, object graphs, and writers."
    project_names: ["libredwg"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. A common LibreDWG fuzzer dispatches its input to binary DWG,
      text DXF, or JSON handling; text paths may copy and NUL-terminate the artifact,
      while binary paths use a bit-oriented chain. DWG versions select different
      decoders, spanning header/version -> section locator or page map -> decryption or
      decompression -> bit-coded fields -> classes and objects -> handles, references,
      and extended data. The harness can continue after decoding into DWG, DXF, JSON,
      or other output, so the relevant operation may be a reader, normalized object
      graph consumer, or writer.

      Bind the exact input prefix; prove a harness-controlled writer separately. For a
      continuation route keep one row: format/version and object type; field/group code;
      declared count/size; actual allocation or capacity; cursor and error severity;
      read/write index; and later writer/free-loop bound. Prove why a noncritical error
      continues and name the first consumer of retained state. Before construction state
      the violated inequality, such as write_index >= allocated_elements, and change only
      one count/capacity/index relation. A clamp, CHKCOUNT, critical return, or reallocation
      refutes the route. DXF/JSON cannot substitute for the binary path, and a minimal
      binary header cannot support a late reference or writer without its graph state.

      Text routes still have independent low-level state. JSON string decoding can reuse
      shared bit/text UTF-8 and escape helpers, while DXF parsing uses short-lived pair
      records. Track source and destination spans plus pair-record ownership through the
      selected route. Object and class names can be duplicated, installed into graph
      nodes, or retained from tables; follow each alias across object-construction errors,
      parser rollback, graph cleanup, and optional writer cleanup rather than treating a
      local free as the end of its lifetime.
  - id: project_libraw
    summary: "Trace LibRaw carrier probing, sensor decode, and postprocessing."
    project_names: ["libraw"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. LibRaw fuzzers consume a complete camera RAW carrier,
      optionally after a structured provider removes processing controls from one edge
      and leaves the remaining bytes as file payload. Target names or seed families do
      not force the format; open-buffer probing still selects CR2, NEF, RAF,
      TIFF-derived, or another supported loader. LibRaw and RawSpeed have different
      harnesses and decoder state.

      Trace container and maker-note metadata -> raw offsets and compression -> sensor
      unpack -> thumbnail unpack -> raw-to-image allocation -> repeated processing with
      interpolation and color controls. Keep file-relative offsets, IFD counts,
      strip/tile spans, compressed and unpacked sizes, sensor versus output dimensions,
      pitch, CFA/colors, black and saturation levels, thumbnail state, and image
      ownership separate. White balance, gamma, brightness, flip, output color, denoise,
      and interpolation controls are not file bytes once consumed. Metadata open success
      does not prove raw samples, thumbnail, or demosaic paths ran.

      Loader-specific sensor layout, CFA and color metadata jointly determine allocation
      and sample geometry. In-memory token scanners add a separate delimiter and
      termination contract. Keep those image-layout and text-buffer states distinct.

      Record the return code and state transition separately for buffer open, raw unpack,
      raw-to-image preparation, processing, and output generation. A standalone
      interpolation simulator proves only local arithmetic. After an authoritative clean
      run, instrument the official lifecycle to identify the first non-success stage
      before changing sensor or CFA fields; retain only mutations that move that stage
      deeper.
  - id: project_mruby
    summary: "Bind mruby source, VM, mrbgem, and protobuf target contracts."
    project_names: ["mruby"]
    content: |
      Use these public project landmarks as search priors and verify the configured
      build. mruby core contains parsing and compilation, VM opcode execution, GC, and
      built-in Array, String, Class, Numeric, Proc, and object logic; mrbgems add optional
      behavior that may not be linked. A common mruby fuzzer copies the artifact to a
      size-plus-one buffer, appends NUL, loads it as Ruby source, then closes the
      interpreter. Its artifact is source, not bytecode. A protobuf target first converts
      a structured protobuf value into Ruby source and has a different raw contract.

      Build the route as source text -> parse and code generation -> VM opcode or
      Ruby-visible method -> heap or stack state -> interpreter cleanup. Use the smallest
      Ruby operations that create the preconditions. Track signed indexes and counts,
      array length, capacity, and tail updates, shared-string flags and aliases, bigint
      initialization, call-frame or argv aliases across stack growth, and GC or exception
      transitions. Large literals or loops do not control bytecode widths, register
      indexes, or allocation geometry unless the compiler path proves that mapping.
      Embedded NUL and syntax errors can stop a source harness before the claimed state.

      Runtime evaluation is a second compiler entry, not merely another VM call. An
      outer Ruby program can pass a string through the optional eval mrbgem, which
      parses and generates a fresh procedure before executing it. Keep the outer source
      scope, the evaluated string's scope, and their generated instruction streams
      separate; a construct that is preceded by setup instructions during top-level
      loading can be first in a freshly generated runtime scope.

      Keep direct method availability, missing-method fallback, and capability-query
      hooks as separate lookup states. Test the named lookup state before defining a
      user hook: adding a method or fallback changes absence into presence and can turn
      a small lookup distinction into unrelated recursion. Record whether the observed
      result is presence, a false query result, or an exception before pursuing VM
      lifetime or stack behavior. A call site that interns or dispatches a method symbol
      does not prove that the method is defined; inspect class/module initialization and
      the active ancestor chain for the registration. Treat a default capability-query
      hook as a conservative public contract: a global hook that reports every queried
      method as present changes object semantics and cannot serve as a neutralization of
      a missing default unless the checked-in API contract establishes that behavior.

      VM opcodes can call helpers that re-enter Ruby, allocate, or run GC, creating a
      lifetime boundary for internal frame metadata. Optional bigint values have separate
      presence, limb-count, and limb-storage state.
  - id: project_mupdf
    summary: "Trace MuPDF from PDF structure through streams and rendering."
    project_names: ["mupdf"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. A common MuPDF PDF fuzzer wraps the full artifact in a memory
      stream, opens it with the PDF document handler, visits pages, and renders them to
      a pixmap. The route spans memory stream -> PDF lexer, parser, xref, and repair ->
      objects, streams, filters, and resources -> page interpreter -> Fitz color,
      drawing, raster, and pixmap code. A late rendering operation therefore needs a
      coherent document and page state, not an isolated object or operator.

      Localize the current constraint to one layer: object/xref/trailer/page-tree
      structure; declared stream length, filter chain, decryption, or decompression;
      resource lookup and content operators; or image dimensions, stride, color, and
      transparency during rendering. Track MuPDF exceptions and always-cleanup paths
      separately from memory-safety faults. Resource rejection, parse repair, and a
      caught exception are checkpoints, not proof of the target invalid operation.

      MuPDF's `fz_try`/`fz_always`/`fz_catch` layer uses non-local exits. A local
      assigned after entering `fz_try` and later read or dropped during cleanup must
      satisfy the project's `fz_var` lifetime rule. Track whether each cleanup handle
      was initialized before the try or assigned inside it, and whether every partially
      constructed prefix is valid for drop. Draw devices separately keep graphics state
      in a growable stack. Treat pointers to entries or fields as invalid across a push
      that may grow storage, and bind later clipping, group, knockout, raster, or
      emergency-cleanup reads to post-push state.

      Page loading parses links, actions, and file-spec strings before rasterization.
      Content execution separately maintains processor stacks across nested forms,
      save/restore, clipping, and layers. Include both early metadata and later stack
      state in the route.

      PDF xref state can come from classic tables, xref streams, repair, incremental
      sections, or transient local overlays. Track the trailer object count, logical
      xref length, section ranges, and index allocation capacity as separate values.
      Lazy resources and appearance updates may create overlay state only during page
      loading or rendering, so an unreferenced but valid object does not prove that state
      transition occurred.
  - id: project_ndpi
    summary: "Separate nDPI raw-packet and complete-capture target contracts."
    project_names: ["ndpi"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. nDPI has distinct raw-packet and capture-reader contracts among
      other direct target grammars. A packet target can pass the complete artifact to
      protocol detection with one newly created flow; it does not prepend pcap global or
      record headers. A reader target instead opens a complete pcap through libpcap,
      obtains datalink and record metadata, and sends each packet through a workflow that
      can enable tunnels, guessing, flow statistics, and serialization. A raw packet is
      not a reader fixture, and a pcap envelope is not part of a direct packet target.

      Trace outer contract -> datalink and L2/L3/L4 parsing -> tunnel -> protocol
      dissector -> flow state -> give-up, guess, or serializer. Keep capture length,
      original wire length, protocol-declared length, and actual remaining bytes as
      separate values. Prove whether the harness creates one flow per artifact or
      retains a multi-packet workflow before relying on direction, reassembly,
      conversation history, or cleanup order.

      Do not default every nDPI target to packet or pcap input. Configuration,
      serialization, certificate, QUIC, and helper targets can expose independent direct
      contracts; bind their exact harness grammar before applying the packet pipeline.

      The QUIC crypto-data target is not a UDP packet. A leading word selects a QUIC
      version family, and the remaining bytes are already-clear frame payload passed to
      get_crypto_data. That stage parses version-specific stream or CRYPTO framing and
      may reassemble fragments. Legacy GQUIC sends the recovered span to its CHLO tag
      table; IETF QUIC sends it to TLS ClientHello parsing, where the QUIC transport-
      parameter extension contains another sequence of QUIC-varint identifiers and
      lengths. Keep frame, reassembled crypto, TLS extension, and transport-parameter
      ends distinct, and validate each varint width against its immediate container.

      In the HTTP dissector, headers such as Content-Type and Host can branch into
      subprotocol and hostname matchers. Preserve the explicit header slice across those
      secondary dispatches.

      SoftEther discovery can parse an ASCII payload shaped as an IP field followed by
      a PORT field. Treat the field separator as a boundary, not as a reusable length:
      the address span ends at the separator, while the port span starts after the full
      separator and ends at the payload boundary. Validate the separator's lower bound
      before subtraction, bound each copy by its own source remainder and destination
      capacity, and reserve any terminator separately.
  - id: project_open62541
    summary: "Bind open62541 binary messages, typed decoders, JSON, and controls."
    project_names: ["open62541"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. open62541 targets have different envelopes. A binary-message
      target can reserve the last four bytes for an allocation limit, then pass the
      remaining OPC UA TCP message to a fresh server before shutdown. Do not assume an
      existing channel, session, subscription, or queue unless the harness or bytes
      create it. Binary-decode envelopes vary by revision: the type selector can be one
      or two bytes; allocation controls can be absent or taken from the last four bytes.
      The decoded span can exclude that tail or, in one revision, a leading
      four-byte region; later bytes can select an offset or a secondary ExtensionObject
      decode. Bind the exact cursor order. JSON targets consume a JSON Variant and can
      round-trip it; utilities can add another selector.

      Numbered files inside one binary-message corpus subdirectory can be consecutive
      chunks of one stateful transcript, not interchangeable standalone seeds. Preserve
      and concatenate the validated earlier chunks when a later service depends on their
      connection, channel, or session state; mutate only the selected later chunk. An OPC
      UA TCP HEL chunk carries protocol version, receive/send buffer sizes, maximum message
      and chunk counts, and an endpoint URL after its transport header, so a bare channel-
      style header is not a complete HEL. Keep the channel, token, sequence, and request
      identifiers of later secure-channel chunks consistent with the same transcript.

      Trace transport chunk -> secure-channel and service headers -> typed request ->
      server state and deferred cleanup, or type selector -> binary fields, arrays,
      NodeIds, Variants, and ExtensionObjects. Keep message lengths, selector width,
      type indexes, namespace and encoding IDs, array counts, cursor offsets, ownership,
      allocation controls, and any secondary pass distinct. A service body cannot
      replace its transport and session state, and JSON cannot replace binary encoding.

      Direct typed-value targets can continue from binary decode through copy, ordering,
      re-encoding, and clear. Generated structure metadata distinguishes inline scalar
      members, length-plus-pointer arrays, optional pointers, and optional arrays while
      also carrying member padding. Bind each traversal to that representation; keep
      Variant null/empty semantics separate from structure-member layout.

      Server configuration, network setup, delayed callbacks, and shutdown are lifecycle
      surfaces distinct from message decoding. Track network handles, captured server or
      session state, and teardown ownership across those phases.
  - id: project_opensc
    summary: "Navigate OpenSC card, PKCS#15, ASN.1, and driver-specific state."
    project_names: ["opensc"]
    content: |
      Verify these public landmarks in the task source. Classify the harness before
      constructing bytes. A direct ASN.1 target consumes parser fields. A reader/card
      target models transport: its first record supplies ATR or reader state and later
      records supply one response per APDU. A PKCS#15-init target commonly combines
      profile text with that reader stream at a NUL boundary. Read the exact record order,
      length encoding, status-byte rule, and selector prefix from the checked-in harness,
      then decode the emitted carrier back through that same contract. Do not transpose
      one carrier family into another.

      For reader or profile flows checkpoint connect -> runtime driver selection ->
      PKCS#15 internal or synthetic bind -> ODF/TokenInfo/DF reads -> object
      materialization -> the task consumer. Confirm the selected driver and profile
      operations at runtime; an ATR match, source filename, or local driver build is not
      enough. Build an APDU command/response table from the current execution. Probe
      counts and bind traffic depend on driver and state, so never reuse a fixed transcript
      from another task. Binding alone may leave the object list empty; prove the required
      object or file was produced before mutating its consumer.

      The synthetic reader consumes one length-prefixed chunk for each connect or APDU
      exchange. On transmit, the final two chunk bytes are status words and only the
      preceding bytes are response data. Keep chunk length, response-data length, copied
      length, status words, returned response length, inner BER-TLV length, and fixed
      destination size distinct. A success result does not prove that a fixed response
      object is complete.

      An `sc_path_t` is more than path bytes: it also carries a path type, optional AID,
      and PKCS#15 index/count slicing state. Profile-created paths, ASN.1-decoded object
      paths, and the path returned by a successful card-driver selection are different
      producers. Drivers may interpret file IDs, DF names, absolute paths, or
      current/parent-relative paths differently and may add or remove a parent file ID.
      Preserve the path type across each conversion; prove the lower bound before reading
      or removing a terminal file ID, and keep file-path length separate from index/count
      within the selected file.

      PKCS#15 initialization has distinct create, store, finalize, sanity-check, and
      erase stages. Erase can rebind card state and dispatch a driver-specific operation;
      profiles supply MF, application DF, DIR, PIN, and auxiliary paths and ACLs. A
      driver may select and authenticate a parent path before deleting a terminal file
      identifier. Track the selected file, complete `sc_path_t`, derived parent,
      authentication result, and delete request separately. Reaching creation does not
      prove that erase consumed the same path producer.

      On-card key generation crosses several ownership and type boundaries.
      Generation prepares PKCS#15 metadata, invokes profile and card operations, then
      encodes the returned key. A card response may populate an algorithm-dependent
      union first. Keep requested algorithm, response-reported algorithm, populated union
      arm, lengths, and final key type distinct. Require complete status and initialized
      owned output; a logged parse failure is not usable key material.

      Profile parsing must produce the required MF/AppDF/templates and valid ACL/path
      gates before card operations. `sc_pkcs15init_unbind` is active cleanup: a dirty
      profile can update last-update or TokenInfo through a card-specific emulation hook
      before profile state is freed. An AuthentIC hook selects a cache file, obtains
      challenge bytes, derives a binary-update span from selected-file metadata, and
      writes it. Keep selected-file ownership, result status, challenge buffer, file size,
      and update span valid through the last consumer. Stop a route when the authoritative
      target stays clean or its producer is unreachable.
  - id: project_opensips
    summary: "Bind OpenSIPS message, URI, and CSV parser boundary contracts."
    project_names: ["opensips"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. OpenSIPS parser targets have distinct boundaries. A message
      target passes the complete artifact and explicit length to parse_msg without
      adding a terminator; a valid SIP request or response line is normally required
      before header-specific paths. A URI target copies the whole artifact, appends NUL,
      and passes an explicit span. A CSV target consumes one leading selector,
      NUL-terminates only the remainder, and chooses a parser mode. Bind the exact target
      before reasoning about end bytes.

      Trace start line -> header dispatch -> header-specific state -> body and
      content-length relations -> cleanup; or URI scheme -> user, host, port, parameters,
      and headers. Keep pointer/end spans, CRLF delimiters, quoted and escaped regions,
      compact header aliases, declared body length, and owned versus borrowed slices
      distinct. Error logging and cleanup can still consume a failed message. A bare
      header or URI fragment cannot substitute for its outer grammar.

      For message targets, refine the route through generic header-field dispatch to the
      selected header parser. These parsers and their diagnostics share explicit spans
      but can maintain different cursor and error state.
  - id: project_openthread
    summary: "Bind OpenThread radio, NCP, CLI, and IPv6 injection contracts."
    project_names: ["openthread"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. OpenThread targets bind distinct entrypoints. Radio targets
      pass the complete artifact as an IEEE 802.15.4 PSDU; NCP targets pass a UART/HDLC
      stream into Spinel framing; CLI targets append termination and parse command text.
      An IPv6-send target can consume a link-security selector and append only the
      remainder to an outbound message. A standalone TLV cannot substitute for the
      outer interface and initialized instance state.

      Trace radio frame -> MAC security/addressing -> 6LoWPAN and IPv6 -> MLE, TMF, UDP,
      or application handling; HDLC -> Spinel header, command, and property -> NCP state;
      or CLI lexer -> command handler. The Thread instance can continue through tasklets,
      platform events, timers, and reset checks after injection. Keep captured length,
      MAC and IPv6 length fields, checksums, security state, HDLC escaping/CRC, Spinel
      packed integers, and instance ownership distinct. Accepted syntax is not the final
      checkpoint when deferred tasklets drive the consumer.

      NCP dataset property writes flow from Spinel decoding into operational dataset TLVs,
      validation, storage, and later readers. MeshCoP TLVs have type-specific layouts.
      CLI CoAP commands separately reach block-option integer encoding.
  - id: project_openvswitch
    summary: "Separate Open vSwitch packets, OpenFlow messages, and text grammars."
    project_names: ["openvswitch"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. Open vSwitch targets vary by revision. Flow-extract and
      miniflow targets consume raw packet bytes and exercise flow maps, masks, hashes,
      matches, formatting, and round trips. OpenFlow-print consumes binary messages,
      each bounded by its header length, and dispatches nested actions, properties,
      statistics, and port decoders.

      JSON, OVN expression or action, and ODP targets require a final NUL. Expression
      and ODP inputs reject a newline within the C-string prefix; an earlier NUL can
      truncate parser-visible text so later bytes are ignored rather than rejected.
      Expression input can continue through parse, annotate, simplify, normalize,
      matching, action encoding, format and reparse, lexer round trip, and packet
      construction. ODP parses keys, masks, and actions and formats them back. An ofctl
      target can reserve the first byte as a flow-mod command and treat the remainder as
      a NUL-terminated flow string. Bind text versus raw packet versus OpenFlow binary
      before construction, then preserve message lengths, nested attributes, flow maps,
      mask geometry, delimiters, and the selected secondary round trip. An OpenFlow
      header alone rarely reaches a nested consumer.

      OpenFlow match encoding mutates `ofpbuf`-backed messages and therefore has both
      logical-message and backing-buffer state. The OVN expression lexer stores numeric
      and mask literals in bounded token storage. Treat these as separate mutation and
      tokenization routes.
  - id: project_pcapplusplus
    summary: "Trace PcapPlusPlus from complete capture files into packet layers."
    project_names: ["pcapplusplus"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. PcapPlusPlus builds expose one target. It writes the complete
      artifact to disk as a classic pcap file, opens it with PcapFileReaderDevice, reads
      a record, and constructs a Packet for layered parsing. A raw Ethernet or IP frame,
      or a pcap global header alone, does not reach that consumer.

      Preserve global magic and byte order, version, snaplen, and data-link type, then at
      least one complete record header with captured and original lengths plus captured
      bytes. Trace link framing -> VLAN or network discriminator -> IPv4 header length,
      total length, and fragmentation -> transport offset -> payload protocol. Keep the
      outer captured length, IP length, and inner header lengths consistent until the
      selected consumer. For IPv6, treat admission of the fixed 40-byte base header
      separately from extension-chain walking; each extension's next-header and length
      fields remain bounded by the captured bytes left after the base header. Packet
      construction recursively creates protocol layers: UDP
      dispatch can instantiate SIP, which retains offsets into the same payload, or DNS,
      which walks bounded labels and compression pointers. Treat capture record iteration
      count as a harness-version question; rely on later packets only when source proves it.
  - id: project_ots
    summary: "Trace OpenType Sanitizer font parsing, serialization, and TTC passes."
    project_names: ["ots"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. OTS builds expose one sanitizer target. It passes the complete
      artifact to the OpenType Sanitizer, which detects a supported SFNT, webfont, or
      collection carrier, parses its tables, and serializes sanitized output into a
      bounded expanding memory stream. If the first pass accepts a font collection, the
      harness can seek the output stream back and process the original artifact once per
      declared face. There is no harness selector or raw individual-table contract.

      Trace outer signature -> offset table or collection directory -> table directory
      and decompression -> table-specific parse and cross-table validation -> sanitized
      table serialization. Preserve file and table spans, alignment, checksums, table
      order and uniqueness, face indexes, glyph and loca relationships, maxp version,
      variation axes and counts, Graphite compression geometry, and the output growth
      limit. A valid isolated table cannot replace the enclosing font, and first-pass
      acceptance is not the final checkpoint for collection reprocessing or table output.

      Keep the per-font table registry consistent with the tables that survive parsing
      and cross-table validation. Variation data crosses compact on-disk counts, bounded
      input spans, and serialized-output sizes; keep those numeric domains distinct.
  - id: project_php
    summary: "Bind PHP source, serialization, and extension target grammars."
    project_names: ["php"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. PHP fuzz targets do not share one grammar. Parser, execute,
      and JIT targets can treat the artifact as PHP source through a fuzzer SAPI and
      compile it into a Zend op-array; parser targets stop after compilation, while
      execute and JIT targets continue under harness step, string-size, and I/O limits.
      Unserialize targets consume PHP serialization. Hash-unserialize targets can split
      update bytes from serialized state and call update/final only after restoring the
      right object. JSON, mbstring conversion, EXIF, and other extensions have separate
      buffer or field envelopes.

      Trace request startup -> exact parser, unserializer, or extension -> zval, object,
      or op-array -> optional opcode execution, JIT, or function -> destructor, GC, and
      request shutdown. Do not reuse raw PHP source for serialization or binary extension
      targets. Compilation, object restoration, and extension initialization are
      different checkpoints; prove the target's later consumer before mutating its state.

      Source execution can end normally or through a harness step-budget bailout.
      Iterator, object-store, and fiber cleanup can run during unwind, so include
      suspended stacks and temporary iterator state in both lifecycle paths.
      Registered shutdown callbacks and object destructors are distinct request-shutdown
      phases: marking objects as already destructed suppresses object destructors, not
      arbitrary registered callbacks. When studying bailout cleanup, bind each later
      action to the shutdown phase and state transition that can actually enable or
      suppress it.
  - id: project_poppler
    summary: "Trace Poppler from PDF structure through full-page rendering."
    project_names: ["poppler"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. A common Poppler PDF fuzzer opens the full artifact as raw PDF
      data. A document that remains locked after encryption handling can exit early;
      an opened document can create a page renderer, visit every page, and render through
      Splash. The route is lexer/parser -> xref, objects, and streams -> catalog and page
      tree -> graphics operators and resources -> fonts, images, and filters -> Splash
      output. A late rendering route therefore needs a coherent document and page state.

      Localize constraints to object/xref/trailer/page-tree structure; stream length,
      filters, or decryption; resource references; font tables; image geometry; or
      path, clip, and raster state. Use the current build's codec, CMS, and rendering
      backends rather than assuming an external decoder is linked. Normal rejection, a
      locked document, or an empty page is a checkpoint, not proof of the invalid
      operation. Parser success alone does not prove that page creation or rendering ran.

      Metadata, font iteration, linearization hints, and other non-rendering APIs can
      trigger filters and decryption before page rendering. Track encryption state and
      each stream's offset/length window through those early consumers.

      Poppler also exposes memory-backed streams with bulk-read operations. Keep their
      begin, current, and end pointers ordered as a half-open span before subtracting
      pointers or converting the available distance to a copy count. A syntactically
      valid stream dictionary does not prove that a derived memory view preserves that
      relation when metadata or another early API consumes it.

      Damaged-file repair can reconstruct or resize XRef while an indirect object is
      being resolved. Stream parsing can cross Parser -> dictionary lookup -> XRef
      fetch/repair -> resumed Parser when `/Length` is indirect. Keep the logical object
      number and generation distinct from any transient location in XRef storage across
      that transition.

      Encryption has separate handler-object, parsed-valid, authorization, and installed
      XRef states. `SecurityHandler::make` can return a Standard handler without usable
      key material; a non-null handler or an unencrypted decision does not prove that its
      file-key pointer, length, version, revision, and algorithm form a valid joint result.
      Linearized documents add a side route: page or font access can build Hints, combine
      hint ranges into a memory stream, and call Parser with that handler tuple directly,
      independently of XRef's installed encryption state. Keep handler validity, the
      initialized key span, reported key length, object/generation-derived stream key,
      DecryptStream reset, and downstream filter state distinct.
  - id: project_samba
    summary: "Separate Samba binary, text, NDR, compression, and access inputs."
    project_names: ["samba"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. Samba fuzzers do not share an SMB wire grammar. Binary targets
      can consume complete LDAP ASN.1, NMB, registry, compression, or NDR data. Many
      string targets copy or length-bound bytes and append NUL before parsing credentials,
      bindings, SDDL, LDB filters, or LDIF. File and stream targets for configuration,
      schema, or registry instead preserve an explicit span. An SDDL access target can
      also read the last four bytes as a little-endian mask while they remain inside the
      string. Generic or type-only NDR dispatch requires a four-byte little-endian header
      of 16-bit flags plus a 16-bit function index; an executable fixed to both type and
      function omits it. Bind the built executable and specialization.

      Trace decode -> allocated graph -> access check, encode or format round trip, NDR
      pull -> push -> print, or decompress -> compress verification. Preserve NDR32/64
      and IN/OUT/STRUCT flags, function index, conformant counts, pointer referents,
      string termination, SDDL and token relations, compressed and output lengths,
      talloc ownership, and shared input/output fields. A valid prefix is insufficient
      when later push, print, or access-check code consumes the other side of a structure.

      Generated fuzz_ndr_<interface>_TYPE_OUT targets bind the interface, object type, and
      pull direction at build time; their artifact starts at that NDR object, not at an SMB
      request or RPC transport header. In DRSUAPI, a compressed DsGetNCChanges response
      selects an inner counter and MSZIP or XPRESS through a discriminated union. Its
      wrapper carries compressed and decompressed lengths, opens a compression subcontext,
      and then parses the recovered Ctr1 or Ctr6 bytes as NDR again. Keep the outer NDR
      cursor, compressed-chunk headers, codec input/output, and recovered NDR cursor as
      separate spans. Reaching the codec does not prove the inner counter is valid.

      NetBIOS names combine length-prefixed labels with two-byte compression pointers;
      keep label, pointer, and target spans distinct. Compression round trips add separate
      source, produced-size, and codec-status domains to the carrier.
  - id: project_selinux
    summary: "Separate SELinux source-policy, binary, and label target grammars."
    project_names: ["selinux"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. SELinux/libsepol targets have distinct grammars. A CIL target
      can treat the whole artifact as policy text, add it, compile and resolve symbols,
      build or optimize a policy database, then write a result. A checkpolicy-style
      target can consume a harness control prefix followed by legacy source policy,
      select target platform, MLS mode, and policy version, then parse, link, expand,
      validate, write, or convert it. A binary-policy target loads policydb data and
      follows kernel or base/module validation, linking, expansion, assertions,
      hierarchy, and optimization.
      These source and binary formats are not interchangeable.

      Text and compiled label targets can use another harness envelope: controls, one or
      more file-context database fragments, and a lookup key, followed by sort and lookup
      operations. Bind text versus compiled label data and the fragment split exactly;
      neither is a raw policy grammar.

      Trace the selected grammar -> parser or reader -> AST, symbol, or policydb state ->
      resolve/link/expand/validate/optimize -> writer or converter -> cleanup. Preserve
      policy version and type, symbol counts, bitmap and avtab spans, conditional and
      constraint references, MLS/context state, and module/global relationships. Reader
      success is not the last checkpoint when the target continues into a secondary
      writer or converter.

      Before later CIL state, parse against checked-in examples, especially named
      identifiers versus anonymous class-permission expressions. Binary validation can
      walk value-indexed slots. CIL lists can borrow symbol-table or AST elements, so
      track container and shared-element ownership separately through optional disable,
      reset, repeated resolution, and teardown.
  - id: project_serenity
    summary: "Map SerenityOS fuzz targets to their exact Lagom library contract."
    project_names: ["serenity"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. SerenityOS/Lagom fuzzers span distinct libraries: image and
      audio codecs, archives and compression, ELF, Wasm, fonts, JavaScript, SQL, Shell,
      Regex, HTTP and IMAP, URL, Markdown, text codecs, and others. The project name
      does not define an input grammar. Map the concrete Fuzz target to its linked Lagom
      library, entry API, parser state or object, and any later enumerate, decode,
      render, or execute step.

      Many targets pass the whole artifact as bytes, text, or a memory stream, but their
      completion semantics differ. One may only construct a parser; another may visit
      every archive member or image frame, drain all audio samples, or execute only
      after syntax succeeds. For containers, preserve headers, tables, counts, offsets,
      and lengths. For streams, track cursor and remaining span. For text, preserve
      encoding and termination rules. Treat Optional, ErrorOr, caught exceptions, and
      normal rejection as checkpoints rather than memory-safety failures, and never
      reuse another Serenity target's format assumptions.
  - id: project_skia
    summary: "Separate Skia encoded images, serialized objects, and Fuzz cursors."
    project_names: ["skia"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. Skia targets expose three incompatible carriers. Image and
      animated-image decoders take a complete encoded image selected by codec probing.
      Region, path, text-blob, and image-filter deserialize targets take Skia serialized
      object bytes and can continue into checks or raster drawing. Drawing, gradient,
      canvas, GPU, filter-API, region-set-path, and image-encoder targets instead consume
      an internal Fuzz cursor that derives scalars, geometry, pixels, paint, and options;
      those bytes are not PNG, JPEG, or WebP files. Bind the exported executable first.

      Trace encoded image -> codec -> frames -> surface draw; serialized object ->
      SkReadBuffer or flattenable registry -> validity check -> draw or use; or Fuzz
      fields -> object graph -> render or encode. Preserve version, available bytes,
      object counts, dimensions, row bytes, color type and alpha, matrix and clip state,
      flattenable tags, nested lengths, and cursor exhaustion. A pointer advanced past
      the end is not a crash if the reader invalidates and the harness returns; prove a
      later consumer runs. Encoder target names describe output, not input.

      Paths are often consumed indirectly through paint and text operations. Dash-style
      path effects construct `SkPathMeasure` and extract measured segments; text-on-path
      measures a follow path and maps nonempty glyph outlines through position and
      tangent queries. Merely accepting a conic into `SkPath` does not prove its
      subdivision or evaluation ran. Bind the effect or glyph producer and require
      usable downstream geometry. Treat conic evaluation and chopping as fallible
      transformations whose outputs must be both successful and finite before reuse.

      Picture shaders are lazy. A recorder must produce a nonempty picture; empty
      recording can collapse to an empty shader before picture-shader code executes. At
      draw time, the CTM and local matrix determine raster tile geometry, cached image
      generation, and scale adjustment before the selected context or raster pipeline
      consumes the shader. A helper returning a shader plus matrix or scale output has a
      joint result contract: validate every output on all successful return paths. Prove
      that the concrete shader survives construction and reaches the selected draw
      pipeline rather than relying on the serialized or fuzzed shader tag.
  - id: project_wireshark
    summary: "Bind Wireshark dissector targets to the correct protocol layer."
    project_names: ["wireshark"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. Wireshark's epan layer owns protocol registration, dissector
      tables, packet-buffer views, protocol trees, conversations, and scoped memory;
      protocol implementations live mainly under epan/dissectors. Bind the generated
      fuzzshark target exactly. A direct target selects a registered dissector, while a
      table-qualified target uses that table to locate its handle. Common harnesses pass
      one raw tvbuff with captured and reported lengths equal to artifact size; that is
      not a pcap and does not automatically add outer Ethernet, IP, TCP, or UDP headers.

      Start at the layer named by the target: an IP target needs IP, an ip-protocol
      target starts with the selected protocol's own header, and a port target starts
      with the application protocol. Confirm the versioned build and harness because
      bindings can change. Track tvb subsets, captured versus reported length, protocol
      length fields, endian conversion, item counts, and nested-dissector handoff. Reassembly,
      desegmentation, multiple packets, conversation history, or deferred callbacks need
      explicit proof that the selected target preserves the required state.

      Some generated targets place an integer selector outside the protocol payload and
      use it to choose a dissector-table entry; preserve that outer prerequisite separately.
      Conversation state retained across packets introduces longer-lived key ownership
      and value-type expectations than packet-local dissection.

      Generated ASN.1 dissectors require a separate state ledger: outer message and
      procedure dispatch -> presence/choice -> IE handler -> local-state assignment ->
      first consumer. Reaching the protocol tree does not prove that a local was assigned.
      From one valid fixture, change one source-backed presence, order, or choice relation;
      read back the outer message, procedure, captured/reported lengths, and selected IE.
      Require a same-run witness that the producer was skipped while the consumer ran.

      COTP can be dispatched directly from the IP protocol table rather than through a
      TCP or UDP port. Its length indicator separates the TPDU header from remaining
      user data, and the TPDU type selects connection setup, data, or another control
      family. CR/CC have fixed references and class state plus optional variable
      parameters, whereas DT couples its data span to end-of-TPDU, fragmentation, and
      reassembly state. Keep the fixed header, variable parameters, raw remainder,
      reassembled tvbuff, and heuristic subdissector handoff as separate boundaries.

      The versioned DNS name route is `expand_dns_name` / `get_dns_name` ->
      `format_text` -> RR-specific tree construction. Encoded labels, compression
      pointers, and legacy extended labels can make bytes consumed from the tvb, the
      expanded byte span, and the formatted C-string length differ; keep all three plus
      terminator semantics distinct. An SRV RR interprets its owner as
      `_service._proto.name` for presentation, while its RDATA separately carries
      priority, weight, port, and a target name. Token-vector cardinality belongs to the
      formatted representation; neither the RR type nor a consumed wire name proves
      that service, protocol, or name tokens exist.
  - id: project_wolfssl
    summary: "Separate wolfSSL protocol, certificate, API, and Cryptofuzz envelopes."
    project_names: ["wolfssl"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. wolfSSL builds expose unrelated envelopes. TLS client/server
      and wolfSSH targets feed protocol bytes through in-memory I/O; a client can reserve
      a tail control for method selection. The ordinary public wolfSSL server target has
      no corresponding method selector: it resets the same raw receive-byte span to byte
      zero for each configured TLS or DTLS server method, creates a fresh connection, and
      runs the handshake independently. A failed handshake can still encode an alert and
      drive the in-memory write/send callback before application reads or writes become
      available, so keep receive parsing, alert construction, buffered output, and the
      harness callback as distinct stages. Only a successful handshake continues into
      application reads and writes. CRL, OCSP, and X.509
      targets consume DER-like objects and can continue through key or object decoding,
      OCSP-request encoding, and DER-to-PEM conversion; a legacy certificate target can
      expect PEM. Misc, RSA, and SRP targets use operation selectors and structured
      controls rather than a network transcript.

      Cryptofuzz executables use its structured operation envelope, not TLS or
      certificate bytes. They dispatch bignum, DH, ECC, and signature operations to
      wolfCrypt or its OpenSSL layer. Builds can vary math backend and word size or use
      an oracle comparison; randomized TLS builds retain the protocol envelope. Bind
      the exported executable, selectors, lengths, key material, backend, and later
      encode/decode, sign/verify, or handshake path. Do not infer the carrier from a
      wolfSSL source function or from unbuilt fuzzer sources alone.

      Keep the Cryptofuzz driver schema separate from the public wolfSSL API fuzzers
      described below. Cryptofuzz operation identifiers and component serialization
      belong to its versioned driver and generated/public definitions; a
      fuzzing-headers `Datasource` layout from a direct API fuzzer is not evidence for
      that envelope. Bind the operation and field order from disclosed source or build
      artifacts. If those artifacts are absent, leave dispatch unresolved instead of
      guessing identifiers or transferring another harness's field sequence.

      Arithmetic targets may also identify a math backend and exercise radix parsing and
      re-encoding without entering a protocol stack. Track input digit spans, sign/radix,
      backend word representation, and encoded-output capacity as distinct domains.

      The public RSA API fuzzer uses fuzzing-headers `Datasource`, not a bare radix
      string. Every `Get` or `GetData` operation first consumes a little-endian 32-bit
      declared length. A scalar `Get<T>` clamps that length to `sizeof(T)` and then
      consumes the scalar bytes, so scalar controls still need their own four-byte frame
      prefix; they are not adjacent bare bytes. The RSA harness consumes message data,
      a framed 16-bit output size, framed one-byte hash, padding, mask-generation and
      operation controls, then three framed booleans selecting fixed P, Q and E values.
      Non-fixed P, Q and E and the always-supplied D are separate framed hexadecimal
      strings. In the public harness switch, operation 0 is public-encrypt-ex, 1 is PSS
      sign, 2 is SSL sign, 3 is SSL verify, 4 is PSS verify, 5 is PSS padding check, and
      6 is PSS verify-check. Only operation 0 then consumes a label data frame, while
      operations 5 and 6 consume a signature data frame; operations 1 through 4 do not
      consume another datasource field. Reconstruct this complete envelope and preserve
      every frame and component boundary; raw hexadecimal text alone is not equivalent
      to the exported RSA target input. Treat this mapping as versioned public harness
      knowledge and re-check it when the exported target or wrapper revision differs.
  - id: project_upx
    summary: "Bind UPX packed carriers and list, test, or decompress depth."
    project_names: ["upx"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. UPX fuzzers commonly materialize the complete artifact as a
      file and invoke list, test, or decompress mode without slicing a control prefix.
      All modes dispatch among executable-format packers. Recognition and can-unpack
      checks can stop at the outer header, loader metadata, or format tables; later test
      and decompress block paths require coherent packed state. Listing can stop after
      recognition and pack metadata, testing runs unpacking without an output file, and
      decompression also reconstructs and writes the executable. Bind the mode and sink
      before choosing a semantic checkpoint.

      Trace outer executable header -> concrete packer selection and can-unpack checks ->
      UPX version, format, method, filter, and pack header -> compressed blocks -> checksum,
      reconstruction, and trailing data. Keep file offsets, segment spans, compressed and
      uncompressed lengths, blocks, imports, relocations, and overlays distinct. A valid
      executable shell can reach a fault in format metadata or dynamic tables before any
      pack header is required; do not overbuild a packed stream when the selected sink is
      earlier. Conversely, a late unpack route needs loader and packed state to agree.

      Prove the concrete packer class and virtual dispatch. Separate pack, program-size,
      and per-block metadata. Modern b_info headers carry block-local compression method
      and filter metadata; bind decompressor and filter state to the current block rather
      than assuming the pack header describes every payload. A method id must pass the
      checked-in whitelist and select the intended decompressor.

      In ELF shared-library paths, keep the immutable input file image, mutable
      reconstruction buffer, and output file as separate representations. Translate ELF
      virtual addresses, file offsets, and reconstruction offsets explicitly before table
      access or writes; a file cursor does not establish a span in another representation.
      Track allocation capacity, compressed bytes available and consumed, produced output,
      and all checks before each stage. Extreme sizes help only when earlier format, method,
      span, and dispatch predicates hold.
  - id: project_yara
    summary: "Separate YARA rule compilation from imported-module file scans."
    project_names: ["yara"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. YARA fuzzers separate rule-language compilation from scanning
      bytes with imported format modules. A rules target copies the artifact as rule
      source and lets the harness append termination, then runs the compiler and may
      materialize compiled rules without scanning a specimen.
      Module targets compile harness-owned rules and pass the complete raw artifact to
      memory scanning so PE, ELF, Mach-O, DEX, .NET, or another imported parser and its
      condition evaluation can run. Bind source text versus scanned binary first.

      For rules, trace lexer/parser -> strings, regex or hex patterns, imports and
      condition AST -> bytecode and rule finalization. For module scans, trace scan block
      -> module loader -> format headers and tables -> exported module objects ->
      condition evaluation and callback. Preserve carrier offsets, counts, widths,
      table references, and nested spans. Compiler success does not prove a scan ran;
      generic byte scanning does not prove that the imported module accepted its format.

      A .NET metadata `#~` stream uses its Valid bitmap to determine which tables are
      present and in what order. Each present table then contributes a row count, while
      heap and coded-index widths determine the size of each row. Derive every table
      base from that shared layout and prove the current row's complete span before each
      iteration; checking only the first table byte does not authorize later rows.

      The PE module also maps data-directory entries into section-backed tables and
      walks a resource tree before decoding leaf payloads such as nested version-resource
      strings. Keep resource-relative offsets, image RVAs, file offsets, the scan block,
      and each UTF-16 child span as separate coordinate systems; accepting an outer
      resource entry does not prove that a mapped leaf cursor belongs to the input span.
  - id: project_libxml2
    summary: "Separate libxml2 harness grammars and parser execution modes."
    project_names: ["libxml2"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. libxml2 separates XML and HTML parsing, push parsing, tree and
      dictionary storage, xmlReader, validation and DTD or entity handling, XInclude,
      XPath, and lower buffer or I/O helpers. Bind the exact fuzzer before treating the
      artifact as a document. Some targets use a harness envelope whose leading integers
      control allocation or parser options and whose delimited strings encode URLs,
      entities, expressions, or the main document. XPath can split an expression from
      XML; an API target can interpret bytes as an operation program. Other read-memory
      or read-file targets may accept raw XML.

      Trace harness grammar -> allocation, options, and entity map -> selected parser,
      reader, push, validation, XInclude, or XPath phase -> tree, dictionary, and buffer
      ownership -> cleanup. An entity or XInclude route needs the matching URL and
      main-entity relationship. A push-parser fault needs the relevant chunk or final
      transition; DOM success does not prove reader or validation reachability. Preserve
      encoding, namespaces, subsets, entity boundaries, node ownership, and dictionary
      interning. Prefer a seed from the same target over a plain XML fragment.

      The shared fuzz framework can run one entity payload through several APIs and reset
      a deterministic allocation limit for each. Keep payload validity, options,
      allocation ordinal, and phase separate. First prove the no-failure route; then trace
      failure through status, outputs, ownership, and cleanup. Character decoders can
      return zero on grow or input error without defining a separate byte-width output;
      check parser EOF or error before advancing. Pull success does not establish the
      push, Reader, XInclude, XPath, or serializer path.

      Reader, document-tree, and dictionary state can share names and properties across
      parsing and cleanup, so make their ownership boundary explicit. Reports that cross
      optional I/O or compression dependencies also need an instrumentation-boundary
      check before being attributed to document parsing.

      XInclude has distinct reference discovery and expansion, merge or replacement, and
      finalization phases. Partially materialized nodes and reference state can outlive
      an intermediate failure. Track phase ownership separately from document parse,
      resource-load, and final-include success.

      `xmlParserInput` base, cur, and end pointers are views into the UTF-8 buffer owned
      by an `xmlParserInputBuffer`, not independent allocations. Encoding conversion,
      buffer growth, and shrinking can relocate that storage. Preserve cursor offsets and
      rebind all three pointers before any parser or diagnostic consumer uses them; also
      handle failure of the rebind itself. Pull, push, and reader paths do not share the
      same grow/error transition. Progressive parser indexes are meaningful only for the
      current buffer and lexical state, so reset or advance them when a chunk changes that
      state instead of rescanning an accumulated prefix.

      A document owns ID/IDREF tables and internal/external DTD subset pointers separately
      from its ordinary child list. ID entries can retain an `xmlAttr` while the attribute
      carries a back-reference to that entry; streaming validation may deliberately avoid
      retaining the attribute. Keep raw, normalized, and entity-expanded ID values tied to
      the same registration/removal policy. Attribute copy, replacement, unlink, and free
      paths must update the table before the attribute lifetime ends. DTD replacement or
      unlink must likewise keep `intSubset` and `extSubset` synchronized. Namespace
      declarations are `xmlNs` objects, not attributes, and must not enter attribute-only
      validation or ownership paths.

      API fuzzers are operation programs; prove the opcode path to save or I/O. For
      output ownership, distinguish static from dynamic encoding handlers and caller
      from callee ownership on failure. A target without filename output cannot express
      that route.
  - id: project_libxslt
    summary: "Separate libxslt stylesheet execution from XPath expression input."
    project_names: ["libxslt"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. libxslt exposes XSLT and XPath operations, but their carrier is
      revision-sensitive. Older targets use the complete artifact as a stylesheet or
      NUL-terminated XPath expression and evaluate it against a fixed XML source. Newer
      shared fuzz envelopes can begin with a four-byte allocation budget and serialized
      entities or strings. Their XSLT path takes the main entity as stylesheet and a
      secondary entity as source XML; their XPath path extracts both expression and XML
      from the artifact. Bind the exact reader and field order first; file and network
      I/O remain forbidden.

      Trace XML parse -> stylesheet tree -> template, match, key, format-number, or
      extension compilation -> transform -> serialization -> cleanup; or expression
      compile -> evaluation stack, node sets, conversions, extension calls, caches, and
      RVT cleanup. Preserve XML well-formedness, namespace bindings, entity boundaries,
      XPath quoting, numeric edges, stylesheet ownership, and the allocation control.
      Do not substitute a standalone stylesheet, source document, or expression for a
      revision that requires the compound envelope.

      Modern fuzz paths can inject allocation failure across parsing, recursive match
      pattern compilation, XPath evaluation, and cleanup. Extension-produced strings
      add an encoding boundary before XPath and other text consumers. Track allocation,
      ownership, and text-encoding state across those stages.

      XSLT `format-number` patterns use decimal-format symbols, positive and optional
      negative subpatterns, zero and digit placeholders, grouping, decimal points, and
      percent or per-mille multipliers. The count of fractional placeholders determines
      a power-of-ten rounding scale. Keep UTF-8 byte positions, placeholder counts,
      multiplier state, scale exponent, finite-number state, and output length distinct;
      a long but syntactically valid pattern can cross numeric as well as buffer limits.
  - id: project_fluent_bit
    summary: "Separate Fluent Bit parser, transport, config, and plugin contracts."
    project_names: ["fluent-bit"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. Fluent Bit fuzz targets cover distinct subsystems: text and
      JSON parsers, MessagePack conversion, record accessors, HTTP clients, AWS signing,
      configuration files, storage, and selected input, filter, or output plugins. Bind
      the exported target before choosing a carrier. A YAML configuration target writes
      the whole artifact to a file, while parser and client targets can reserve leading
      bytes for format, time, decoder, method, buffer, or allocation-failure controls.
      Those bytes are not automatically part of the parser-visible payload.

      For the JSON parser route, trace JSON tokenization -> MessagePack event buffer -> optional
      decoder replacement -> timestamp lookup or removal -> returned buffer. Keep the
      original packed buffer, a decoder-produced replacement, and views into the active
      map as separate ownership domains. Other record paths can continue through
      accessors, filters, or JSON rendering. For HTTP and signing paths, track upstream,
      request, response buffer, provider, and teardown ownership. Many harnesses inject
      allocation failures, so distinguish a controlled error edge from malformed input.
      Preserve NUL termination, SDS length and capacity, list membership, parser/config
      ownership, event boundaries, and the exact cleanup path.
  - id: project_icu
    summary: "Bind ICU Unicode, locale, regex, calendar, and formatting harnesses."
    project_names: ["icu"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. ICU4C fuzzers are separate API programs for converters,
      locales and language tags, UnicodeString and UnicodeSet, regex, bidi and break
      iteration, calendars and time zones, collation, normalization, and number or date
      formatting. Some pass the artifact as UTF-16 code units; others split it into
      length-prefixed byte strings or reserve leading values for locales, enums,
      capacities, and an operation sequence. A plain UTF-8 string is therefore not a
      universal ICU carrier.

      Bind the exact entrypoint and record byte order, code-unit width, endian behavior,
      terminator policy, and which bytes are controls versus text. Trace UErrorCode from
      initialization through each gated call; reset status only where the harness does.
      Keep source length, UTF-16 length, scalar count, output capacity, required output,
      and index units distinct. Locale fallback, malformed tags, invalid enum values,
      replacement behavior, callbacks, and stateful calendar or bidi operations can
      select different paths. Preserve the minimum operation order and close or destroy
      every ICU object according to the checked-in API contract.

      Locale-to-language-tag conversion has several structural producers. Keep the base
      language, script, region, and variants separate from ICU locale keywords, BCP 47
      extensions, and private-use subtags. Canonicalization and validation can append
      those families through different stages before the final ByteSink, so a fault in
      `toLanguageTag` alone does not identify which component family supplied the length
      or bytes.

      A rule-based collation target instead treats the complete text as collation rules,
      then runs rule parsing, tailoring construction, mapping and context-trie building,
      and final collator creation. Builder finalization can invoke shared UnicodeString
      search helpers on accumulated context strings. A direct substring carrier does not
      model that route; preserve rule syntax and the UTF-16 boundaries produced by the
      builder.
  - id: project_curl
    summary: "Separate curl transfer scripts from URL, protocol, and helper targets."
    project_names: ["curl"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. curl fuzzing includes full easy or multi transfers, individual
      URL, wildcard, DoH, and buffer-queue helpers, and protocol-specific mock-server
      scenarios. A common transfer harness consumes repeated big-endian TLVs containing
      a two-byte type, four-byte length, and value. TLVs configure the URL, options,
      headers, uploads, and one or more simulated server responses before callbacks
      drive the transfer. Raw HTTP or FTP response bytes alone do not satisfy that
      carrier. Direct URL and wildcard targets instead use NUL-terminated strings.

      In the public transfer harness, the long-lived common mapping starts with
      URL=1, RESPONSE0=2, USERNAME=3, PASSWORD=4, POSTFIELDS=5, HEADER=6,
      COOKIE=7, UPLOAD1=8, RANGE=9, CUSTOMREQUEST=10, MAIL_RECIPIENT=11,
      MAIL_FROM=12, MIME_PART=13, HTTPAUTH=16, RESPONSE1..RESPONSE10=17..26,
      OPTHEADER=27, NOBODY=28, FOLLOWLOCATION=29, ACCEPTENCODING=30,
      SECOND_RESPONSE0=31, SECOND_RESPONSE1=32, and WILDCARDMATCH=33. Later
      public revisions append named option records, including AWS_SIGV4=158;
      version-gate those additions against the applicable build instead of treating a
      numeric CURLOPT value as a TLV type. Unknown types reject the carrier. Integer
      option values are exactly four big-endian bytes; ordinary option records are
      singleton, while headers, mail recipients, MIME parts, and response slots have
      their own repeated or nested behavior.

      FTP wildcard expansion is a transfer-state route, not the direct matcher
      contract. The URL path supplies the pattern, the control channel establishes a
      directory listing, data-channel rows become file entries, and only then does the
      configured or default matcher receive a filename. Preserve control and data
      streams separately before varying matcher class, range, or escape syntax.

      Bind the executable and its enabled protocol before construction. Trace easy and
      multi handle setup -> option ownership -> resolver and connection -> protocol
      state machine -> send and receive buffers -> redirects, authentication, reuse or
      disconnect -> cleanup. Keep response-line consumption, overflow bytes, upload
      length, callback cursor, connection owner, and current transfer identity distinct.
      Connection caching, disconnect callbacks, and incremental upgrade requests add
      their own ownership and lifecycle state.

      HTTP SigV4 signing is reached during authentication-header output after transfer,
      credential, and request state exist. It canonicalizes and orders request headers
      while deriving date and signing fields. Keep borrowed option/header strings,
      temporary header lists, and synthesized date or authorization buffers distinct
      across every error cleanup.

      Mock sockets and forced name resolution are harness behavior, not network input.
      Preserve the complete scripted exchange needed to reach a late protocol state.
  - id: project_file
    summary: "Separate libmagic data classification from magic-database parsing."
    project_names: ["file"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. libmagic targets commonly classify the complete artifact with
      a precompiled magic database through a memory buffer or a temporary-file
      descriptor. A different target treats the artifact as magic-rule source and runs
      database check or compilation. Do not submit magic syntax to a data-classification
      target or an ordinary file specimen to a database parser merely because both call
      libmagic.

      For data classification, trace outer file checks -> soft-magic rule evaluation ->
      text and encoding checks -> optional compressed-data recursion. Magic rules can
      use typed values, masks, strings, regex or search windows, direct and indirect
      offsets, continuations, relative bases, and nested names. Track the active buffer,
      available length, offset base, copied or terminated search span, continuation
      level, and match state. Descriptor targets materialize the same bytes but can take
      file-oriented paths. Database targets instead require coherent rule lines,
      operators, descriptions, continuations, and referenced names before compilation.

      Data classification can pass one bounded input through outer buffering, soft-magic
      dispatch, and format-specific sniffers before or beside rule evaluation. Preserve
      each stage's cursor and interpretation of the shared span.

      Microsoft CDF/OLE compound documents add a structured-storage path beneath data
      classification. Their header selects regular-sector and mini-sector geometry;
      DIFAT/FAT chains locate sectors, the mini-stream has its own address space, and
      directory entries locate named streams whose property sets have further internal
      offsets. Keep sector identifiers, sector sizes, file offsets, stream-relative
      offsets, and available spans distinct. Validate every derived byte range against
      the file or stream that owns it before reading regular sectors, mini-sectors, or
      property values.

      CDF directory state also identifies the root storage and the mini-stream used by
      small streams. A property-set stream has its own header and section directory;
      each section maps property identifiers to typed values at section-relative
      offsets. Trace directory entry -> stream chain -> property-set header -> section
      descriptor -> property directory -> typed value, keeping file, sector, stream,
      property-set, section, and value coordinates distinct at every transition.
  - id: project_imagemagick
    summary: "Bind ImageMagick coder, ping, profile, and raw helper contracts."
    project_names: ["imagemagick"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. ImageMagick separates MagickCore coders from Magick++ wrappers,
      pixel-cache and image operations. Many coder-specific fuzzers force one format,
      read a Blob, and may write the decoded image back through the same coder; others
      consume raw string/control parameters or build a synthetic image before encoding.
      Some reserve a leading initializer such as an interlace selector. A ping target
      reads metadata without full pixel decode. Profile and raw Huffman targets also use
      synthetic images and their own control-plus-payload contracts. These carriers are
      not interchangeable with an auto-detected image file.

      Trace Blob -> selected coder -> image list, metadata, profiles, colorspace,
      channels, colormap and pixel cache -> optional transform or writer -> destruction.
      Preserve format signature, dimensions, scene and frame counts, channel and alpha
      traits, row and plane geometry, offsets, compressed spans, and profile nesting.
      Check the build's quantum depth, HDRI mode, enabled delegates, and coder flags.
      Successful ping does not prove pixel allocation or write-back reachability, and a
      decoded image does not prove a secondary encoder path ran.
  - id: project_sudoers
    summary: "Separate sudoers policy, LDIF, configuration, and I/O-log grammars."
    project_names: ["sudoers"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. sudo fuzzers cover complete sudoers policy text, policy-plugin
      execution, sudo.conf and logsrvd configuration, LDIF conversion, and JSON, legacy,
      or timing I/O-log records. The direct parser reads policy text with a harness-owned
      user, group, interface, locale, and callback environment. Includes can be disabled
      or stubbed. The policy target can instead use a line-oriented envelope that builds
      plugin arguments, settings, user information, argv, and environment before running
      several policy operations. Raw sudoers text is not that envelope.

      Bind the target grammar, then trace lexer and parser -> aliases, defaults,
      userspecs, commands and digests -> matching or conversion -> parse-tree and context
      cleanup. For policy execution, preserve required arrays, command ownership, user
      and run-as identity, chroot and path transitions, and the ordered open, check,
      list, validate, or invalidate calls selected by the harness. For LDIF and I/O logs,
      preserve record boundaries and their separate object lifetimes. Stubbed filesystem,
      conversation, identity, and resolver behavior is authoritative for reachability.

      Keep raw policy parsing separate from structured plugin execution and its final
      garbage-collector teardown. Track allocation registration, direct ownership, and
      the output-state postconditions supplied by harness stubs across plugin operations.

      For policy-text targets, require a clean parser result and inspect the resulting
      userspec and command-spec tree before reasoning about matching or ownership. A
      lexer token, isolated grammar production, or caret diagnostic does not prove that
      an option is legal at that position; syntax and option placement are version-
      dependent. Preserve one parser-accepted baseline and change one parse-tree field
      at a time.
  - id: project_zstd
    summary: "Separate Zstandard frame, block, stream, dictionary, and sequence targets."
    project_names: ["zstd"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. Zstandard fuzzers independently exercise frames, raw blocks,
      Huffman or FSE tables, legacy formats, simple and streaming APIs, dictionaries,
      round trips, and the sequence-compression API. Many harnesses keep a prefix as the
      actual compressed or raw payload while consuming bytes from the artifact tail to
      choose capacities, chunking, parameters, dictionary mode, resets, or operation
      order. A valid frame, bare block, raw source, and generated-sequence program are
      different carriers.

      Bind the target and split before mutation. Track frame header and content-size
      state, blocks and last-block markers, literals and sequences, offsets and match
      lengths, entropy tables, checksums, dictionary ID and content type, window and
      history, bytes consumed, output produced, and flush or end directives. Streaming
      targets can vary input and output slices and reuse contexts; round-trip targets
      may compress first and compare decompressed bytes. Preserve the payload prefix
      while changing a tail control, and do not add a frame wrapper to a target that
      calls a block or entropy primitive directly.

      Strategy-selected optimal parsing introduces workspace, table, and accumulated-cost
      state beyond ordinary frame validity. Track their capacity and numeric domains
      independently when following strategy-specific paths.
  - id: project_capstone
    summary: "Bind Capstone architecture controls separately from instruction bytes."
    project_names: ["capstone"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. Capstone fuzzers usually consume a small harness selector for
      architecture, mode, endian, syntax, or detail settings, then disassemble the
      remaining instruction bytes. Other targets bind one architecture at build time.
      Do not treat selector bytes as instructions or assume an encoding is shared across
      architectures and modes.

      Trace handle creation -> option setup -> decode -> architecture writer -> optional
      public detail operands -> result release and close. Keep internal operands consumed
      by architecture printers separate from each architecture's public detail operand
      array. Track their initialization, counts, implicit registers, groups, input
      offset, decoded size, and invalid-instruction state. Detail and printer paths have
      different prerequisites.
  - id: project_exiv2
    summary: "Trace Exiv2 container metadata through read, traversal, and write-back."
    project_names: ["exiv2"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. Exiv2 targets commonly open the complete artifact through
      ImageFactory, read metadata, traverse or print EXIF, IPTC, XMP and ICC state, and
      sometimes write metadata back. Format-specific targets may bind JPEG, TIFF, BMFF,
      PNG or another container. A valid outer probe is only the first gate; metadata
      directories, profiles, previews, maker notes, and writer paths have separate
      reachability requirements.

      Keep QuickTime/BMFF atom payload decoding separate from JPEG 2000 signature and
      box validation. Atom payloads and JP2 box data are bounded spans with different
      framing and interpretation.

      Trace container header and segment or box spans -> metadata decoder -> typed value
      and recursive structure traversal -> optional mutation or writer -> object and I/O
      cleanup. Keep endian, offset base, type width, count, inline-versus-offset value,
      nested length, and file-size arithmetic distinct. A read-only success does not
      prove print, preview, conversion, or write-back ran. Preserve enough outer
      structure to reach the intended second-stage metadata consumer.
  - id: project_freetype2
    summary: "Preserve FreeType font containers, faces, glyph state, and attachments."
    project_names: ["freetype2"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. FreeType fuzzers can accept a raw font or an uncompressed tar
      whose first file is the font and later files are attachments such as auxiliary
      tables. They may enumerate every face and named instance, choose sizes and
      charmaps, load or render glyphs, and exercise cache and raster paths. Bind the
      checked-in target before assuming a standalone sfnt is sufficient.

      Trace stream or archive extraction -> library and face creation -> table parsing ->
      size, variation and charmap selection -> glyph load, outline, bitmap, cache or
      render operation -> face and library teardown. Track table offsets and lengths,
      face and instance indices, glyph counts, contour and point counts, pitch and pixel
      mode, variation coordinates, and attachment lifetime. Preserve the outer font and
      minimum table directory needed to reach a late table or glyph consumer; a face
      that opens successfully may still skip the relevant render or cache path.

      Optional SFNT color tables such as CPAL combine table spans, palette indexes, and
      fixed-width color records. CFF2 variable fonts can reuse metrics adjustment and
      live size objects after design-coordinate changes. Preserve both table and object
      state across these consumers.

      For SFNT construction, preserve the big-endian table directory, aligned table
      offsets and lengths, and checksums. Variable-font tables are coupled: axis counts
      and coordinates must agree across fvar, variation stores, MVAR and CFF2 or gvar,
      while the chosen outline driver still has to create the size object consumed later.
      Prefer a valid variable-font fixture and patch one table over synthesizing every
      directory and outline prerequisite from scratch.
  - id: project_h3
    summary: "Reason about H3 index fields, hierarchy, pentagons, and grid APIs."
    project_names: ["h3"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. H3 targets cover string conversion, validity, parent and child
      hierarchy, compact and uncompact, boundaries, neighbors, grid disk or ring, and
      directed edges. An H3 index is a structured 64-bit value containing mode,
      resolution, base cell, and resolution digits; arbitrary integers often fail before
      the intended operation. Pentagon cells and their deleted subsequences create
      distinct topology edges.

      Bind the API and input adapter: some targets parse a NUL-terminated textual index,
      others consume binary indexes or arrays plus resolution and distance controls.
      Trace validation -> size query -> allocation -> topology operation -> output count
      and cleanup. Keep requested capacity separate from produced count, and preserve
      resolution compatibility, duplicate handling, parent-child relationships, valid
      digit ranges, and pentagon-specific constraints. Recompute the size contract when
      changing distance, resolution, or array membership.

      H3 APIs commonly return H3Error and expose result state through out-parameters.
      Polygon fill APIs pair a size preflight with later iteration, and containment mode
      is part of both contracts. Track status, mode, estimated size, and emitted output
      as separate state.

      Polygon carriers use an outer latitude/longitude loop plus optional hole loops;
      coordinates are expressed in radians and antimeridian handling can change the
      effective bounding region. Experimental containment modes distinguish cell-center,
      full-containment, boundary-overlap, and bounding-box-overlap interpretations. Use
      the same polygon, holes, target resolution, and mode for preflight and fill, and
      track any coarser hierarchy traversal separately from target-resolution cells.
  - id: project_igraph
    summary: "Bind igraph file grammars and graph or vector ownership contracts."
    project_names: ["igraph"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. igraph fuzzers commonly bind one graph grammar such as LGL,
      NCOL, DIMACS, GraphML, GML, Pajek, DL, or an adjacency representation. Other
      targets exercise generators and algorithms through structured controls. These
      formats differ in vertex naming, edge direction, weights, counts, sections, and
      terminators; generic edge-list text is not a universal carrier.

      Trace lexer or reader -> vertex and edge growth -> attribute tables and auxiliary
      vectors -> graph validation -> optional algorithm -> graph, vector, and finally
      stack cleanup. Track vertex IDs versus declared counts, edge endpoint domains,
      directedness, weight and capacity vector lengths, index bases, and partial-object
      state on parser failure. For algorithm targets, preserve the graph properties and
      workspace sizes needed by the selected routine. A rejected input still matters
      only if the checked cleanup path consumes partially initialized graph state.
  - id: project_kamailio
    summary: "Separate Kamailio SIP-message parsing from URI and header helpers."
    project_names: ["kamailio"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. Kamailio targets separately parse complete SIP messages,
      standalone URIs, and selected header or SDP helpers. A message target expects a
      request or status line, CRLF-delimited headers, the empty-line boundary, and any
      body required by Content-Length. It may parse headers lazily and retain slices
      into the original buffer before visiting Contact, To, Refer-To, identity, privacy,
      diversion, authorization, or SDP structures.

      Trace message framing -> first-line and header-name scan -> selected header-body
      parser -> URI, parameter, credential, multipart, or SDP state -> message cleanup.
      Keep buffer-relative pointers, header body lengths, comma-separated element lists,
      quoted strings, URI parameters, body offset, and declared versus available body
      length distinct. Preserve a complete outer message when targeting a nested parser;
      a standalone header or URI only applies when the bound entrypoint consumes it.

      After whole-message framing, an SDP body can enter session or mixed-content
      scanners over slices of the same message buffer. Keep whole-message, body, and
      inner-scanner spans distinct.
  - id: project_kimageformats
    summary: "Trace Qt image handlers from device probing through full pixel decode."
    project_names: ["kimageformats"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. KImageFormats fuzzers replay the complete buffer through one or
      more QImageIOPlugin handlers such as PCX, PIC, PSD, RAS, RGB, TGA, XCF, or other
      checked-in formats. The same bytes can be probed by several handlers through a
      seekable QBuffer. Handler selection, capability probing, size reads, and full image
      decode are separate stages.

      Trace signature and option probe -> header and table parsing -> dimensions,
      channels, palette, layers or frames -> chunk, compressed row, or plane decode ->
      QImage allocation and write -> handler and device cleanup. Track device position
      after each probe, signed dimensions, depth, bytes per line, palette count, RLE spans,
      layer offsets, and format conversion. Preserve a coherent format-specific header
      and enough data to force full decode; metadata-only acceptance does not prove the
      pixel loop or layer compositor executed.

      QIODevice and QDataStream expose requested and actual read state. RIFF-derived ANI
      handlers scan chunks and fixed-width little-endian fields before contained frames,
      creating a boundary distinct from scanline decoding.
  - id: project_libexif
    summary: "Separate libexif direct EXIF blobs from streaming container loaders."
    project_names: ["libexif"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. libexif fuzzers can parse a direct EXIF/TIFF blob with
      ExifData, or stream a JPEG-like container through ExifLoader before traversing the
      result. Targets may enumerate entries, format values, interpret maker notes,
      repair tags, or serialize the object. Direct TIFF bytes and loader-framed input are
      not interchangeable.

      Trace byte order and TIFF header -> IFD count and entries -> tag type, component
      count, inline value or referenced offset -> linked IFD, thumbnail and maker-note
      parsing -> traversal, value rendering, fix or save -> reference release. Keep the
      offset base, multiplication width, directory span, next-IFD pointer, thumbnail
      range, and entry ownership explicit. Preserve the outer loader framing when it is
      the only route to object creation, and distinguish parse success from later value,
      maker-note, or serialization reachability.

      MakerNote dispatch selects vendor-specific handlers over one bounded IFD payload.
      Direct ExifData and streaming ExifLoader paths converge on this shared stage after
      object creation, where inner tables establish their own offsets and spans.
  - id: project_libhevc
    summary: "Model libhevc controls, NAL state, picture buffers, and decode lifecycle."
    project_names: ["libhevc"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. libhevc targets consume an elementary HEVC stream while
      sampling fixed input bytes for color format, core count, or architecture settings;
      verify whether those control bytes remain visible to the decoder. The lifecycle is
      typically create -> set controls -> header decode -> allocate output planes ->
      frame decode loop -> flush, reset, or teardown.

      Trace NAL framing -> VPS, SPS and PPS state -> slice headers, reference pictures
      and decoded-picture buffer -> prediction, transform and filtering -> output plane
      writes. Track bytes consumed, picture dimensions, chroma subsampling, bit depth,
      stride, plane capacity, reference counts, and resolution changes. Preserve the
      parameter-set chain and a slice that activates it. A successful header parse does
      not prove frame reconstruction, output conversion, delayed-picture handling, or
      the cleanup path that follows a partial decode.

      Annex-B start-code search maintains a byte cursor and remaining span across NAL
      boundaries. Per-CTB neighbour availability is separate block-local state used by
      prediction and reconstruction.
  - id: project_libucl
    summary: "Separate libucl text, MessagePack, schema, and emitter contracts."
    project_names: ["libucl"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. libucl targets separately parse UCL configuration text,
      MessagePack objects, schemas, and emitter or object-manipulation paths. Text
      parsers may use an explicit byte length or a terminated copy and can enable macro,
      variable, include, duplicate-key, or comment behavior. A MessagePack target passes
      binary objects and lengths directly; JSON or UCL syntax is not a substitute.

      Trace input adapter -> parser stack and container creation -> key and value
      decoding -> duplicate strategy, references and ownership -> validation or emitter
      -> object unref and parser cleanup. Track nesting, declared string and container
      lengths, integer width, extension tags, key lifetime, duplicate chains, and partial
      objects on error. Preserve the carrier for the bound target and require the
      secondary schema, iteration, lookup, or serialization operation when that is the
      affected consumer.

      Include and variable expansion operate on explicit-length substrings through
      separate size-estimation and copy phases. Keep their grammar and source-span state
      aligned across both phases.
  - id: project_libvips
    summary: "Force libvips lazy image graphs through the intended demand sink."
    project_names: ["libvips"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. libvips fuzzers often create an image from the complete buffer,
      build a lazy operation graph, then force evaluation with a sink such as average,
      maximum, thumbnail, crop, sharpen, save, or mosaic. Some targets sample tail bytes
      for operation arguments while leaving those bytes in the image buffer. Loading or
      constructing the graph alone does not execute every decoder or pixel operation.

      Trace foreign loader -> header and image state -> operation graph -> region and
      tile demand -> sink or saver -> reference cleanup. Track dimensions, bands,
      format, coding, interpretation, page or frame count, region coordinates, stride,
      tile geometry, and input/output ownership. Preserve a decodable image while
      choosing valid operation arguments that force the affected region. For multi-image
      or mosaic paths, keep list membership and shared image references valid through
      evaluation and teardown.

      Operation construction can run one-time class and lookup-table initialization
      before any pixel demand. Tiled image loading adds raw-tile I/O state before codec
      dispatch. Outer-container acceptance does not establish the later tile span.
  - id: project_miniz
    summary: "Separate miniz zlib, raw deflate, streaming, and ZIP carriers."
    project_names: ["miniz"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. miniz targets cover zlib-compatible one-shot calls, raw or zlib
      deflate streams, incremental compression and decompression, flush transitions, and
      ZIP archives. Some harnesses derive output capacity or options from input bytes
      without removing those bytes from the compressed stream. Other targets first
      compress raw input and then perturb or stream the generated data.

      Bind wrapper mode and lifecycle before constructing bytes. Track bit buffer ->
      block type -> Huffman tables -> literal, length and distance decode -> history and
      output; or ZIP local headers -> compressed members -> data descriptors -> central
      directory. Keep avail_in, avail_out, total counters, checksum, window, flush mode,
      stream-end state, and allocated capacity distinct. A complete zlib stream does not
      serve a raw-deflate primitive, and a valid member does not prove central-directory
      or close-time processing ran.

      ZIP initialization establishes the central-directory region and its relationship
      to the end-of-directory record. Keep directory traversal distinct from later member
      extraction, decompression, and checksum validation.
  - id: project_net_snmp
    summary: "Separate Net-SNMP BER messages from AgentX framed sessions."
    project_names: ["net-snmp"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. Net-SNMP targets commonly parse either an SNMP BER message or
      an AgentX protocol PDU. SNMP input nests version, community or security parameters,
      PDU fields, error state, request IDs, and varbind sequences with BER-encoded OIDs
      and values. AgentX uses its own fixed header, byte-order flag, session and
      transaction identifiers, payload length, typed fields, and alignment padding.

      Trace transport buffer -> outer length and version dispatch -> security or AgentX
      header -> PDU and varbind/object decoding -> callbacks or formatting -> partial-PDU
      cleanup. Track definite lengths, tag and length widths, OID subidentifiers, signed
      integer conversion, payload endianness, four-byte padding, and ownership of names
      and values. Preserve a complete outer message for nested varbind work, and never
      wrap AgentX fields in BER or feed an SNMP packet to an AgentX entrypoint.

      Textual MIB modules form a third grammar, separate from both wire formats. AgentX
      strings add an inner length-delimited span inside the PDU payload.

      AgentX header payload length must match the remaining PDU span, and its byte-order
      flag governs multi-byte fields. Strings and opaque values add their own length,
      content, and four-byte padding. For a short-field route, preserve a complete
      counterfactual continuation: after the missing length check is added, the message
      should reject or finish cleanly instead of falling into a second malformed field.
  - id: project_ntopng
    summary: "Preserve ntopng capture framing and cross-packet flow state."
    project_names: ["ntopng"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. ntopng targets can consume a complete pcap through an offline
      reader, raw packets under a harness envelope, or serialized test records. The pcap
      route establishes link type and iterates packet records into a persistent
      interface, host, flow and nDPI state before cleanup. A single link-layer frame is
      not a complete pcap, and packet order can be part of reachability.

      Trace capture header -> record timestamp, captured and original lengths ->
      datalink decoder -> network and transport parsing -> protocol detection -> flow,
      host, cache and alert updates -> expiration and teardown. Track link type,
      encapsulation, header lengths, fragmentation, direction, five-tuple, sequence and
      timestamp ordering, and cross-packet ownership. Preserve the smallest coherent
      packet sequence that creates the required state and then reaches its consumer;
      distinguish a packet parse from flow-finalization behavior.

      mDNS reuses the DNS message structure over UDP port 5353. Counts in the fixed
      header select question and resource-record sequences; each resource record has a
      label or compressed owner name, fixed type/class/TTL fields, and an RDLENGTH-bounded
      RDATA span. TXT RDATA is another sequence of one-octet-length character strings.
      Keep the UDP payload, resource-record RDATA, and each TXT string as separate bounds.

      Per-protocol helpers often receive an interior slice rather than the packet base.
      Include that prefix offset in every child bound, especially when an ICMP error
      exposes embedded network and transport headers inside its own payload.
  - id: project_proj4
    summary: "Bind PROJ definition envelopes, coordinate modes, and grid state."
    project_names: ["proj4"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. PROJ fuzzers can use a compound artifact containing a source
      definition line, destination definition line, and a coordinate record. The final
      record may be textual coordinates or a binary 2D or 3D marker followed by native
      floating-point values. Other targets bind one parser or operation directly. Verify
      the checked-in delimiters and native representation before construction.

      Trace definition or pipeline parsing -> parameter objects and context -> grid and
      resource lookup -> source and destination initialization -> forward or inverse
      transform -> coordinate validation -> object, context and global-grid cleanup.
      Track axis order, units, angular conversion, dimensionality, finite values,
      pipeline steps, grid availability, and cache ownership. Preserve both definitions
      and the selected coordinate carrier; a valid standalone CRS string does not reach
      the transform lifecycle of a compound target.

      A direct target can pass one whitespace-separated PROJ initialization string to
      projection setup before any coordinate exists. Grid-shift setup separately uses a
      comma-separated grid list, and optional time-unit parameters introduce another
      configuration state. The unit-conversion operation has independent horizontal,
      vertical, and time input/output units. Model forward and reverse as inverse
      compositions, keeping each named input or output unit bound to its own conversion
      state; an omitted unit is a validated sentinel, not an index into a unit table.
  - id: project_radare2
    summary: "Bind radare2 binary, analysis, command, and security-format targets."
    project_names: ["radare2"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. radare2 has many independent fuzzers: automatic or forced bin
      plugins, malloc-backed I/O and maps, architecture-specific analysis, command and
      expression grammars, PDB, DWARF, filesystem images, PKCS7, X509, and other format
      helpers. Some command targets interpret artifact text while operating on a fixed
      binary; their artifact is not the binary being analyzed.

      Bind the executable, plugin and input carrier. For binary analysis, trace buffer
      or I/O descriptor -> map and base address -> format plugin -> sections, symbols,
      relocations and strings -> architecture and bitness -> analysis operations ->
      plugin and core cleanup. For textual commands, trace tokenization and command
      dispatch into the preconfigured core. Track virtual versus file offsets, address
      width, map bounds, ownership across plugin objects, and lazy loads. Knowledge from
      one plugin or command grammar must not be transferred to another target by name.

      Binary objects and plugins have explicit ownership relationships for object-level
      key/value stores. ELF relocation paths cross virtual-address, file-offset, section,
      and dynamic-entry domains. Keep ownership and address-space state explicit.
  - id: project_zeek
    summary: "Model Zeek analyzer chunks, transport direction, events, and teardown."
    project_names: ["zeek"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. Zeek fuzzers can bind one protocol analyzer and TCP or UDP at
      build time. Analyzer targets may decode a custom sequence of magic-delimited
      chunks, each carrying a direction byte, then feed ordered data through NextStream
      or NextPacket on one synthetic connection. Packet targets instead consume capture
      or link-layer framing. The chunk envelope is not a generic pcap.

      Trace harness chunking -> connection and analyzer creation -> transport-specific
      delivery -> protocol framing and nested analyzer state -> event draining,
      disablement and connection teardown. Track chunk boundaries, direction, ordering,
      stream gaps or end-of-data, UDP packet length, analyzer enabled state, event-owned
      values, and child-analyzer lifetime. Preserve the minimum multi-chunk dialogue
      needed to enter the affected state. A parser acceptance in one direction does not
      prove the reply, event, disable, or cleanup path executed.

      Reassembled TCP text can pass through a content-line layer before a protocol
      analyzer sees it. Treat signed delivery lengths, line delimiters, and child slices
      as separate bounds; a parent span does not validate an offset-derived child span.
  - id: project_cyclonedds
    summary: "Bind CycloneDDS RTPS, XTypes, and configuration carriers before tracing state."
    project_names: ["cyclonedds"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. CycloneDDS fuzzers commonly bind one of three carriers: a
      complete RTPS datagram, serialized DDS-XTypes TypeMap data, or NUL-terminated
      configuration text. Do not prepend a target selector unless the harness consumes
      one. RTPS input flows through receive-buffer setup -> RTPS header and submessage
      dispatch -> parameter-list/CDR decoding -> discovery, endpoint, fragment, or
      sample state -> domain teardown. Track protocol and vendor fields, GUID prefix,
      submessage id and flags, endian flag, octetsToNextHeader, 4-byte alignment,
      sequence and fragment numbers, and declared versus available lengths. TypeMap
      paths correlate complete/minimal identifiers, dependent counts, and recursive
      type objects; configuration paths use a separate text grammar. Recurring failures
      cluster around aligned length arithmetic, truncated parameter lists,
      fragment/reassembly bounds, recursive type graphs, partially registered entities,
      and cleanup of buffers, types, threads, and domain state after rejection.
  - id: project_faad2
    summary: "Separate FAAD2 configuration parsing from stateful multi-frame AAC decoding."
    project_names: ["faad2"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. FAAD2 targets separate AudioSpecificConfig parsing from
      stateful AAC decoding. The decode harness may use a binary envelope containing
      little-endian chunk lengths, flag bits, a copied NeAACDecConfiguration, and several
      AAC chunks; those control bytes are not an ADTS header. Trace open -> set
      configuration -> NeAACDecInit for ADTS/ADIF-style probing or NeAACDecInit2 for
      AudioSpecificConfig -> optional seek/reset or DRM setup -> repeated Decode/Decode2
      -> close. Track sample rate in Hz, channel count, object type, output format, frame
      bytes consumed, samples produced, caller output capacity in bytes, and whether
      SBR/PS changes channel or sample counts. Preserve cross-frame decoder state.
      Recurring bug sites include Huffman and scale-factor indices, short-window
      grouping, channel-element counts, implicit SBR upsampling, sample-buffer size
      products, partial-frame consumption, tiny caller buffers, and cleanup after
      initialization or second-frame failure. AAC element dispatch separates
      configuration, single-channel, and channel-pair processing, while parsed
      configuration can affect later decoder state. Spectral reconstruction combines
      window layout, scale-factor bands, channel state, and destination-buffer geometry;
      keep those domains consistent across frames.

      Spectral Band Replication has its own staged pipeline: extension and header state
      establish frequency tables and optional channel coupling; the grid establishes
      time envelopes and noise bands; envelope and noise decoding populate quantized
      state; HF adjustment later derives gain and assembles reconstructed high-frequency
      samples. Keep channel-coupled values, quantized and dequantized envelopes,
      time/frequency band indexes, table domains, and reconstructed sample buffers
      distinct across those stages.
  - id: project_freeradius
    summary: "Bind the FreeRADIUS protocol module, dictionary, and packet carrier."
    project_names: ["freeradius"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. FreeRADIUS fuzz binaries select a protocol through the
      executable name or environment and pass the complete artifact to its loaded decode
      test point; bytes do not choose RADIUS, TACACS, DHCP, DNS, BFD, TFTP, VMPS, or a
      utility parser. Utility targets may instead consume a leading type selector
      followed by text. Trace dictionary and protocol-module initialization -> per-input
      talloc/decode context -> packet decoder -> attribute pair list -> context,
      error-stack, and module cleanup. For RADIUS-like paths, track network-order packet
      length, authenticator, attribute type/length, vendor and extended TLV nesting,
      dictionary-defined value type, and remaining bytes; other protocols have
      independent headers. Recurring failures involve undersized TLVs, nested length
      disagreement, option concatenation, count/length multiplication, dictionary type
      confusion, decoder returns that overstate consumption, and talloc ownership or
      error-path leaks. Never transplant a carrier between protocol binaries.

      Protocol front ends can converge on shared attribute and value helpers. Preserve
      the originating front end's count, length-table, and remaining-span state through
      those shared consumers.

      RFC 6929 extended attributes add another header layer after the ordinary RADIUS
      type and length. Extended forms carry an extended type; long-extended forms also
      carry flags and can split one logical value across consecutive fragments.
      Vendor-Specific Attributes instead introduce a vendor identifier and a
      vendor-defined inner attribute grammar. Keep the packet span, immediate
      attribute span, extended or vendor header, fragment payload, reconstructed logical
      value, and dictionary type as separate domains before shared value decoding.
      Vendor dictionaries can select specialized inner decoders, and some inner grammars
      carry continuation state across adjacent subattributes. Bind that decoder before
      interpreting its type, length, flags, and reconstructed value; outer RADIUS length,
      vendor payload length, inner subattribute length, and logical value length remain
      distinct domains.
  - id: project_glib
    summary: "Separate GLib D-Bus and GVariant binary carriers from text parsers."
    project_names: ["glib"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. GLib exposes distinct raw-binary and text targets: D-Bus
      messages and serialized GVariant use explicit byte lengths, while URI and some
      address parsers receive a NUL-terminated copy; GVariant text, key files, bookmarks,
      dates, and paths use their own grammars. D-Bus flows bytes-needed ->
      message-from-blob -> body/header GVariant decoding -> serialization; binary
      GVariant flows untrusted backing data -> lazy validation/normal form -> data
      access. Track D-Bus endian byte, message type, flags, protocol version, body
      length, serial, header-field array, 8-byte alignment, signature, handles, and body
      ownership. For GVariant track type strings, child counts, framing offsets,
      normal-form rules, recursion depth, and borrowed versus owned storage. Recurring
      bugs occur in align-up and offset-table arithmetic, deeply nested containers,
      invalid UTF-8/signatures, parse-print or blob round trips, and
      GBytes/GVariant/GObject lifetime on partial failure. Do not use URI text to
      exercise a binary target.

      Other carriers do not pass through D-Bus or GVariant. The threaded resolver parses
      a raw bounded DNS answer, while the date parser applies Unicode transforms before
      grammar matching. Bind these entrypoints separately from URI and address parsing.

      URI authority parsing has a separate bracketed IP-literal path. An IPv6 literal
      can carry an RFC 6874 zone identifier, whose delimiter and contents interact with
      percent decoding; relaxed mode may accept legacy forms that strict mode rejects.
      Keep the authority span, closing bracket, address portion, zone portion, optional
      port, parser flags, and decoded-zone ownership distinct before handing the
      normalized address to network-address consumers.
  - id: project_gpsd
    summary: "Model gpsd lexer frames separately from harness-adjusted JSON reports."
    project_names: ["gpsd"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. gpsd separates raw packet-lexer input from JSON report parsing.
      Packet targets copy the complete artifact into a gps_lexer_t and exercise
      packet_parse and sometimes packet_get; JSON targets may force an opening brace and
      append NUL, so confirm harness mutation. Trace lexer buffering -> protocol
      recognition -> packet length/checksum state -> decoder -> session or gps_data
      fields. Carriers include NMEA/AIS text with delimiters and checksums, UBX and other
      binary frames with sync, class/type and declared length, and RTCM bit-packed
      records. Track lexer bytes, consumed versus retained bytes, payload length units,
      checksum span, AIS fragment sequence/channel and bit count, signed coordinates,
      time scale, and termination. Recurring failures arise at resynchronization
      boundaries, length plus header arithmetic, unterminated fields, multi-fragment AIS
      assembly, bit extraction near the tail, repeated packet_get state, and stale
      pointers or partial session data after rejection.

      JSON report parsing has a separate numeric-conversion boundary after tokenization.
      Track decimal representation, conversion status, and destination type separately
      from packet-lexer length state.
  - id: project_gstreamer
    summary: "Separate GStreamer typefind, discoverer, subtitle, and codec target families."
    project_names: ["gstreamer"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. GStreamer targets may typefind one complete buffer, run
      discoverer through the compiled plugin set, or bind parser, codec-helper, or tag
      APIs directly.
      Subtitle subparse paths consume text or markup, sometimes incrementally, and
      detect subtitle formats rather than media containers.

      Trace appsrc -> typefind -> caps for shallow targets; source -> typefind -> plugin
      parser/demuxer/decoder -> sink for discoverer; or adapter -> encoding and format
      detection -> line/markup parser -> cue text, start/stop times and tags for subtitle
      paths. Track GstBuffer mapped bytes, adapter offsets, byte versus character spans,
      line endings, markup nesting, timestamps in nanoseconds, caps, segments, and
      buffer/pad/element ownership. Container paths additionally require coherent sizes,
      tables, frame assembly, strides, and planes. Recurring checks include fragmented
      lines or headers, encoding
      conversion, timestamp arithmetic, parser state across buffers, renegotiation or
      flush, and teardown after partial output.

      XML-oriented typefinders inspect a bounded prefix and expected root element before
      producing caps. SubRip and WebVTT share subparse text, delimiter, and markup
      normalization modules after format detection.
  - id: project_karchive
    summary: "Replay a coherent archive through KArchive's format-specific handlers."
    project_names: ["karchive"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. The common KArchive harness places the same complete buffer in
      a seekable QBuffer and replays it through K7Zip, KTar, KZip, and KAr; there is no
      selector prefix. Each handler performs its own open/close and builds metadata, so
      preserve a coherent carrier and verify device position resets. Trace QIODevice
      reads/seeks -> format header/index parsing -> directory/file tree construction ->
      optional decompressor setup -> close and QObject destruction. Track byte offsets
      and sizes, entry counts, compressed versus uncompressed size, method/coder chains,
      name and link lengths, checksums, and archive-relative paths. High-yield boundaries
      include ZIP local headers versus central directory and EOCD, TAR 512-byte records
      plus PAX/sparse metadata, 7z variable-length integers and stream/coder tables, and
      ar fixed-width headers. Recurring failures involve offset-plus-size overflow,
      decompression-size products, duplicate/tree ownership, malformed links, path
      normalization, and partial-entry cleanup.

      Archive headers, decompressor output, and later checksum or indexing stages expose
      distinct size domains. Keep declared unpacked size and actual produced bytes
      separate.
  - id: project_libaom
    summary: "Preserve IVF framing and AV1 decoder state across every frame."
    project_names: ["libaom"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. The usual libaom decoder target consumes a complete IVF file,
      not a bare AV1 OBU stream: a 32-byte IVF header is followed by frame records
      containing a byte length and timestamp, then encoded bytes. Trace IVF validation
      and frame allocation -> aom_codec_dec_init with a compile-time thread count ->
      per-frame decode -> drain every aom_codec_get_frame result -> codec destroy and
      buffer free. Track little-endian header fields, frame size in bytes, timestamp,
      width/height, time base, threads, bit depth, chroma subsampling, image-plane
      stride, and reference-frame state. Inside AV1, follow OBU type and LEB128 size ->
      sequence/frame headers -> tiles and entropy decode -> filters, restoration, film
      grain, and output planes. Recurring bugs appear in LEB and tile-size arithmetic,
      frame dimensions and plane products, tile/count allocation, reference and
      spatial-layer state, truncated entropy symbols, thread error unwinding, and
      caller-owned image lifetimes.

      AV1 show_existing_frame records display an earlier decoded reference without a
      full new frame. Track the reference map active for the current frame and the map
      prepared for the next transition, including refresh operations. This state depends
      on earlier frame history.
  - id: project_libbpf
    summary: "Trace libbpf's userspace ELF, relocation, map, and BTF object parser."
    project_names: ["libbpf"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. The libbpf object fuzzer passes the complete artifact to
      bpf_object__open_mem and then closes it; it exercises userspace ELF/BPF parsing,
      not kernel loading or verifier execution. Trace ELF identification ->
      section/string tables -> program and map collection -> symbols and relocations ->
      BTF and BTF.ext/CO-RE parsing -> object close. Track ELF class, byte order,
      machine, section offset/size/alignment/entry size, section and symbol indices,
      string offsets, relocation target/addend, BPF instruction count, map layout, BTF
      type id/kind/vlen, and record-size units. Recurring failures cluster around count
      times entry-size overflow, section ranges outside the image, unterminated names,
      invalid link/info indices, relocation-to-instruction conversion, recursive or
      forward BTF types, variable-length BTF records, and cleanup of partially allocated
      programs, maps, and BTF objects. A verifier-only instruction sequence is
      insufficient unless the harness loads it.

      BTF.ext optional record groups are described by subsection offsets and lengths.
      BTF-defined maps use DATASEC variable entries and referenced type IDs. Keep
      subsection containment and type resolution as separate stages.
  - id: project_libspectre
    summary: "Model libspectre DSC scanning, page tables, and optional validation."
    project_names: ["libspectre"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. The libspectre read target supplies a complete PostScript or
      EPS stream to spectre_document_load_from_stream. Loading scans Document
      Structuring Comments and may render only some unstructured documents; confirm
      renderer paths separately. Trace DOS-EPS/PS identification -> DSC header, preview,
      defaults, prolog, setup, pages, and trailer scan -> page/media/bounding-box table
      construction -> optional Ghostscript validation -> document destruction. Track
      file positions and section lengths in bytes, line length, page count/order,
      ordinal, BoundingBox coordinates, BeginData/BeginBinary byte or line counts,
      nested BeginDocument depth, (atend) state, and EPS preview offsets. Recurring
      failures involve long or unterminated lines, signed/unsigned offset arithmetic,
      page-table growth, binary-section skips beyond EOF, misleading nested DSC markers,
      bounding-box dimension products, and cleanup of partially built pages, media,
      temporary data, or Ghostscript state.

      DOS-EPS preview handling has a binary header before DSC scanning, with separate
      PostScript, metafile, and TIFF regions plus a checksum. Keep preview-region framing
      distinct from the later text scanner.

      DSC comments are line-oriented `%%Keyword: operands`. Page sections can carry
      `%%Page`, `%%PageOrientation` with an orientation keyword, and
      `%%PageBoundingBox` with four coordinates or `(atend)`. Treat recognition of the
      comment keyword and parsing of its operands as separate stages, including absent
      or incomplete operands.
  - id: project_mosquitto
    summary: "Bind MQTT session stage, configuration, or persistence carrier before parsing."
    project_names: ["mosquitto"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. Mosquitto has separate carriers: a raw first MQTT packet, a
      packet sent after CONNECT establishes session state, broker configuration text,
      and persistence-database files. The target selects the carrier. Network targets
      start a local broker, send input, receive a response, then join it. Trace fixed
      header -> base-128 Remaining Length -> packet-specific variable
      header/properties/payload -> authentication, subscription, publish, or session
      state -> response and cleanup. Track packet type and reserved flags, protocol
      level, QoS, packet id, UTF-8/binary field lengths in bytes, MQTT v5 property ids
      and multiplicity, topic/filter rules, remaining bytes, and connection state.
      Recurring failures occur in four-byte length decoding, nested property lengths,
      malformed UTF-8, QoS/session transitions, partial socket reads, retained messages,
      config include/listener parsing, persistence record size/version handling, and
      cleanup of clients, will data, subscriptions, and queued messages. Configuration
      values can decode hexadecimal text into caller-provided binary capacity, so input
      characters and decoded bytes are separate length domains. Listener declarations
      build shared configuration tables whose identity and references can span later
      directives; treat table growth as a configuration ownership boundary.
  - id: project_rnp
    summary: "Separate OpenPGP packet dumping from keyring import and indexing."
    project_names: ["rnp"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. RNP targets consume a complete OpenPGP packet stream, but
      packet dumping and keyring loading exercise different chains. Dump paths wrap
      memory input -> parse and print packets to a null/output sink -> destroy handles;
      keyring paths create an FFI context -> load public/secret keys in a selected format
      -> index keys and identities -> destroy input and FFI state. Track old/new packet
      headers, tag, one/two/five-octet and partial-body lengths, MPI bit lengths,
      algorithm ids, signature version and hashed/unhashed subpacket areas, S2K
      parameters, compression nesting, literal-data lengths, and key/user-id/signature
      relations. Recurring failures cluster around partial-length accumulation, MPI byte
      rounding, nested compressed or encrypted packets, subpacket overruns, unsupported
      algorithm paths, duplicate key merging, secret-key protection metadata, and
      ownership of packet, key, stream, and crypto contexts. ASCII armor is separate
      unless the harness decodes it.

      Key-store loading has distinct OpenPGP and KBX readers. A KBX region can pass an
      embedded OpenPGP keyblock into the shared packet parser, and later raw packet
      conversion can reserialize parsed fields. Model both parse and write-back stages.
  - id: project_sleuthkit
    summary: "Bind Sleuth Kit's volume, filesystem, or APFS pool target to a disk image."
    project_names: ["sleuthkit"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. Sleuth Kit fuzzers present the complete artifact as a seekable
      memory disk image. Compile-time choice fixes a volume-system or filesystem type:
      mmls targets open and walk partitions; fls targets open a filesystem and
      recursively walk directories; APFS may first open a pool and derive a volume
      image. No selector byte chooses MBR, GPT, NTFS, FAT, ext, APFS, or another parser.
      Trace memory-image reads -> volume/pool open -> filesystem open -> metadata, inode
      and extent traversal -> child image, fs, pool, and base image close. Track
      sector/block size, byte offset, partition start/count, endian fields, inode/object
      id, allocation flags, extent logical/physical lengths, directory recursion, and
      sparse/compressed data. Recurring failures involve block-to-byte overflow, ranges
      beyond image size, cyclic metadata trees, corrupt count/record sizes, APFS
      checkpoint/object-map B-trees, NTFS runlists, directory name lengths, deep
      recursion, and close ordering for derived images.

      Filesystem metadata commonly nests variable records inside attributes and larger
      record buffers. Preserve both the immediate and enclosing span when following
      offsets into runlists, inline attributes, or similar variable data.
  - id: project_wamr
    summary: "Trace WAMR module loading with exact WebAssembly section and index invariants."
    project_names: ["wamr"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. The common WAMR loader fuzzer treats the artifact as a
      WebAssembly binary module, copies it to writable memory, and runs runtime init ->
      wasm_runtime_load -> unload on success -> runtime destroy. AOT modules, execution,
      instantiation, WASI, and custom-section tools are separate targets; add no selector
      or runtime arguments unless consumed. Track the 8-byte magic/version prefix,
      section id and LEB128 byte length, section order, vector counts, type/function/code
      index agreement, local counts, control-stack depth, branch/call indices,
      table/memory limits in pages, data/element offsets, alignment exponents, feature
      flags, and ownership of partial modules. Recurring failures arise in overflowing
      or unterminated LEB values, count times element-size allocation, section-end
      arithmetic, mismatched function bodies, nested control structures, SIMD
      immediates, memory/table bound conversion, malformed names/custom sections, and
      unload or runtime-global cleanup after late validation failure.

      A sized code body contains local declarations and a terminated instruction
      expression. Loader variants must agree on body boundaries and on the units used
      to represent derived frame and operand capacity.
  - id: project_botan
    summary: "Separate Botan arithmetic, padding, TLS, and structured-object contracts."
    project_names: ["botan"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. Botan exposes independent direct arithmetic, padding, TLS,
      ASN.1, certificate, key, and elliptic-curve targets. BigInt targets can decode the
      whole span, split equal halves for division, or use a flag plus fixed-width value
      and modulus regions. Padding targets pass the complete span directly to PKCS7,
      X9.23, one-and-zero, ESP, TLS-CBC, OAEP, or PKCS#1 checks; that input is not a TLS
      record. TLS targets instead construct policy, RNG, session and callbacks before
      receiving peer traffic.

      Track partition widths, sign, normalization, quotient/remainder invariants,
      modulus zero, block size, claimed padding tail, valid-mask semantics, record and
      handshake lengths, ASN.1 lengths, and object ownership. Recurring checks include
      division and reduction edge values, carry/borrow capacity, constant-time scans at
      short lengths, delimiter and padding agreement, nested-length overflow,
      out-of-order handshake state, non-canonical integers, parse-versus-marshal
      asymmetry, and exceptional cleanup.

      PKCS#8 input is an ASN.1 PrivateKeyInfo containing an AlgorithmIdentifier and a
      private-key octet string. For elliptic-curve keys, the algorithm parameters can
      name a registered curve or carry explicit X9.62 EC parameters. Explicit parameters
      describe the field, curve coefficients, base point, order, and optional cofactor;
      the library constructs the EC group before interpreting the nested private-key
      value. Keep outer DER framing, algorithm parameters, group integers and point
      encoding, private-key bytes, and later arithmetic state distinct.
  - id: project_cpython3
    summary: "Bind CPython's build-selected parser and C-API target before shaping input."
    project_names: ["cpython3"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. CPython's _xxtestfuzz executable is commonly compiled for one
      target; selection is not an artifact selector. Direct spans can feed JSON, CSV,
      numeric, Unicode, or literal parsers. struct unpack splits at the first NUL into a
      format and data buffer, while a regex compiler can consume a leading flags word
      and use the remainder as pattern bytes. Do not transfer one envelope to another.

      Trace bytes -> PyBytes or PyUnicode -> selected parser/compiler -> Python object
      graph or VM helper -> exception normalization -> DECREF and runtime cleanup.
      Track byte length versus code points and storage kind, Py_ssize_t conversions,
      format-derived item counts and alignment, regex opcode and capture counts,
      recursion depth, buffer exports, and new versus borrowed references. Expected
      syntax, Unicode, overflow, or recursion exceptions are usually rejection states,
      but source-to-AST paths may continue into representation or error formatting. Some
      AST implementation is generated, so inspect both the generator and checked-in output.
      A sanitizer report during import or runtime setup before input consumption belongs to
      the object-construction and initialization boundary rather than a payload grammar.
  - id: project_elfutils
    summary: "Trace elfutils ELF, core, DWARF, compression, and address-space consumers."
    project_names: ["elfutils"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. elfutils fuzzers commonly write the complete artifact to a
      temporary file. A libelf target opens it in read or mmap modes, walks sections,
      and may decompress SHF_COMPRESSED or legacy .zdebug data. A libdwfl target reports
      an offline module and asks for DWARF; a core target opens an ELF core and builds a
      Dwfl report. A section fragment cannot replace the required ELF or core file.

      Trace ELF ident and class -> file/program/section headers -> string, symbol,
      relocation, note, or compressed section -> DWARF units, DIEs, line tables, or
      module address mapping -> elf_end/dwfl_end. Keep file offsets, virtual addresses,
      entry counts and sizes, compression sizes, endian/class word width, string
      indexes, DIE form widths, and ownership distinct. Recurrent checks include
      wrapped offset-plus-size, undersized entries, invalid linked-section indexes,
      decompression-size mismatch, unterminated names, recursive DIE references,
      address-bias errors, and cleanup after a partially reported module.

      Separate libelf section materialization and per-record endian conversion from
      libdwfl core reporting. Conversion can allocate section-data buffers and work in
      records, while core reporting reads dynamic-linker structures through core-memory
      views. Keep their class, word-size, offset, count, and ownership state separate.
  - id: project_geos
    summary: "Bind GEOS WKT, WKB, geometry graphs, and topology operations."
    project_names: ["geos"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. GEOS targets may accept WKT text, WKB binary, or a combined
      artifact. One combined harness terminates WKT at the first NUL and starts the WKB
      span at that delimiter, so it can also be WKB's byte-order byte. Separate targets
      have different boundaries. Parse success is only an early checkpoint when the
      harness runs intersection, difference, union, serialization, or destruction.

      Trace lexer or WKB header -> coordinate sequences -> rings and components ->
      topology or overlay -> result writer -> destroy. Track endian, geometry type and
      dimensional flags, coordinate count, ring and collection counts, SRID, empty
      values, ownership, and result nullability. Recurrent checks include
      count-times-coordinate-size overflow, truncated collections, inconsistent ring
      closure or cardinality, NaN and infinity in predicates, deep recursion, topology
      built from degenerate components, and double destruction or leaks across
      exceptions. Preserve the smallest valid graph that reaches the selected operation.

      Union and intersection can route through either the legacy geometry-graph overlay
      family or the newer overlay engine. After geometry construction, bind the selected
      engine before tracing noding, topology, result writing, and ownership boundaries.
  - id: project_haproxy
    summary: "Separate HAProxy HPACK blocks, configuration files, and HTTP state machines."
    project_names: ["haproxy"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. HAProxy targets expose distinct carriers. An HPACK decoder can
      receive the complete artifact as one header block with fresh table, header and
      output buffers. A configuration target writes the artifact to a file and invokes
      readcfgfile. Other revisions can expose HTTP/1 or HTTP/2 analyzers; do not add
      request framing to HPACK or treat config as traffic.

      Trace HPACK representation -> prefix integer or Huffman decode -> static/dynamic
      table lookup and eviction -> header list, or config line -> section and keyword
      dispatch -> typed arguments -> proxy/server/listener objects -> teardown. Keep
      encoded and decoded lengths, table capacity and entry size, header count, output
      capacity, line termination, quoting, argument count, and ownership distinct.
      Recurrent checks include integer continuation overflow, invalid Huffman padding,
      stale table indexes, eviction arithmetic, decoded expansion, header exhaustion,
      quote boundaries, duplicate directives, and cleanup of partially linked config
      objects.

      Configuration parsing expands quotes and escapes into reusable output storage and
      populates argument views before keyword dispatch. Counting and diagnostic modes
      can observe the same intermediate state. Track backing storage, argument views,
      and reuse across lines.
  - id: project_hdf5
    summary: "Trace HDF5 files through object metadata, filters, datasets, and handle cleanup."
    project_names: ["hdf5"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. HDF5 fuzzers materialize an HDF5 file. A read target in some
      revisions consumes one legacy leading control byte and writes the remainder;
      another opens the full artifact read-write, then looks up a named dataset and
      attribute. Bind that split. File open is only an early checkpoint for dataset,
      chunk, filter, or close paths.

      Trace superblock -> object header and messages -> groups, links, heaps and B-trees
      -> datatype and dataspace -> layout, chunks and filters -> dataset or attribute
      operation -> H5*close. Track address and size widths, offsets, dimensions, element
      size, chunk coordinates, compressed and decoded sizes, filter masks, reference
      counts, and hid_t validity. Recurrent checks include wrapped dimension products,
      malformed message continuation, cyclic links, stale heap or B-tree indexes,
      chunk-offset mismatch, filter expansion, recursive datatype graphs, and closing
      partially initialized identifiers. A signature alone cannot reach a late consumer
      without coherent metadata.

      Superblock decoding materializes root metadata and reads variable-width file
      addresses through nested decoders. Object-header messages have typed encode/decode
      callbacks with separate source and destination spans. Keep serialized-image,
      message-buffer, and later cleanup state distinct.
  - id: project_libical
    summary: "Trace libical text through component, property, value, and timezone graphs."
    project_names: ["libical"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. The common libical target copies the complete artifact,
      appends one NUL, calls icalparser_parse_string, and recursively frees the returned
      component. The carrier is iCalendar text, not a raw property value or binary
      calendar. Explicit size and the appended terminator differ when embedded NULs
      exist.

      Trace unfolded content lines -> BEGIN/END component stack -> property and
      parameters -> value decoder -> recurrence, duration, date-time or timezone objects
      -> component graph -> free. Preserve line folding, quoting and escaping, matching
      component names, and enough VCALENDAR state for nested consumers. Track byte
      spans, token counts, list ownership, time units and UTC offsets, recurrence
      cardinality, and parent-child links. Recurrent checks include delimiter-edge
      underflow, unterminated quoted parameters, malformed escape tails, excessive
      nesting, inconsistent recurrence counts, timezone transition expansion, duplicate
      ownership, and cleanup of a partially attached property or component. REQUEST-STATUS
      is a semicolon-separated status code, description, and optional extension field.
      Keep parsed substrings and normalized or stringified temporary storage distinct from
      data owned by the component and property graph.
  - id: project_libtpms
    summary: "Bind libtpms command framing, TPM state, callbacks, and suspend-resume paths."
    project_names: ["libtpms"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. A common libtpms target registers NVRAM and locality callbacks,
      selects TPM 2, initializes the library, sends Startup, and passes the complete
      artifact as one TPM command. It then serializes volatile and permanent state,
      terminates, restores both blobs, initializes again, and tears down. Other targets
      may bind TPM 1.2; verify the selection.

      Trace big-endian tag, total size and command code -> handles and sessions ->
      authorization area -> parameters -> TPM object or NV state -> response allocation
      -> GetState/SetState -> callback cleanup. Keep declared command size, available
      bytes, handle count, parameter size, algorithm-dependent digest length, response
      capacity, and permanent versus volatile ownership distinct. Recurrent checks
      include nested-size disagreement, count-array overflow, unsupported algorithm
      parameters, session or handle confusion, NV blob truncation, response-growth
      arithmetic, failure cleanup, and aliases that survive suspend-resume.

      Some commands carry another TPM command code as a parameter. Keep this inner code,
      outer dispatch code, and any derived table or bitmap index as distinct domains.
  - id: project_lua
    summary: "Trace Lua source through compilation, VM execution, GC, and state teardown."
    project_names: ["lua"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. A common Lua target creates a fresh lua_State, passes the
      complete span with explicit size to luaL_loadbufferx in text-only mode, executes a
      compiled chunk under lua_pcall with a traceback handler, and closes the state. The
      artifact is Lua source, not a precompiled chunk, and need not be NUL-terminated.

      Trace lexer and parser -> prototype, constants and instructions -> call frames and
      VM opcodes -> tables, strings, closures and metamethods -> error unwinding and GC
      -> lua_close. Keep byte offsets, integer versus floating values, stack top and
      frame limits, table capacities, string lengths, upvalue ownership, and allocator
      sizes distinct. Recurrent checks include token or escape boundaries, size
      arithmetic, deep expression or prototype recursion, stack growth invalidating
      aliases, table rehash and sparse indexes, malformed metamethod transitions,
      open-upvalue lifetime, and GC barriers during exceptions. Syntax rejection never
      reaches VM-only paths; retain a minimal compilable program.
  - id: project_lxc
    summary: "Trace LXC configuration text through key dispatch and owned runtime objects."
    project_names: ["lxc"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. The LXC config target writes the complete artifact to a
      temporary file, initializes lxc_conf, calls lxc_config_read, and frees the
      configuration. It parses configuration text; it does not start a container.
      Includes, hooks, mounts, and path-bearing keys reach file helpers only if the
      harness environment permits it.

      Trace line reader -> key/value split -> namespace or indexed-key dispatch -> typed
      converter -> network, mount, idmap, capability, cgroup, hook, or console lists ->
      lxc_conf_free. Keep line length, token count, signed numeric range, network index,
      address units, idmap triplets, path lifetime, list membership, and duplicate-key
      replacement distinct. Recurrent checks include empty values, quote or continuation
      boundaries, oversized index conversion, conflicting indexed objects, partially
      appended nodes, normalization that changes ownership, and cleanup after a handler
      fails. Preserve a valid outer key grammar before mutating a deeper value. Signal-valued
      keys share converters for symbolic and real-time signal spellings, while time-offset
      keys combine numeric conversion with a residual text span; both are deeper typed
      domains behind the same outer key/value grammar.
  - id: project_njs
    summary: "Trace njs JavaScript source through VM compile, events, and destruction."
    project_names: ["njs"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. The common njs process-script target treats the complete
      artifact as JavaScript source with explicit length. It creates a VM with
      externals, compiles through the source end, starts only after compilation, drains
      supported events, and destroys the VM. It needs no trailing NUL and is not an
      nginx configuration target.

      Trace lexer/parser -> generator and bytecode -> VM frames -> objects, arrays,
      typed arrays, strings, regexps and external values -> events or promises -> pool
      destruction. Keep UTF-8 spans versus UTF-16 indexes, array length and capacity,
      typed-array offsets, regexp capture counts, property-table generations,
      frame/argument aliases, and event ownership distinct. Recurrent checks include
      truncated escapes, length arithmetic, sparse array growth, detached or overlapping
      views, capture-vector sizing, prototype mutation during lookup, exception
      unwinding, and pending-event cleanup. Parser errors cannot exercise VM or event
      state; use minimal valid source to cross that phase.

      Lexing and string operations share an explicit source span but may measure progress
      in bytes, encoded characters, or logical positions. Keep those cursor domains
      mapped consistently, including at the end of input.
  - id: project_openexr
    summary: "Trace OpenEXR multipart, tiled, scanline, deep, and codec state."
    project_names: ["openexr"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. OpenEXR check targets consume a complete EXR memory buffer.
      One uses the C++ API and another enables OpenEXRCore; both can validate headers and
      read scanline, tiled, deep, and multipart data under resource limits. Bind the
      built executable before choosing API-specific state. A compressed chunk cannot
      replace its headers and chunk-offset table.

      Trace magic/version -> part headers and attributes -> data/display windows,
      channels, tiles and levels -> chunk table -> decompressor -> pixel or deep-sample
      buffers -> cleanup. Keep signed window coordinates, derived dimensions, channel
      sampling, pixel type and size, tile/level geometry, chunk offsets and sizes,
      compressed versus decoded bytes, deep sample counts, and ownership distinct.
      Recurrent checks include negative-window arithmetic, dimension products,
      malformed attribute sizes, duplicate part metadata, invalid chunk offsets, codec
      expansion, subsampled row math, deep sample-count prefix sums, and exception
      cleanup of partial frame buffers.

      Core chunk and pixel reads converge on the context read callback, making its
      offset, size, and remaining-span arithmetic a shared boundary. Compressed chunks
      can add inner codec metadata whose framing is independent of the outer chunk table.

      EXR headers are terminated attribute lists: each attribute carries NUL-terminated
      name and type strings plus a little-endian value length, while channel lists have
      their own terminator. Storage mode and data-window geometry determine chunk-table
      cardinality; each offset and chunk leader must resolve inside the artifact before
      codec bytes matter. DWA chunks add independent counters and channel-rule lengths.
      Use a writer or decoded fixture instead of relying on a remembered total header
      size.
  - id: project_openjpeg
    summary: "Separate OpenJPEG J2K codestream and JP2 box carriers through full decode."
    project_names: ["openjpeg"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. OpenJPEG exposes separate J2K and JP2 decompress targets. Each
      consumes the complete artifact through an in-memory read/seek/skip stream, checks
      its signature, creates the decoder, reads the header, may bound a decode area,
      decodes, ends decompression, and destroys codec, stream, and image. JP2 and raw J2K
      carriers are not interchangeable.

      Trace JP2 boxes if present -> codestream markers and segment lengths -> SIZ image
      and components -> coding style, quantization, tiles and packets -> tag trees and
      code blocks -> inverse transforms -> component buffers. Keep signed stream cursor,
      file length, marker length, tile coordinates, resolution and precinct counts,
      component precision and subsampling, code-block dimensions, packet lengths, and
      allocation sizes distinct. Recurrent checks include seek/skip overflow, wrapped
      geometry, truncated marker payloads, tile-part length mismatch, packet-iterator
      overflow, tag-tree depth, entropy bounds, and cleanup after partial allocation.

      HTJ2K code-block state includes typed flag storage with its own capacity units.
      Multi-component processing depends on both image-level component geometry and the
      current decoded windows; keep these representations aligned across stages.
  - id: project_perfetto
    summary: "Bind Perfetto protobuf, trace, IPC frame, ftrace page, and ring-buffer inputs."
    project_names: ["perfetto"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. Perfetto has distinct targets: raw protozero fields, a
      complete trace followed by end-of-file, an IPC byte stream fed through
      BeginReceive/EndReceive, a fixed-size ftrace page zero-filled then overlaid with
      input, and shared-ring or unwinding models. Their envelopes and state are not
      interchangeable.

      Trace protobuf key -> varint or length-delimited field -> nested message; trace
      packet -> sequence and interned state -> parser/storage; IPC frame length ->
      buffered assembly -> wire message; or ftrace page header -> aligned records ->
      event translation. Keep encoded length, available span, field number/wire type,
      sequence IDs, timestamps, frame capacity, page/record alignment, ring positions,
      and buffer ownership distinct. Recurrent checks include varint overflow,
      nested-length truncation, partial-frame state, stale interned references, timestamp
      arithmetic, padded-record wrap, ring generation confusion, EOF finalization, and
      cleanup of queued slices.

      Some trace importers accumulate graph state across protobuf packets and emit rows
      only during end-of-file notification. Include finalization and graph-to-storage
      mapping in the route.

      Repository maintenance tools are a separate execution family from runtime trace
      processing. Proto merge generators and presubmit checks read and rewrite checked-in
      schema files, while the trace-processing fuzzer passes the artifact to
      TraceProcessor parsing and then end-of-file notification. A raw trace, proto field,
      or generated-file-shaped payload does not cross into an offline generator unless
      the exact harness explicitly invokes that tool or maps the artifact to one of its
      filesystem inputs. Bind that call edge before constructing stale-output or
      regeneration state.
  - id: project_qpdf
    summary: "Separate QPDF whole-document, JSON, stream-filter, and predictor carriers."
    project_names: ["qpdf"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. Main QPDF target treats input as PDF and processes its object
      graph, writes with object-stream, linearization and encryption settings,
      and traverses pages, content, images, forms, labels and outlines. Other
      executables directly fuzz Flate, LZW, run-length, ASCII85, hex, DCT, PNG/TIFF
      predictors, or QPDF JSON. Do not wrap a direct filter stream in PDF unless the
      target requires it.

      Trace header -> xref/trailer -> indirect objects and object streams ->
      page/resource graph -> filter pipeline -> writer or recursive helper ->
      destruction. Keep file offsets, object/generation IDs, declared stream length,
      decoded bytes, predictor columns/colors/bits, row size, page-tree counts,
      encryption state, and shared-object ownership distinct. Recurrent checks include
      xref and object-stream index overflow, cyclic graphs, malformed filter chains,
      decompression expansion, predictor row arithmetic, content-token boundaries,
      outline recursion, writer renumbering, and cleanup after repair or partial parse.

      Dedicated crypt and filter targets remain separate from whole-document parsing.
      Crypt-filter setup has its own algorithm and key-size state. Classic xref parsing
      also has fixed-width entry framing and a repair mode that can continue through a
      damaged outer structure.
  - id: project_stb
    summary: "Separate stb image decoders, metadata passes, and path utility inputs."
    project_names: ["stb"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. stb targets are compile-time selected. PNG-only and generic
      stb_image targets pass one complete encoded image through stbi_info_from_memory and
      then stbi_load_from_memory, often requesting four output channels. Separate path
      utilities consume bounded or terminated text, not image bytes.

      Bind the executable and macros. For PNG trace chunks -> deflate -> filters and
      interlace -> channel conversion; for JPEG trace markers and segment lengths ->
      tables -> scans and MCU blocks -> color conversion; for path helpers trace drive,
      directory, basename and extension boundary selection. Track dimensions, source
      and requested channels, row/plane geometry, expanded size, metadata-to-decode
      agreement, string length, separator rules, output capacity, and ownership.
      Recurring checks include dimension products, truncated segments,
      palette or Huffman indexes, progressive/interlaced state, delimiter edges,
      unterminated output, and freeing partial results.

      PNG reaches the shared DEFLATE symbol and back-reference machinery, whose symbol
      domains remain relevant inside the image carrier. Literal/length and distance
      codes come from separate alphabets; a back-reference combines a positive copy
      length with a backward distance from the current output position. Audit one
      alphabet at a time while keeping the other side of that pair semantically valid,
      and keep the expanded byte count consistent with the PNG row geometry. Path
      utilities separately have platform-specific prefix classes in addition to ordinary
      separator boundaries.
  - id: project_usrsctp
    summary: "Bind usrsctp passive raw packets and active staged-association envelopes."
    project_names: ["usrsctp"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. A listen target feeds the complete artifact, including the
      SCTP common header, to usrsctp_conninput on a persistent passive socket. A connect
      target can consume a leading stage selector, synthesize prior handshake packets
      and a common header with the current verification tag, then append only the
      remaining bytes as chunks. These carriers encode different association state.

      Trace common header -> association lookup -> aligned chunk loop -> INIT/COOKIE,
      DATA or I-DATA, SACK, RE-CONFIG, shutdown or error handler -> reassembly,
      notifications, timers and cleanup. Keep network byte order, packet and chunk
      lengths, four-byte padding, ports, verification tag, TSN, stream and message IDs,
      advertised window, parameter lengths, fragment ownership, and association state
      distinct. Recurrent checks include short or zero chunk lengths, padding past end,
      serial-number wrap, duplicate chunks, fragment-size accumulation, stream-reset
      races, stale timer/upcall references, and cleanup after a state change.

      Address-reconfiguration chunks contain nested, length-delimited parameters whose
      inner addresses have their own spans. Destination lookup, timer, and notification
      processing share association-lifecycle state, including unsuccessful lookups.

      An ASCONF operation parameter carries operation-level correlation state followed
      by a nested address parameter with its own type and length. A valid enclosing
      chunk or parameter-loop advance does not prove that the operation span contains
      the nested parameter header. Validate the operation span before reading the inner
      type or length, then validate the address value against both inner and enclosing
      remainders.

      A COOKIE_ECHO is also a state-recovery envelope, not only an opaque authenticated
      blob. The state cookie is followed by the peer INIT and the local INIT-ACK material;
      after cookie validation, the listener can reconstruct an association and pass the
      embedded INIT back through initialization. Keep the outer packet and chunk span,
      cookie state and signature, embedded INIT and INIT-ACK chunks, and each parameter
      list as separate bounded domains. Cookie lifetime is stored in ticks while its
      timestamp and stale-cookie report use time values with other units, so bind every
      conversion at the producer and consumer boundary.
  - id: project_boringssl
    summary: "BoringSSL target carriers, control envelopes, and crypto/TLS state checkpoints."
    project_names: ["boringssl"]
    content: |
      Target/carrier: identify the binary first. Certificate, PKCS#8, PKCS#12, SPKI,
      PEM, session, DER-roundtrip, bignum, SSL_CTX API, and TLS/DTLS handshake fuzzers
      consume different grammars. The TLS client/server harness first parses 16-bit
      control tags; session, handoff, handback, and hint values use 24-bit byte lengths,
      a data tag ends controls, and only the remainder is peer traffic. TLS reads that
      tail as a stream; DTLS reads repeated 24-bit-length datagrams. Call chain:
      SetupTest -> SSL/BIO setup -> SSL_do_handshake, including optional
      handoff/handback; object targets use CBS/d2i or format-specific parse, then
      exercise deferred fields and marshal/free paths. Track byte lengths, consumed CBS
      spans, role, protocol version, record/handshake lengths, extension-vector lengths,
      and ownership. Recurring checkpoints are nested ASN.1 length overflow or
      non-canonical DER, trailing-data policy, TLS transcript state, DTLS fragment
      epochs/sequences, session resumption, parse-then-marshal asymmetry, error-queue
      cleanup, and SSL_CTX reset. Verify tags against checked-in fuzzer_tags.h. The CONF
      target routes configuration text into X.509 extension construction. SSL_CTX API
      targets instead combine an operation selector with length-delimited argument spans;
      keep those spans distinct from APIs that consume terminated C strings. Do not
      assume an object duplication helper is a fieldwise allocation: verify whether it
      serializes and parses. In that case, keep encoder rejection separate from allocator
      failure, and check whether setter- or configuration-created sentinel and incomplete
      states are accepted in memory but cannot be encoded.
  - id: project_clamav
    summary: "ClamAV scan and database carriers, recursive parsers, and lifetime checkpoints."
    project_names: ["clamav"]
    content: |
      Target/carrier: scanmap and scanfile treat the artifact as a file image, while
      dbload treats it as one signature-database file. Compile-time variants force
      ARCHIVE, MAIL, OLE2, PDF, HTML, PE, ELF, SWF, XMLDOCS, or HWP3 parsing; database
      variants select CDB, LDB, NDB, YARA, and other formats by suffix. Call chain:
      memory fmap or temporary file -> cl_scanmap_callback/cl_scanfile -> type dispatch
      -> selected parser, decompressor, or unpacker -> recursive embedded-object scans;
      dbload runs cl_load into a persistent engine. Track byte offsets/sizes, compressed
      versus expanded size, object count/depth limits, endian fields, scan options, fmap
      view lifetime, and engine ownership. Recurring checkpoints are archive recursion
      and amplification, truncated nested headers, conversion between file offsets and
      allocation sizes, cleanup after partial extraction, sniffed versus forced type,
      database token counts, logical-signature expression state, bytecode/signature
      lifetime, and persistent engine contamination. Preserve binary carriers; do not
      substitute text for binary formats.

      Recursive scanning can extract an OLE2 document from a ZIP member and then decode
      a compressed VBA project stream. VBA directory records add ANSI and UTF-16 strings,
      record lengths, decompressed-stream state, and codepage conversion. Keep each
      nested carrier and text representation as a separate boundary.
  - id: project_dav1d
    summary: "dav1d IVF framing, decoder progress, picture geometry, and teardown checkpoints."
    project_names: ["dav1d"]
    content: |
      Target/carrier: the decoder harness uses IVF-style framing, not a bare AV1 OBU
      stream. It reserves and skips a 32-byte IVF prelude, then reads repeated 12-byte
      little-endian frame headers whose first four bytes are frame payload length; the
      other eight are timestamp material. Verify whether the checked target validates
      the prelude. Allocation-failure variants can hash those 32 bytes to choose failure
      probability, thread count, and frame delay. Call chain:
      dav1d_open -> find a payload with a valid sequence header -> dav1d_data_create/copy
      -> dav1d_send_data and dav1d_get_picture until input drains -> picture/data unref
      -> close. Track frame bytes consumed, OBU and bit lengths, sequence/frame/tile
      state, reference slots, width/height/stride, pixel layout, thread/frame-delay
      settings, and EAGAIN versus fatal errors. Recurring checkpoints are LEB128/OBU
      arithmetic, tile/restoration geometry, reference-frame lifetime, delayed output
      during flush, partial-input ownership, high-bit-depth plane sizing, cross-thread
      teardown, and allocation-error unwinding. Keep a coherent sequence header before
      deeper frame paths.
  - id: project_fio
    summary: "fio in-memory INI carrier, typed option units, parser state, and cleanup checkpoints."
    project_names: ["fio"]
    content: |
      Target/carrier: fuzz_parseini requires at least two bytes. Bytes [0:size-1) become
      a mutable NUL-terminated in-memory fio job file; the final byte is passed
      separately as the client_type argument and is not INI text. One-time fio option
      initialization persists across inputs. Call chain: parse_jobs_ini(is_buf=1) ->
      newline/section scanner -> create global or job thread_data -> collect option
      strings -> fio_options_parse and per-option callbacks; parse-only mode avoids
      starting I/O. Track section boundaries, option name/value ownership, client type,
      integer base, and units for sizes, time, rates, percentages, offsets, and ranges.
      Recurring checkpoints are suffix scaling overflow, signed/unsigned narrowing,
      comma/range list growth, duplicate/global inheritance, empty or comment lines,
      NUL truncation, recursive include handling under buffer mode, realloc failure, and
      cleanup of partially created jobs. Build a syntactically valid [global] or named
      section before varying one typed option, and keep the selector byte outside the
      text.

      String options can expand `$keyword` forms before their callbacks run. Expansion,
      suffix handling, option limits, and pathname callbacks each have their own source
      and destination state.
  - id: project_h2o
    summary: "H2O URL and packet-scheduled HTTP carriers with parser and connection state."
    project_names: ["h2o"]
    content: |
      Target/carrier: URL fuzzing passes the full byte slice and explicit length to
      h2o_url_parse. HTTP/1 and HTTP/2 targets drive a live socket/event-loop path. Their
      input is a packet schedule: each packet is the bytes before the literal
      newline--MARK--newline delimiter; the delimiter is removed, and an undelimited
      tail is not sent. Append a delimiter for each intended packet. Call chain: client
      writer/socketpair -> h2o_http1_accept or h2o_http2_accept -> event loop -> request
      parser -> path, file, or reverse-proxy handler -> teardown. Track bytes per packet,
      HTTP/1 Content-Length/chunk sizes and CRLF state, or HTTP/2 frame
      length/type/flags/stream id, HPACK table bytes, stream/connection windows, and
      timeouts in milliseconds. Recurring checkpoints are fragmented headers, request
      length disagreements, chunk/trailer transitions, HTTP/2 CONTINUATION sequencing,
      reset with queued callbacks, HPACK integer/string lengths, URL authority/host/path
      aliasing, proxy backpressure, and close races. Confirm which HTTP variant is
      compiled.

      HTTP/2 reverse-proxy request bodies are callback-driven, with END_STREAM marking a
      terminal body state. The priority scheduler separately owns dependency and queue
      links. Track stream lifecycle and scheduler ownership together.
  - id: project_hermes
    summary: "Hermes source evaluation pipeline, runtime limits, exception, and GC checkpoints."
    project_names: ["hermes"]
    content: |
      Target/carrier: fuzzer-jsi-entry consumes raw JavaScript source, not Hermes
      bytecode. Empty input and inputs recognized by isHermesBytecode are rejected;
      otherwise the harness copies all bytes, appends NUL, creates a fresh runtime,
      installs a 10,000 ms limit, and calls evaluateJavaScript. JavaScript exceptions
      are swallowed, while native exceptions or memory faults remain findings. Call
      chain: source -> lexer/parser -> semantic and IR generation ->
      bytecode/interpreter execution -> runtime/GC destruction. Track byte length versus
      UTF-8/code-unit length, token/nesting depth, source ranges,
      array/string/typed-array lengths, property indexes, stack/register counts, and GC
      root ownership. Recurring checkpoints are parser recovery with incomplete
      literals, numeric/string escape conversion, regex compilation, deep AST/IR
      recursion, closure lifetime, exception unwinding across native frames,
      proxy/getter reentrancy, ArrayBuffer detachment, bytecode operand narrowing, and GC
      movement during allocation-heavy builtins. A thrown JSIException alone is not a
      crash signal.
  - id: project_jq
    summary: "jq parse, compile, stream, file, and flag-envelope carrier distinctions."
    project_names: ["jq"]
    content: |
      Target/carrier: keep jq targets separate. jq_fuzz_parse copies bytes and appends
      NUL before jv_parse; jq_fuzz_compile does the same before jq_compile, so embedded
      NUL terminates them. jq_fuzz_load_file writes the full artifact and invokes
      jv_load_file in raw and parsed modes. Streaming parsing uses JV_PARSE_STREAMING.
      The extended target reserves two native 32-bit words for parse and dump flags,
      then NUL-terminates the remaining text and may call jv_dump. Call chain:
      lexer/parser -> jv arrays, objects, strings, and numbers; filter compilation
      continues through AST/code generation and Oniguruma regex paths; file loading
      repeatedly feeds parser state. Track byte/codepoint lengths, flags, depth, token
      spans, jv refcounts, stream boundaries, number conversions, and dump mode.
      Recurring checkpoints are Unicode escape/surrogate handling, exponent overflow,
      object growth, streaming end-state, compile-error cleanup, interpolation/regex
      nesting, refcount transfer, invalid flags reaching serializers, and raw-versus-JSON
      file behavior. Do not prepend flag words to plain targets.

      jq numbers use decimal contexts whose precision and exponent range affect
      comparison and formatting. Compile-time constant folding and parse-and-dump paths
      consume the same numeric state at different phases. Keep representation,
      destination capacity, and serialization state separate.
  - id: project_jsoncpp
    summary: "JsonCpp option-prefix carrier, parser modes, tree ownership, and boundary checks."
    project_names: ["jsoncpp"]
    content: |
      Target/carrier: the JsonCpp fuzzer reserves the first four bytes as a little-endian
      settings bitmap and parses the remainder with a CharReader. Bits select
      fail-if-extra, comments, strict root, dropped null placeholders, numeric keys,
      single quotes, duplicate-key rejection, special floats, comment collection, and
      trailing commas; supported bits and spelling vary by revision. Call chain:
      CharReaderBuilder -> reader construction -> token scanner/readValue recursion ->
      Json::Value tree and comment storage -> exception cleanup. Track the control
      prefix, parser begin/end pointers, byte offsets, depth, object/array cardinality,
      numeric type/range, key/string length, and builder defaults. Recurring checkpoints
      are comment/string boundary confusion, Unicode escapes, exponent or integer
      narrowing, duplicate-key replacement ownership, sparse arrays, trailing-data
      policy, stack depth, allocation cleanup after exceptions, and strict/permissive
      discrepancies. Removing the settings prefix changes both the payload start and its
      remaining length; encoding-marker prescans are a distinct boundary before ordinary
      JSON tokenization.
  - id: project_knot_dns
    summary: "Knot DNS packet, dname, and zone-text carriers with cursor/state checkpoints."
    project_names: ["knot-dns"]
    content: |
      Target/carrier: Knot DNS exposes distinct raw DNS packet, wire dname, text dname,
      and zone-text scanners. fuzz_packet copies the complete DNS message into mutable
      storage, then knot_pkt_new -> knot_pkt_parse -> free. Wire-name conversion first
      requires knot_dname_wire_check; text conversion appends NUL. zscanner passes the
      full byte span with origin ".", class IN, then parses all zone records. Track
      network-order header counts, label lengths, compression-pointer offsets, section
      cursor, RR type/class/TTL, RDLENGTH bytes, EDNS option sizes, and scanner
      line/column, origin, owner inheritance, and multiline state. Recurring checkpoints
      are compression loops or forward pointers, name length near 255 bytes,
      count/cursor divergence, truncated RDATA with inner lengths, bitmap/window
      arithmetic, escaped decimal and quoted-text expansion, parentheses/comments
      across lines, $ORIGIN/$TTL state, and partial-rrset cleanup. Preserve wire form for
      packet/name targets and master-file grammar for zscanner; valid dname wire form is
      needed to reach formatting.
  - id: project_krb5
    summary: "MIT krb5 ASN.1, PAC, NDR, ccache, profile, and synthetic-KDC carriers."
    project_names: ["krb5"]
    content: |
      Target/carrier: select the exact MIT krb5 target. Bounded krb5_data feeds ASN.1
      ticket decoding, PAC parsing, NDR delegation decoding, credential/principal
      unmarshalling, change-password formatting, or profile parsing; newer JSON
      harnesses NUL-terminate text. The rdreq harness differs: input is a synthetic UDP
      KDC reply used while fixed config and ccache state build and consume an AP-REQ.
      Call chains reach krb5_decode_ticket, krb5_pac_parse, ndr_dec_delegation_info,
      k5_unmarshal_princ/cred across ccache versions, profile_parse_file, or
      krb5_get_credentials -> krb5_mk_req_extended -> krb5_rd_req. Track ASN.1/network
      lengths, ccache version/endian, principal counts, enctype/key lengths, PAC
      little-endian descriptors and 8-byte alignment, NDR counts/pointers, and
      context/auth/credential ownership. Recurring checkpoints are nested-length
      overflow, PAC offset overlap, NDR alignment, optional-field cleanup, invalid
      enctype geometry, partial decode ownership, profile nesting, and
      thread/socket teardown.
  - id: project_libcoap
    summary: "libcoap UDP PDU and URI carriers, option arithmetic, and parse/re-encode state."
    project_names: ["libcoap"]
    content: |
      Target/carrier: pdu_parse consumes one complete CoAP-over-UDP PDU; split_uri
      consumes one complete URI byte slice. The PDU path allocates capacity equal to
      input size, calls coap_pdu_parse(COAP_PROTO_UDP), and on success can derive query
      and URI paths, render the PDU, and re-encode its header. Verify that parse errors
      gate later access. Track the 4-byte base header fields (version, type, token length,
      code, message id), token bytes, option delta/length nibbles and extensions,
      cumulative option number, payload marker, payload length, and allocated versus
      used PDU size. URI parsing tracks scheme, host, port, path, and query as
      pointer/length views, not assumed C strings. Recurring checkpoints are token
      length above eight, option delta accumulation overflow, truncated extended option
      fields, repeated Uri-Path/Uri-Query joins, payload-marker-at-end handling,
      error-return gating, aliasing of derived views, block option arithmetic, and
      ownership on partial initialization. TCP CoAP framing is
      irrelevant unless the checked-in target changes protocol. Parse-failure location
      matters: an early base-header rejection may leave only harmless initialized
      defaults, while a later option failure can leave partially updated token, option,
      or URI state. Preserve a valid prefix and bind the failing parser phase to the
      first downstream accessor instead of treating every false return as equivalent.
  - id: project_libcups
    summary: "libcups IPP binary state machine, typed attributes, and round-trip ownership."
    project_names: ["libcups"]
    content: |
      Target/carrier: fuzzipp accepts a complete binary IPP message, rejects empty input
      and inputs above 262144 bytes, writes it to a temporary file, parses with repeated
      ippReadIO calls until leaving IPP_STATE_ATTRIBUTE, resets the parsed object to
      IDLE, then serializes it with repeated ippWriteIO calls. IPP begins with version,
      operation/status, and request-id fields, followed by group tags and attributes
      containing a value tag, 16-bit big-endian name length/name, 16-bit value
      length/value, then end-of-attributes and optional document bytes. Track parser
      state, group/value tags, collection nesting, language-tagged values,
      resolution/range/integer widths, buffer used/capacity, and ownership of
      repeated-name and collection values. Recurring checkpoints are value-type
      conversion failure, zero-name continuation handling, nested collection member
      state, length/cursor mismatch, unknown tag preservation, parse-then-write
      asymmetry, state reset after an error, short callback reads/writes, and partial
      object cleanup. A text printer description is not an IPP carrier.
  - id: project_libfdk_aac
    summary: "FDK AAC LOAS/LATM, config, and open carriers with decoder progress state."
    project_names: ["libfdk-aac"]
    content: |
      Target/carrier: three harness families differ. DecodeFrame passes the complete
      artifact as LOAS/LATM transport data to a one-layer decoder. It calls
      aacDecoder_Fill, advances by buffer_size-valid bytes, and calls
      aacDecoder_DecodeFrame into a fixed PCM buffer until AAC_DEC_NOT_ENOUGH_BITS.
      ConfigRaw accepts at most 255 bytes as one decoder configuration block. Open
      accepts exactly eight bytes: two little-endian 32-bit values interpreted as
      transport type and layer count. Track input bytes valid/consumed, AudioMuxElement
      lengths, AudioSpecificConfig bits, sample rate, frame length, channel config,
      SBR/PS state, output channels and PCM samples, and handle lifetime. Recurring
      checkpoints are bit-reservoir cursor drift, LATM subframe/payload lengths,
      mid-stream configuration failure leaving dependent extension state usable,
      channel/output geometry changes, sample-rate ratio arithmetic, fill/decode
      progress, not-enough-bits transitions, and close after partial initialization. Do
      not mix Open controls with compressed audio.

      SBR configuration is stateful across access units. Keep a parsed candidate header,
      the last successfully committed header, decoder synchronization, per-frame status,
      and extension payload consumption as separate state. A multi-frame route should
      show when a header becomes current and whether a later frame carries a replacement
      or relies on committed state; transport acceptance alone does not establish either
      transition.

      Error-resilient AAC profiles can enable Huffman Codeword Reordering through
      AudioSpecificConfig resilience fields. This is a distinct spectral-data path:
      section data establishes codebooks and codeword grouping, then the HCR decoder
      carries bitfield and per-codeword side state across codeword sets and iterative
      passes before spectral reconstruction. Treat configuration enablement, accepted
      section data, state initialization, re-entry, and spectral output as separate
      checkpoints; successful transport or SBR parsing does not prove HCR executed.
  - id: project_liblouis
    summary: "Liblouis table/text envelopes, widechar units, rule engine, and cache lifetime."
    project_names: ["liblouis"]
    content: |
      Target/carrier: table_fuzzer treats the artifact as Liblouis table source included
      by a stable empty table, compiles it, then clears global tables. Translation
      targets either use raw escaped text with an external table or split input: exactly
      the first 512 bytes become a temporary table and the remainder becomes
      NUL-terminated text expanded by _lou_extParseChars. Newer generic targets validate
      the table, call lou_translateString or lou_backTranslateString, then lou_free and
      unlink it. inlen and outlen are mutable widechar counts, not bytes; harnesses
      reserve up to 16x expansion. Call chain: table lexer/include resolver ->
      opcode/rule/class tables -> escape conversion -> forward/backward multi-pass
      matcher -> output. Recurring checkpoints are include/cache lifetime, opcode
      operand counts, rule/context length arithmetic, class indexes, pass-rule
      instruction cursors, widechar expansion, in/out length updates on failure,
      overlapping replacements, and stale compiled-table state. Keep table bytes and
      translation text in their correct regions.

      Treat a compiled table as a program. For multi-pass rules, separately prove grammar
      and compiler normalization, runtime dispatch, and the operand that reaches the
      security-sensitive operation. Close one minimal source text -> compiled rule ->
      executed-action checkpoint before repeated sanitizer builds; parser acceptance or
      sink reachability alone does not prove input control.
  - id: project_libpcap
    summary: "libpcap pcap/BPF combined envelopes, packet lengths, and optimizer state."
    project_names: ["libpcap"]
    content: |
      Target/carrier: fuzz_pcap consumes a complete classic pcap file. fuzz_filter uses
      bytes [0:size-1) as a NUL-terminated BPF expression and the final byte as link
      type. fuzz_both uses byte 0 as an unsigned filter-region size, the following
      region as the filter with its last byte replaced by NUL, and the remainder as
      pcap; it compiles against that file's datalink and filters every packet. Call
      chain: temporary file -> pcap_open_offline -> global-header decode -> pcap_next_ex
      loop; filter paths run pcap_open_dead/open_offline -> pcap_compile
      optimizer/codegen -> pcap_offline_filter/setfilter -> freecode/close. Track pcap
      magic/endian and timestamp mode, snaplen, link type, per-record caplen/origlen and
      timestamps, captured bytes, BPF instruction counts/jumps/memory slots, and
      envelope offsets. Recurring checkpoints are swapped lengths, caplen beyond data,
      linktype mismatch, BPF optimizer arithmetic, jump narrowing, offsets from short
      packets, compile-error cleanup, and combined-carrier off-by-one errors. RPCAP
      sources may exist but are not necessarily built. Link-layer adjustments and offline
      filtering operate on the captured-record span, not the original on-wire length; keep
      partially built optimizer and code-generation state explicit through teardown.
  - id: project_libssh2
    summary: "Model libssh2 client handshakes as a stateful SSH server byte stream."
    project_names: ["libssh2"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. The libssh2 client fuzzer sends the complete artifact through
      one end of a socket pair and runs libssh2_session_handshake on the other; bytes
      model an SSH server stream, not a private key, URL, or local command. Trace version
      exchange -> binary packet framing -> KEXINIT name-list negotiation -> key exchange
      and host-key parsing -> NEWKEYS/session state -> disconnect, session free, global
      exit, and fd close. Track identification-line termination, 32-bit network-order
      packet length, padding length, payload/MAC boundaries, algorithm name-list byte
      lengths, mpint sign/length, negotiated cipher/hash sizes, sequence numbers, and
      partial read state. Recurring failures cluster around packet-length subtraction,
      truncated padding or MAC, oversized name lists and mpints, key-exchange group
      arithmetic, state transitions after unsupported algorithms, blocking socket EOF,
      and cleanup when handshake stops between allocation and key activation. Later
      channel/SFTP paths require another target.

      KEXINIT name lists are bounded sequences used during algorithm negotiation. During
      ECDH exchange, the server reply carries host-key, ephemeral-key, and signature SSH
      strings in order, each with ordinary SSH string framing.
  - id: project_libultrahdr
    summary: "Separate Ultra HDR JPEG/R decode carriers from parameter-driven encoders."
    project_names: ["libultrahdr"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. libultrahdr has distinct decoder and encoder carriers. The
      decoder consumes an output-format control and treats remaining bytes as a complete
      JPEG/R Ultra HDR image; the encoder interprets bytes as API choice, dimensions,
      strides, gamut, transfer function, quality, and synthetic P010/YUV420 pixels. Do
      not feed encoder controls to the decoder. Decoder flow is getJPEGRInfo -> allocate
      width * height * bytes-per-pixel -> locate primary JPEG, gain map, ICC/Exif and
      metadata -> decodeJPEGR -> free gain-map/output state. Track dimensions in pixels,
      luma/chroma strides in samples, P010 16-bit storage of 10-bit values, 4:2:0 plane
      sizes, quality 0..100, output bytes per pixel, gain-map dimensions, gamma/offsets,
      content boost, and compressed length/capacity. Recurring failures involve size and
      stride products, JPEG marker lengths, gain-map/primary dimension mismatch,
      metadata float conversion, chroma tails, undersized destinations, and ownership
      of decoded gain-map memory.

      Gain-map metadata readers maintain a cursor inside a supplied span. Encoder
      raw-data APIs can use block-aligned geometry distinct from nominal image geometry.
      Keep metadata and padded-plane state separate.
  - id: project_libwebp
    summary: "Bind RIFF WebP, encoder, animation, and internal Huffman targets."
    project_names: ["libwebp"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. libwebp fuzzers separate complete RIFF WebP files, encoder
      pipelines, and a raw lossless-Huffman helper. Decode, mux/demux, incremental, and
      animation paths normally consume a full WebP artifact, while encoder fuzzers can
      also accept still images through imageio readers such as JPEG. Bind the binary and
      its input dispatcher first. Trace RIFF/WEBP and chunk scan -> VP8, VP8L, or VP8X feature parse ->
      optional ALPH/ICCP/EXIF/XMP/ANIM/ANMF handling -> frame decode, colorspace
      conversion, or mux iteration -> cleanup. Track little-endian RIFF/chunk sizes and
      even padding, canvas/frame dimensions in pixels, frame offsets and duration,
      blend/dispose flags, bit-reader position, Huffman group/count tables, row stride,
      crop/scale bounds, thread/incremental state, and caller buffer capacity in bytes.
      Recurring failures cluster around chunk offset-plus-size,
      width*height*channels overflow, lossless Huffman table construction,
      alpha/color-cache indices, animation canvas composition, incremental suspension,
      odd chroma extents, and freeing external versus decoder-owned buffers.

      The mux layer validates RIFF independently of the decoder. Still-image input can
      also introduce an image-library error-handling lifecycle before WebP encoding.
      Keep mux framing, decoder state, and source-image state distinct.
  - id: project_libzmq
    summary: "Separate libzmq endpoint, ZMTP, Z85, and socket-option carriers."
    project_names: ["libzmq"]
    content: |
      Verify these public landmarks in the checked-in version. libzmq exposes separate
      endpoint-string, ZMTP handshake, Z85, and socket-option fuzzers. Endpoints use a
      NUL-terminated URI;
      handshake targets feed a raw peer stream to NULL or CURVE state; Z85 truncates to
      five-character groups and emits four bytes per group. A socket-option target
      reuses the complete span across many zmq_setsockopt/getsockopt ids with no input
      selector.

      For ZMTP, trace greeting -> mechanism -> READY/ERROR or CURVE commands -> metadata
      -> message engine -> teardown. Track the greeting, frame and command lengths,
      mechanism state, and partial I/O. For options, track each int, int64, binary, or
      string contract, supplied length, getsockopt output capacity and returned size,
      socket state, and rejection behavior. Endpoint parsing tracks scheme, host/path
      and embedded NUL. Recurring failures include incomplete frames, metadata overrun,
      CURVE state, option width mismatch, output-size updates, endpoint lifetime, Z85
      arithmetic, and cleanup across fds, sockets, monitors, and context.

      Socket options, Z85 helpers, and ZMTP decoders use different string and buffer
      contracts. Keep explicit length, termination, logical capacity, and physical
      allocation as separate properties when tracing between them.
  - id: project_matio
    summary: "Preserve MAT version framing through directory, variable, and data reads."
    project_names: ["matio"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. The matio fuzzer materializes the complete artifact as a
      temporary MAT file, opens it, lists the directory, reads every variable's info and
      data, rewinds, reads again, then looks up names. The carrier is a coherent MAT v4,
      v5, or v7.3 file selected by its header, not a prefix. For MAT v5 trace the
      128-byte header/endian marker -> element tags -> miMATRIX flags, dimensions and
      name -> real/imaginary or sparse payload -> optional miCOMPRESSED zlib stream ->
      nested cell/struct objects. Track element type, byte count and 8-byte padding,
      small-element form, dimension product, rank, class, complex/logical flags, sparse
      index counts, compressed versus expanded bytes, and offsets. MAT v4 and
      HDF5-backed v7.3 have separate layouts. Recurring failures involve dimension/count
      multiplication, tag padding, compressed expansion, sparse indices, nested depth,
      duplicate or unterminated names, rewind state, and freeing partial variables or
      decompression buffers. In v7.3, field-name metadata can live in an HDF5 attribute;
      attribute dataspace shape and the resulting MAT field metadata are separate
      representation domains.
  - id: project_openssl
    summary: "Bind OpenSSL TLS, DER object, configuration, or bignum targets."
    project_names: ["openssl"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. OpenSSL builds independent fuzz binaries for TLS client/server
      handshakes, X.509/CRL/CMS/CT and generic ASN.1 DER, configuration text, and bignum
      operations. The executable fixes the carrier; never wrap DER as TLS or assume
      handshake bytes select an ASN.1 type. TLS paths feed peer bytes through BIOs into
      SSL_do_handshake with fixed local credentials and then free SSL/CTX/provider state.
      Track 5-byte record headers, network-order record length, handshake type and
      3-byte length, version, cipher/group/signature negotiation, extension vector
      lengths, transcript/sequence state, certificates, sessions, and fragmentation.
      DER paths track tag/class, short/long definite lengths, nesting, INTEGER sign, BIT
      STRING unused bits, OIDs, and full consumption. Recurring failures include nested
      length arithmetic, record/handshake mismatch, duplicate extensions, malformed key
      parameters, transitions around alerts or renegotiation, reference-count confusion,
      and cleanup of errors or partial objects.

      X.509 GeneralName OTHERName combines an object identifier with an independently
      tagged ASN.1 value, so identifier interpretation and value representation are
      separate domains. Session-ticket handling crosses decryption, object decoding,
      validation, and session ownership, including partial-failure states.
  - id: project_pcre2
    summary: "Model PCRE2's shared pattern/subject carrier and option passes."
    project_names: ["pcre2"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. The PCRE2 fuzz-support target treats the artifact as an 8-bit
      pattern and also uses the same bytes, capped for cost, as the subject. Compile and
      match options are derived deterministically from an input byte; the harness
      compiles with and without compile options, then matches with and without match
      options under low match, recursion, and callout limits. There is no pattern/subject
      delimiter. Trace escape/class parsing -> group and quantifier compilation -> start
      analysis and bytecode emission -> match-data/context setup -> interpreter or JIT
      match -> free. Track byte offsets versus code units, UTF/UCP modes, capture/name
      counts, quantifier bounds, backreferences, subroutine depth, lookarounds, callouts,
      ovector capacity, partial flags, and error offsets. Recurring failures involve
      quantifier overflow, malformed UTF tails, class/property tables, duplicate names,
      branch/link offsets, empty-repeat optimization, recursion cleanup, and assumptions
      that differ between option passes.

      Harness-side preprocessing is part of the input surface even before compilation.
      During matching, keep the caller-provided output-vector capacity independent from
      the pattern's capture count and the engine's internal capture-top state. Keep
      compile-time object geometry separate from runtime control-flow depth, calculate
      accesses against the actual allocation boundary, and confirm the compiled bytecode
      or a runtime trace rather than assuming syntactic nesting survives optimization.
  - id: project_readstat
    summary: "Bind each ReadStat dataset, grammar, or compression target independently."
    project_names: ["readstat"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. ReadStat uses format-specific full-file targets for SAV/ZSAV,
      POR, DTA, SAS7BDAT/SAS7BCAT, and XPORT, plus separate grammar and compression
      helpers. The binary chooses the carrier. Full-file fuzzers wrap the artifact in
      seekable memory I/O, install callbacks, invoke one parser, then free it. Trace
      header and byte-order detection -> page/record directory -> variable and label
      metadata -> row decompression and value conversion -> callbacks -> cleanup. Track
      row/column counts, variable width in bytes, file/page offsets, endian and word
      size, encoding, missing-value sentinels, string width, label-set indices,
      compressed/uncompressed row sizes, and observation index. Recurring failures
      include page/count multiplication, corrupt offset tables, RLE control-byte
      overruns, truncated variable records, encoding expansion, numeric conversion,
      callback objects borrowing parser buffers, and cleanup after a partial row or
      metadata table. Do not substitute raw compression input for a full dataset.

      SAS7BDAT subheader-pointer records are fixed-width and page-relative, with 32- and
      64-bit layouts. Metadata parsers separately maintain consumed and finalized length
      state.
  - id: project_skcms
    summary: "Trace ICC tag tables, curves, CLUTs, and transform-time access."
    project_names: ["skcms"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. skcms targets consume a complete ICC profile. One parses and
      queries tags/curve extents, one approximates a transfer function, and one
      transforms a fixed pixel block between known sRGB and the input profile. Trace
      128-byte ICC header -> big-endian tag count/table -> tag-specific XYZ,
      curve/parametric, matrix, A2B/B2A or CLUT parsing -> profile validation -> info,
      approximation, or transform. Track declared profile size, tag offset/length in
      bytes, color space and PCS, channel counts, curve entry count and 8/16-bit storage,
      fixed-point values, CLUT grid points per input channel, output channels, pixel
      format, and transform pixel count. Recurring failures cluster around tag
      offset-plus-size, overlapping tags, grid-size products, first/last curve access,
      invalid channel combinations, matrix and transfer-function NaN/Inf behavior,
      interpolation indices, and pointers retained into profile bytes. A valid profile
      must still reach the target's post-parse operation.
  - id: project_tinygltf
    summary: "Bind tinygltf ASCII JSON separately from GLB and external resources."
    project_names: ["tinygltf"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. The checked tinygltf fuzzer passes the artifact to
      LoadASCIIFromString with an empty base directory; it expects glTF JSON, not GLB,
      unless another target calls LoadBinaryFromMemory. Trace JSON parse -> Model arrays
      and index references -> buffers/data URIs -> bufferViews/accessors -> meshes,
      nodes, skins, animations, materials, images and extensions -> destruction. Track
      JSON number conversion, depth, buffer byteLength, bufferView byteOffset/byteLength
      and byteStride, accessor componentType/type/count and normalized flag, sparse
      index/value ranges, image dimensions/components, node/scene indices, and
      matrix/vector cardinality. An empty base directory does not by itself prove every
      external-resource callback is inert; embedded data still reaches decoders.
      Accessor references include both ordinary indices and sentinel states, while later
      buffer views use different index and size domains. Recurring failures involve offset + count*stride
      overflow, mismatched accessor element size, sparse indices, base64 expansion,
      cyclic nodes, invalid cross-array indices, huge image products, extension type
      confusion, and ownership across decoded images and model buffers.
  - id: project_unit
    summary: "Separate NGINX Unit HTTP field processing from JSON validation."
    project_names: ["unit"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. NGINX Unit has independent raw HTTP/1 request and JSON
      configuration targets. H1 binaries pass the request through
      nxt_http_parse_request, then process fields with a target-specific hash for
      ordinary, peer, or controller structures; JSON parses an explicit-length string
      into a configuration tree and validates it. No selector switches them. Trace
      request line -> header spans -> field handlers -> request/controller fields ->
      pool destruction, or JSON tokens -> nxt_conf tree -> validation -> pool cleanup.
      Track method/target/version lengths, CRLF boundaries, header spans, duplicate
      Content-Length/Transfer-Encoding and Host policy, ports/addresses, JSON depth,
      string escapes, integer ranges, and values borrowing pool storage. Recurring
      failures include pointer arithmetic at padded-buffer ends, delimiter-free headers,
      duplicate-field state, count/length allocation, deep JSON objects, validator type
      assumptions, and objects escaping the pool that owns their bytes.

      JSON validation can reach listener-address and template-string helpers before final
      semantic rejection. Keep bounded-format output, later string consumers, delimiter
      state, and cursor bounds explicit across those helper boundaries.
  - id: project_util_linux
    summary: "Separate util-linux disk-signature probing from mountinfo text parsing."
    project_names: ["util-linux"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. util-linux separates libblkid binary-image probing from
      libmount text parsing. blkid writes the artifact to a seekable file, enables
      partition/superblock probes, and runs safeprobe; libmount reads a bounded
      mountinfo-style stream with comments. blkid flows reads -> partition recognizers
      -> filesystem/RAID/swap signatures -> checksum/metadata extraction -> probe free.
      Track byte versus sector/block offsets, endian fields, magic location, block
      size/count, partition start/length, nested offsets, UUID/label lengths, and
      checksum coverage. Mountinfo tracks mount/parent ids, major:minor, root, mount
      point, options, optional fields, '-' separator, fs type/source/super options, and
      octal escapes. Recurring failures involve block-to-byte overflow, short secondary
      superblocks, overlapping signatures, recursive probing, token/unescape bounds,
      embedded NUL, list ownership, and fd/temp-file cleanup. Do not combine carriers.

      Filesystem probes dispatch from on-disk signatures into format-specific readers.
      Their byte-span arithmetic and decoded-identifier capacity are separate from the
      original fixed-width fields, especially when character encodings expand.
  - id: project_uwebsockets
    summary: "Bind uWebSockets HTTP, frame, extension, and compression state machines."
    project_names: ["uwebsockets"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. uWebSockets has separate raw HTTP parser/router, WebSocket
      frame, extension-offer, permessage-deflate, and handshake-key fuzzers. HTTP and
      WebSocket inputs may be padded and split into chunks for incremental state; bytes
      do not select a target. HTTP flows consumePostPadded -> request-line/header parsing
      -> route/body callbacks. WebSocket flows frame header -> extended length/mask ->
      fragments -> UTF-8 or close validation; compression keeps zlib state. Track
      padding contract, consumed bytes, CRLF/header spans, FIN/RSV/opcode/mask bits,
      7/16/64-bit payload length, remaining fragment bytes, context-takeover flags,
      output limit, and reset state. Recurring failures cluster around chunk-boundary
      carry, 64-bit-to-size_t conversion, mask alignment, fragmented UTF-8, close payload
      length, duplicate HTTP lengths, router parameter lifetime, extension tokens,
      decompression expansion, and static context contamination across iterations.

      A PROXY preface, when enabled, is a separate once-per-stream layer ahead of HTTP;
      track its consumed bytes independently from ordinary parser progress and fallback
      buffering. Compression state spans fragments and may use several output-storage
      regions, so preserve both per-fragment and cumulative output budgets.
  - id: project_wasmtime
    summary: "Bind raw-module compilation versus generated-config Wasmtime targets."
    project_names: ["wasmtime"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. Wasmtime fuzz binaries differ: compile may treat the artifact
      as raw Wasm and compile/serialize it twice for determinism, while instantiate,
      API-call, and differential targets decode bytes with Arbitrary into engine
      configuration plus a generated module. Bind the target first. Compile flow is
      validate -> translate to Cranelift IR -> optimize -> register allocation and
      machine code -> metadata/serialization. Runtime adds store/linker -> instantiate
      -> memories, tables, globals and exports -> calls/traps -> teardown; differential
      paths compare engines. Track feature flags, ISA, function/type indices, memory
      pages, table elements, offsets/alignments, fuel/epoch timeout, stack limits,
      pooling slots, GC refs, host handles, and serialized code ranges. Recurring
      failures involve config-feature interactions, bounds-check elimination,
      code/relocation metadata, stack maps, trap state, memory/table growth, async/fiber
      cleanup, pooling reuse, nondeterministic compilation, and NaN or trap divergence.

      Separate generator targets also accept structured Pulley bytecode or Cranelift IR
      rather than a WebAssembly module. Preserve each generator's register, type, and
      block predicates before treating emitted code as executable engine state.
  - id: project_wpantund
    summary: "Decode wpantund's selector, simulated event loop, HDLC, and Spinel state."
    project_names: ["wpantund"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. The wpantund harness consumes a leading ASCII selector: one
      branch parses configuration text and constructs MainLoop; another feeds an NCP
      stream through a socket pair while driving the event loop; a control branch may be
      unimplemented. In the NCP branch, harness escape commands can drain output or
      advance simulated time in deciseconds, so separate controls from HDLC payload.
      Trace settings/envelope -> MainLoop -> HDLC flag/escape and FCS -> Spinel
      header/IID/TID, packed command/property ids -> transaction state -> timers,
      sockets and teardown. Track escaped/unescaped length, varint continuation, CRC
      span, transaction id, property value type, response order, simulated milliseconds,
      and fd count. Recurring failures include dangling escapes, packed-integer overflow,
      truncated property payloads, response/state mismatch, timer arithmetic, repeated
      readiness loops, config key/value lifetime, and leaked or double-closed
      descriptors.

      Property callbacks can update prefix and address maps after typed Spinel decoding.
      Decode results, callback success state, and map key/value ownership remain distinct
      across insertion, replacement, and removal.
  - id: project_arduinojson
    summary: "Separate ArduinoJson JSON-text and MessagePack document carriers."
    project_names: ["arduinojson"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. ArduinoJson builds separate JSON-text and MessagePack fuzzers.
      Each gives the complete span and explicit size to a fresh DynamicJsonDocument with
      a fixed memory-pool capacity; only successful parses are serialized back through
      the matching format. There is no selector byte, and JSON text must not be
      substituted for the MessagePack target.

      Trace byte reader -> token or MessagePack marker -> scalar/container variant
      creation -> document memory pool -> matching serializer -> document destruction.
      Track explicit bytes versus terminators, nesting depth, array/map counts, string
      and binary lengths, integer width and sign, floating representation, duplicate
      keys, pool capacity and output growth. Recurrent checks include truncated escapes
      or multibyte markers, declared length beyond input, deep containers, count and
      pool arithmetic, numeric conversion boundaries, invalid UTF-8 policy, partial
      variant ownership, no-memory versus invalid-input errors, and
      serialize-after-parse assumptions.

      For JSON strings, separate raw UTF-8 input decoding from `\uXXXX` escape decoding.
      Escaped UTF-16 code units introduce pairing state before a Unicode scalar is
      emitted as UTF-8. Preserve quoted-string and document framing around this state.
  - id: project_bind9
    summary: "Bind BIND 9 DNS packet, name, RDATA, zone, and signature targets."
    project_names: ["bind9"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. BIND 9 has independent targets for complete DNS wire messages,
      names from wire or text, RDATA, master-file lexing/loading, QP structures and
      signature checking. A message target accepts up to one DNS datagram, parses in
      best-effort mode, renders text, re-renders wire sections with compression, parses
      again and releases the message. Signature targets add fixed TSIG/SIG(0) context.

      Trace 12-byte DNS header -> compressed names -> question/RR sections ->
      type-specific RDATA and EDNS/TSIG -> text or wire rendering -> message detach.
      Track network-order counts and RDLENGTH, label length and compression-pointer
      offsets, section ownership, TTL, bitmap/count units, render-buffer capacity,
      name-compression state, key and signature lengths. Recurrent checks include
      pointer loops, offset-plus-length overflow, truncated RDATA, header count
      disagreement, malformed NSEC-style bitmaps, renderer expansion,
      parse/render asymmetry, signature state, and cleanup after partially attached
      names or rdatasets.

      Signature verification can perform ordinary view and zone-table name lookup after
      message parsing. Preserve the signed message, lookup context, queried DNS name, and
      name-table traversal state as separate parts of that route.
  - id: project_coturn
    summary: "Trace coturn STUN/TURN framing, authentication, and response state."
    project_names: ["coturn"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. coturn's STUN targets pass one bounded complete packet either
      to full command-message and MESSAGE-INTEGRITY checking or through client-side
      response classification. The carrier is a STUN/TURN message, not a raw attribute;
      credentials and hash choice can be fixed by the harness.

      Trace 20-byte STUN header -> method/class decoding -> aligned attribute loop ->
      address, nonce, realm or channel fields -> integrity/fingerprint verification ->
      response classification and cleanup. Track network-order message length in bytes,
      32-bit magic cookie, 96-bit transaction id, attribute type/length, four-byte
      padding, XOR address family/port, username/realm lengths, HMAC coverage and
      fingerprint position. Recurrent checks include length not divisible by four,
      attribute padding past end, duplicate authentication fields, short address values,
      channel/data length disagreement, integrity span errors, old/new attribute
      variants and state-inappropriate TURN requests.
  - id: project_cryptofuzz
    summary: "Bind Cryptofuzz datasource operations and cross-module comparisons."
    project_names: ["cryptofuzz"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. Cryptofuzz consumes an internal binary datasource, not raw
      cryptographic objects. In the public x86 driver, every Datasource value has a
      little-endian 32-bit length prefix, including fixed-width scalars. The outer
      stream frames a 64-bit operation id and a separately framed operation payload,
      followed by framed modifier bytes, a framed 64-bit module id, and a framed
      continuation byte for each execution. Operation and module ids are FNV-1a
      hashes of namespaced public names. The operation payload starts a fresh
      datasource and follows its constructor's versioned component order; decimal
      bignums and buffers are nested frames. Build options fix enabled operations,
      modules, curves, digests and the oracle. A carrier must match the selected
      executor and compiled module set.

      Trace datasource cursor -> operation dispatch -> component decoding -> module
      invocation -> result normalization -> cross-module comparison -> cleanup. Track
      cursor, presence and vector lengths, big-integer sign and representation, curve
      and algorithm ids, message/key/nonce/tag lengths, modifier stream, optional
      results and ownership across modules. Recurrent checks include datasource
      exhaustion, count-length disagreement, noncanonical integers and points, invalid
      curve membership, zero/infinite values, input/output aliasing, exceptional module
      exits, representation mismatch and comparison of results produced under different
      preconditions.
  - id: project_duckdb
    summary: "Trace DuckDB SQL through binding, optimization, vector execution, and cleanup."
    project_names: ["duckdb"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. The DuckDB parse fuzzer treats the complete artifact as an
      explicit-length SQL string, creates a fresh in-memory database and connection,
      enables verification, and executes it. The carrier is SQL source, not a database
      file. Parse acceptance is only the first gate because binding, optimization,
      vectorized execution and verification may run.

      Trace lexer/parser -> statements and expressions -> catalog binding and logical
      plan -> optimizer and statistics -> physical operators -> vectors, result and
      teardown. Track byte spans, identifier/string lengths, parameter and column
      indexes, logical types, numeric conversions, cardinality estimates, vector counts
      and validity masks, row/column products and ownership of expressions, chunks and
      catalog objects. Recurrent checks include deep expressions, invalid casts,
      constant-fold overflow, correlated scope, aggregate/window cardinality,
      join/index selection, vector-size disagreement, exception unwinding and stale
      references after plan rewrites.
  - id: project_espeak_ng
    summary: "Trace eSpeak NG SSML text through phonemes, synthesis, and callbacks."
    project_names: ["espeak-ng"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. The eSpeak NG SSML target copies the complete span, appends
      NUL, and calls synchronous espeak_Synth with UTF-8, phoneme-event and SSML flags.
      The API length includes the terminator and positions are characters; a callback
      receives samples and events. The carrier is SSML-capable text, not PCM audio or a
      voice file.

      Trace UTF-8 and SSML tokenization -> normalization -> language/voice rules ->
      phoneme generation -> prosody and duration -> synthesis frames and events ->
      callback. Track bytes versus character positions, tag nesting, entity and
      attribute lengths, phoneme mnemonics, rate/pitch/range values, sample counts,
      event positions and persistent global state. Recurrent checks include malformed
      UTF-8, unterminated tags/entities, nested voice/prosody transitions, numeric
      extremes, normalization expansion, phoneme-buffer growth, event offsets after
      markup removal, callback lifetime and state retained across inputs.
  - id: project_flatbuffers
    summary: "Separate FlatBuffers binary, FlexBuffers, text, and annotator targets."
    project_names: ["flatbuffers"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. FlatBuffers has separate schema-specific binary verifier,
      FlexBuffers, IDL/JSON parser, and binary-annotator targets. A verifier passes the
      complete artifact against a compiled root type. Parser targets may reserve
      leading option bytes and use text only through the first NUL. An annotator instead
      loads a fixed BFBS schema before walking binary data. Do not mix carriers.

      For binary data trace root offset -> table/vtable -> scalar, string, vector, union
      and nested-table access -> verifier limits. Track little-endian offsets, signed
      relative offsets, object/vtable sizes, alignment, vector counts, terminators,
      union tag/value agreement, recursion and table counts. For parser paths track
      option bits, token spans and schema ownership. Recurrent checks include offset
      wrap, vector-size products, invalid vtable backreferences, deep graphs, union
      mismatch, truncated strings, parser/serializer asymmetry and stale builder/schema
      state across runs.
  - id: project_fmt
    summary: "Decode fmt type controls separately from explicit-length format text."
    project_names: ["fmt"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. fmt fuzzers use target-specific binary envelopes. One- and
      two-argument targets consume selector bits for native types, reserve fixed-size
      slots containing argument bit patterns, and treat remaining explicit-length bytes
      as the format string. Chrono targets add representation and ratio selectors;
      named-argument and sprintf targets differ. The artifact is not just format text.

      Trace controls -> native value reconstruction -> format parser -> argument
      indexing/spec validation -> integer, float or chrono formatter -> buffer growth.
      Track selector range, native width and endianness, explicit string length, braces,
      positional/named indexes, width/precision, fill/alignment, locale and chrono units,
      output capacity and exceptions. Recurrent checks include unmatched braces,
      dynamic width mismatch, extreme precision, integer/exponent boundaries,
      long-double representations, duration scaling, Unicode fill width, reallocation
      and cleanup after an exception.

      Numeric formatting couples rounding state, significant digits, exponent spelling,
      and destination capacity. Treat the post-rounding representation as a new layout
      boundary.
  - id: project_fribidi
    summary: "Preserve FriBidi native code-unit and parallel-array invariants."
    project_names: ["fribidi"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. The FriBidi fuzzer interprets the complete artifact as native
      FriBidiChar units: logical length is byte_size / 4 and trailing bytes are ignored.
      It does not decode UTF-8. The same array flows through bidi-type classification,
      paired-bracket classification, and paragraph embedding-level resolution with an
      initially neutral paragraph direction.

      Trace 32-bit code units -> Unicode bidi classes -> bracket types -> isolating-run
      and paragraph analysis -> per-character embedding levels. Track bytes versus code
      units, alignment and byte order, scalar range, formatting and isolate controls,
      bracket pairing, base direction, level width, and parallel array ownership.
      Recurring checks include empty input, incomplete final units, surrogate or
      out-of-range values, deep isolate/override nesting, unmatched brackets, run-stack
      limits, index conversion, allocation products, and consistency among character,
      type, bracket, and level arrays.
  - id: project_gdbm
    summary: "Trace GDBM database images through recovery, rewrite, and cleanup."
    project_names: ["gdbm"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. The GDBM fuzzer writes the complete artifact to a seekable
      memory file and runs a fixed gdbmtool script against that database; the artifact
      is a database image, not shell commands. The script inspects header, directory,
      buckets, cache, count and iteration state, attempts recovery, reorganization and
      format conversion, performs fetch/store/delete, then closes.

      Trace file header -> block and directory geometry -> hash buckets and elements ->
      key/value records and available-block lists -> cache or recovery state -> rewritten
      database -> close. Track file offsets and block size in bytes, directory
      depth/count, bucket index, hash, key/value lengths, avail counts, endian/version
      fields, dirty flags, and descriptor ownership. Recurring checks include
      offset-plus-size overflow, blocks beyond EOF, cyclic or duplicate free blocks,
      directory-count shifts, record-length products, short reads, partial cache entries,
      recovery aliasing, and stale state after a failed rewrite.
  - id: project_gnupg
    summary: "Bind GnuPG OpenPGP list, import, verify, and decrypt actions."
    project_names: ["gnupg"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. GnuPG targets materialize the complete artifact as an OpenPGP
      file under an initialized homedir and fixed key/trust databases. Separate
      executables list packets, import keys, verify signatures, or decrypt; list mode may
      auto-detect ASCII armor, while import can impose a size cap. Do not substitute
      command text for the packet stream.

      Trace armor filter if selected -> old/new packet header and body length -> packet
      dispatcher -> key, signature, compressed, encrypted, literal, or user-id object ->
      target action -> IOBUF, keydb, control and crypto cleanup. Track partial-body
      lengths, MPI bit/byte counts, algorithm ids, signature subpacket areas,
      compression nesting, session-key and S2K parameters, key relations, trust state,
      and cursor. Recurring checks include length accumulation, truncated MPIs, nested
      decompression, malformed armor, subpacket overruns, duplicate-key merge state,
      error-stack reuse, output state, and ownership across repeated control resets.
  - id: project_gnutls
    summary: "Separate GnuTLS DER objects from stateful TLS peer byte streams."
    project_names: ["gnutls"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. GnuTLS separates raw DER and transport targets. X.509,
      private-key, PKCS#7, PKCS#8, PKCS#12, OCSP, DN and OpenPGP parsers receive one
      explicit-length datum and may unpack it after import. TLS client or server targets
      send the complete artifact through a socket pair, shut down writing, construct
      fixed credentials and priorities, drive the handshake until success or fatal
      error, then drain records.

      Trace DER tag/length -> nested object -> algorithm/key fields -> print or
      simple-parse, or TLS record -> handshake/extensions/certificates -> session
      transition -> record receive -> deinit. Track datum length, ASN.1 lengths, integer
      sign, OID parameters, list counts, record and handshake byte lengths, protocol
      state, credentials, and allocations. Recurring checks include nested-length
      overflow, malformed key parameters, excessive counts, truncated vectors,
      noncanonical integers, out-of-order handshakes, EOF/retry handling, and cleanup of
      partial chains, keys, records, and sessions.
  - id: project_hiredis
    summary: "Bind hiredis printf-style command formatting separately from RESP."
    project_names: ["hiredis"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. The hiredis command-format target copies the complete
      artifact, appends NUL, and passes it as the printf-like format string to
      redisFormatCommand. Embedded NUL terminates the effective format early. This is
      not a raw RESP request or server reply; parser targets use different carriers.

      Trace format scan -> literal or percent conversion -> argument sizing -> RESP
      array and bulk-string length calculation -> command allocation and fill ->
      hi_free. Track original span versus C-string length, format cursor, conversion
      type, decimal width, signed and size_t values, `%b` pointer/length pairing when a
      real caller supplies arguments, digit counts, aggregate byte size, and error
      ownership. Recurring checks include trailing or unsupported `%`, repeated escapes,
      integer-length arithmetic, negative-to-unsigned conversion, allocation overflow,
      mismatch between sizing and write passes, embedded NUL behavior, and freeing
      partial output. The checked-in command-format fuzzer calls redisFormatCommand with
      the artifact as its only format argument; it supplies no variadic conversion
      arguments. Consequently `%s`, `%b`, and numeric conversions that fetch arguments
      have undefined caller behavior in that target and do not provide evidence about a
      formatter failure path. Keep malformed or argument-free format behavior separate
      from tests performed by a real caller that supplies the matching arguments.
  - id: project_hoextdown
    summary: "Trace Hoextdown Markdown extensions through HTML renderer callbacks."
    project_names: ["hoextdown"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. The Hoextdown harness copies the complete artifact into a
      Hoedown buffer and renders Markdown to HTML with a fixed broad extension set,
      HTML escaping/skipping, hard wrapping, XHTML and task-list behavior, a fixed
      nesting limit, and separate output and metadata buffers. No selector or terminator
      is added.

      Trace block scan -> extension-specific block parser -> inline span parser ->
      renderer callbacks -> HTML and metadata buffers -> cleanup. Track byte offsets,
      line endings and indentation, delimiter runs, bracket/link destinations,
      fenced-code markers, table columns, list depth, nesting budget, output growth
      units, attribute/meta ownership, and source versus rendered lengths. Recurring
      checks include unterminated delimiters, empty-line boundaries, deep
      blockquote/list nesting, malformed tables, overlapping emphasis, link and autolink
      scans, entity/escape tails, output growth, renderer-state transitions, and cleanup
      after partial callbacks.

      Nested list, definition-list, and footnote contexts can re-enter fenced-code
      detection after advancing a shared cursor. Model each nested helper with its own
      remaining-span state.
  - id: project_hostap
    summary: "Separate Hostap management, EAPOL, TLS, P2P, and direct-span targets."
    project_names: ["hostap"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. Hostap fuzzers bind independent carriers: AP management input
      is repeated big-endian 16-bit length plus 802.11 frames; EAPOL-Key and TLS state
      machines consume repeated big-endian length-prefixed messages; P2P/WNM paths take
      information elements or management/action frames; JSON, ASN.1 DER and X.509
      targets take one direct span. The harness prebuilds protocol state; add no selector.

      Trace envelope -> link/protocol header or TLV dispatch -> authentication,
      association, key, roaming or certificate state -> callbacks/timeouts -> deinit.
      Track frame control and address roles, category/action, IE id and one-byte length,
      EAPOL version/type/body length, replay counter and key-data length, transcript
      lengths, endian, station state, and wpabuf ownership. Recurring checks include
      truncated frames/TLVs, nested length disagreement, replay/state transitions,
      fragmented transcripts, duplicate IEs, callbacks after teardown, and cleanup of
      partial peers or crypto objects.
  - id: project_irssi
    summary: "Bind Irssi display, IRC transcript, event-parameter, and theme carriers."
    project_names: ["irssi"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. Irssi separates NUL-terminated display text, IRC server
      transcripts, event-parameter strings, and theme files. The server harness uses a
      leading boolean to control a synthetic prefix, splits remaining text on CRLF,
      appends newline, and feeds a server through `server incoming`. The parameter target
      uses the first byte modulo eight to choose one to four outputs and GETREST
      behavior. Theme input stops at the first NUL before file write.

      Trace text -> IRC prefix/command/parameters or formatting/theme lexer ->
      signal/event dispatch -> channel/server/UI state -> cleanup. Track byte versus
      C-string length, CRLF, colon trailing parameters, requested output count,
      nick/user/host spans, format escapes, theme nesting, signal ownership, and server
      state. Recurring checks include empty lines, missing parameters, prefix ambiguity,
      embedded NUL, excessive arguments, recursive formats, invalid UTF-8, list/hash
      mutation during signals, and aliases retained across disconnect or theme
      destruction.

      IRCv3 message tags form an optional `@` prefix before the command. Their
      semicolon-delimited elements and tag-value escapes are parsed before ordinary IRC
      command dispatch. Keep element and transcript spans separate.
  - id: project_jbig2dec
    summary: "Trace JBIG2 segment graphs, page composition, and bounded allocation."
    project_names: ["jbig2dec"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. The jbig2dec target passes the complete artifact to a fresh
      Jbig2Ctx with a bounded allocator, requests page completion, obtains a decoded
      page if available, reads height times stride bytes, releases the page, and frees
      the context. The carrier is a JBIG2 file or segment stream, not a PDF container.

      Trace file header if present -> segment header, number, flags, referred-segment
      list, page association and data length -> symbol/text/halftone/generic/refinement
      decoder -> page composition -> image release. Track offsets, 32-bit segment
      lengths, referred counts and retention flags, page dimensions, region coordinates,
      bitmap stride, symbol counts, arithmetic/MMR state, allocation total, and segment
      ownership. Recurring checks include extended referred counts, unknown-length
      segments, offset-plus-length overflow, dependency cycles, symbol-index bounds,
      bitmap products, negative composition coordinates, arithmetic exhaustion, page
      replacement, and cleanup after partial dictionaries or images.

      Halftone gray-scale data can enter the MMR decoder. Word lookahead, logical
      consumed-bit position, reported byte consumption, and the enclosing segment span
      are different state values.
  - id: project_json_c
    summary: "Trace json-c explicit-length tokenization and reference-count cleanup."
    project_names: ["json-c"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. The common json-c tokener target passes the complete byte span
      and explicit size to json_tokener_parse_ex with a fresh tokener, then releases
      both the returned object and parser. The carrier is JSON text, but explicit length
      means embedded NUL and incomplete-token behavior must be checked instead of
      assuming C-string semantics. Other targets may bind a different parser or
      serializer.

      Trace tokener state -> strings, numbers, arrays and objects -> json_object graph ->
      reference-counted destruction. Track input offset, nesting depth, UTF-8 and escape
      state, numeric conversion range, object/array growth, duplicate keys, parser error
      and continuation state, and ownership when parse returns a partial object.
      Recurrent checks include truncated escapes or exponents, deep nesting, length and
      capacity arithmetic, invalid surrogate handling, hash-table resize, parse-end
      disagreement, and json_object_put on partially constructed or aliased values.
  - id: project_libass
    summary: "Drive libass subtitle parsing through shaping, rendering, and caches."
    project_names: ["libass"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. The common libass target treats the complete artifact as an
      ASS/SSA subtitle script, loads it with ass_read_memory, and renders the midpoint
      of every parsed event on a fixed-size frame using a persistent library and
      renderer. A dialogue fragment that does not create a track and event cannot reach
      shaping or rasterization.

      Trace script sections -> styles and events -> override-tag parser -> font
      selection and shaping -> glyph outline, bitmap and composite cache ->
      ass_render_frame -> track destruction. Track byte lengths, event Start and
      Duration in milliseconds, layer and margin fields, style indexes, font size and
      scale, Unicode code points, glyph advances, clipping geometry, bitmap stride and
      cache ownership. Recurrent checks include malformed comma fields, nested override
      tags, extreme transforms and clips, signed time arithmetic, bidi and shaping
      clusters, outline-to-bitmap dimension products, cache key lifetime, and cleanup of
      partially parsed styles, events, fonts or images.

      Override tags can update font selection and build font or glyph cache keys from
      explicit pointer/length slices into event text. Preserve zero-length and
      non-terminated slice semantics through cache-key consumers.
  - id: project_libavif
    summary: "Trace AVIF containers through frames, color conversion, and reset."
    project_names: ["libavif"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. The decode target binds the complete artifact as an AVIF/HEIF
      memory stream, parses it once, drains every image, resets the decoder, and repeats.
      For each image it allocates several RGB/RGBA outputs at selected bit depths and
      chroma upsampling modes, converts YUV to RGB and sometimes back to YUV, then frees
      all pixels and images. A bare AV1 OBU is not equivalent to the container target.

      Trace ISO BMFF boxes -> item properties, extents and grids -> AV1 decoder -> image
      planes -> color conversion -> decoder reset and destruction. Track box and extent
      offsets in bytes, item references, width/height, depth, YUV format and range,
      chroma subsampling, rowBytes, plane sizes, alpha, transforms and color metadata.
      Recurrent checks include nested box length overflow, invalid item graphs, grid
      geometry products, truncated codec payloads, stride and plane allocation
      arithmetic, odd chroma dimensions, conversion aliasing,
      reset-after-partial-decode state, and cleanup across failed frames.

      File-level `ftyp`, `meta`, and `moov` boxes can be singleton parser state whose
      parsed fields reference owned box storage. Track duplicate-box, payload ownership,
      parse-error, and cleanup state together.
  - id: project_libgd
    summary: "Separate libgd drawing-control envelopes from image decoders."
    project_names: ["libgd"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. libgd has format decoders and drawing fuzzers with different
      carriers. A text-rendering target consumes harness controls for an 8-bit canvas
      width and height, native integer x/y position and color, and a built-in font
      choice; the remaining bytes are passed to gdImageString. Do not wrap that envelope
      in an image file.

      Trace control extraction -> true-color image allocation -> font and glyph lookup
      -> clipped pixel writes -> image destruction. Track pixels versus bytes, signed
      coordinates, canvas dimensions, font glyph width/height, character byte values,
      color representation, row storage and allocation products. Decoder targets
      instead require coherent headers, dimensions, palettes and compressed data.
      Recurrent checks include negative or far-edge coordinates, width-height products,
      glyph offset and clipping arithmetic, signed character indexing, zero-size images,
      palette versus true-color confusion, truncated raster data, and cleanup after
      partial allocation.

      In indexed-color decoders, optional transparency introduces a presence state in
      addition to palette and alpha-table indexes. Preserve the distinction through
      shared post-parse color handling.
  - id: project_libidn2
    summary: "Bind libidn2 UTF-8 and native-codepoint IDNA conversions."
    project_names: ["libidn2"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. The libidn2 conversion target copies the complete span,
      appends NUL, and calls the 8-bit IDNA-to-ASCII APIs under several NFC,
      transitional, nontransitional and STD3 flag combinations. When the byte count is
      divisible by four it also interprets the same bytes as native uint32_t code points
      for the 4i/4z APIs. Bind the API family; this is a domain-name conversion carrier,
      not DNS wire format.

      Trace UTF-8 or code-point decoding -> UTS #46 mapping and normalization -> label
      validation -> Punycode -> allocated ASCII result -> idn2_free. Track bytes versus
      Unicode scalars, native 32-bit units, label and whole-domain lengths,
      dot-equivalent separators, combining state, bidi/context rules, flag-dependent
      mappings and result ownership. Recurrent checks include truncated UTF-8, invalid
      scalar values, normalization expansion, transitional mapping changes, empty or
      oversized labels, Punycode digit and bias arithmetic, embedded NUL, unaligned
      32-bit input, and cleanup after a later label fails.

      The IDNA label limit applies to the encoded ASCII/Punycode form rather than source
      code-point count. Keep source scalars, mapped UTF-8 bytes, and final per-label ASCII
      length separate.
  - id: project_libspng
    summary: "Force libspng PNG parsing through full transformed RGBA decode."
    project_names: ["libspng"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. The libspng read target binds the complete artifact as one PNG
      buffer, configures image and chunk limits plus CRC handling, asks for decoded RGBA8
      size, allocates exactly that many bytes under an outer cap, and performs a full
      decode with transparency, gamma and significant-bit transforms enabled. A valid
      signature or header-only parse does not reach row filters and conversion.

      Trace PNG signature -> length/type/data/CRC chunks -> IHDR, palette and
      transparency -> IDAT inflate -> scanline filters and Adam7 passes -> transform to
      RGBA8 -> context and output cleanup. Track big-endian chunk lengths, width/height,
      bit depth, color type, source and output channels, bytes per row, pass geometry,
      compressed versus decoded sizes and chunk limits. Recurrent checks include chunk
      range overflow, duplicate or misordered metadata, palette bounds, prior-row
      access, interlace rounding, deflate expansion, transform-size disagreement, CRC
      rejection paths, and freeing context or output after partial decode.
  - id: project_libssh
    summary: "Model libssh server handshakes as ordered SSH client byte streams."
    project_names: ["libssh"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. The server fuzzer writes the complete artifact to one side of
      a socketpair, shuts down writing, configures a fixed server key, accepts the other
      fd into an ssh_session, performs server-side key exchange, then drains ssh_message
      objects until input ends. The carrier is an ordered SSH byte stream, not a
      standalone key or packet payload.

      Trace identification exchange -> binary packet framing -> algorithm negotiation
      and key exchange -> encryption/MAC activation -> service, authentication or
      channel messages -> disconnect and cleanup. Track packet_length and padding_length
      in network order, sequence numbers, negotiated algorithms, string and name-list
      lengths, mpint sign/width, channel and window sizes, EOF and ownership of messages,
      buffers and keys. Recurrent checks include length-plus-padding arithmetic,
      truncated name lists, state-inappropriate messages, rekey transitions, compression
      or MAC boundaries, mpint normalization, channel-window updates, and cleanup after
      partial negotiation.

      Buffer pack/unpack helpers have a format and native-call contract separate from
      packet length. A user-auth request carries user, service, and method strings before
      method-specific fields, creating another dispatch boundary.
  - id: project_libwebsockets
    summary: "Separate libwebsockets compression, HTTP, WebSocket, and utility carriers."
    project_names: ["libwebsockets"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. libwebsockets has protocol, HTTP and utility fuzzers with
      distinct envelopes. One UPNG inflator target uses FuzzedDataProvider: provider
      controls select an operation and a variable-length string is fed to
      lws_upng_inflate_data after inflator creation; the target then destroys the
      context. The artifact is not necessarily a raw PNG, gzip file or WebSocket frame
      from byte zero.

      For that path trace provider slicing -> inflator creation and output-ring setup ->
      compressed-data parsing -> ring exposure -> destruction. Track compressed bytes
      consumed, output-ring length and write position, Huffman state, checksums,
      expansion limits and pointer ownership. For HTTP or WebSocket targets separately
      track header lengths, frame FIN/opcode/mask, 7/16/64-bit payload lengths and
      connection state. Recurrent checks include truncated codes, output growth, ring
      wrap, stale output pointers, fragmented frames, signed length conversion and
      cleanup after partial inflate or protocol teardown.

      Dynamic DEFLATE blocks build canonical trees from header-derived code-length,
      literal/length, and distance alphabets. Keep symbol counts, bit lengths, and scratch
      capacities distinct for each alphabet.
  - id: project_lldpd
    summary: "Replay link-layer frames across lldpd discovery-protocol decoders."
    project_names: ["lldpd"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. The decode target accepts one complete link-layer frame within
      Ethernet-sized limits and submits the same bytes sequentially to LLDP, CDP, SONMP
      and EDP decoders using a minimal hardware object with a fixed MTU. There is no
      selector byte; each decoder recognizes its own framing, and returned chassis or
      port objects affect ownership reasoning.

      Trace Ethernet/VLAN framing -> protocol discriminator -> protocol header -> TLV
      loop -> chassis and port construction. Track network-byte-order lengths, TLV
      type/length units, four-byte words where applicable, organizational subtype,
      address-family and address length, string lengths, TTL units, VLAN offsets,
      checksum coverage and packet size versus MTU. Recurrent checks include zero or
      undersized TLVs, padding past end, count-times-entry-size overflow, nested
      management-address lengths, duplicate mandatory fields, cross-decoder stale
      output, partial object attachment and freeing lists or shared chassis data after
      rejection.

      For an inner list of variable-length records, keep its record count separate from
      the enclosing TLV's remaining byte budget. Both govern traversal of the list.
  - id: project_md4c
    summary: "Decode MD4C native flag controls before Markdown-to-HTML rendering."
    project_names: ["md4c"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. One MD4C HTML harness reserves two native unsigned control words
      for parser and renderer flags, then passes the remaining explicit-length Markdown
      span to md_html; those controls are harness metadata, not
      Markdown.
      Other HTML harnesses can pass the complete byte span directly, so bind the target
      before choosing a carrier. The rendering callback may simply discard output.

      Trace flag decoding -> block parser -> inline delimiter and entity parsing -> HTML
      renderer callbacks -> cleanup. Track bytes versus text positions, line boundaries,
      indentation, delimiter runs, nesting depth, table column counts, URL/title spans,
      entity lengths, parser extensions, renderer escaping modes and scratch-size
      multiplication. Recurrent checks include unterminated code or HTML blocks,
      emphasis-stack transitions, link/image nesting, backslash and entity tails, table
      alignment disagreement, embedded NUL with explicit length, extreme nesting,
      output expansion, unaligned native control reads, and cleanup when block and
      inline states fail at different phases.

      Container-prefix scanners for block quotes, lists, and task markers share an
      explicit-length line span. Keep line, container, and document cursor state
      separate; embedded NUL is still part of the input span.
  - id: project_mongoose
    summary: "Separate Mongoose direct parser spans from simulated network drivers."
    project_names: ["mongoose"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. Mongoose exposes direct parser and network-driver targets. A
      direct target reuses the complete span independently as DNS, HTTP, URL/form, MQTT,
      SNTP, Base64, glob, comma-list, JSON and mock-IP input; success in one says nothing
      about another. A network-driver HTTP target instead delivers bytes through a
      simulated listener and event loop before serving files. Bind the executable and
      carrier first.

      Trace direct span -> selected parser -> borrowed field views, or driver
      packet/stream -> connection state -> HTTP event -> handler -> manager cleanup.
      Track protocol-specific network lengths, HTTP header/body boundaries, MQTT
      Remaining Length, DNS counts and compressed names, URL decode capacity, JSON path
      offsets, packet caplen, event ordering and mg_str ownership. Recurrent checks
      include truncation, parser reuse after failure, percent/base64 tails, nested
      variable lengths, fragmented traffic, stale borrowed slices, buffer-growth
      arithmetic, and teardown of partial connections. The MIP driver has another carrier:
      a complete Ethernet frame with nested IPv4 and ICMP length domains. Mongoose keeps
      both split protocol sources and an amalgamated source, so verify the same module edge
      in both representations when they coexist.
  - id: project_nginx
    summary: "Model Nginx request and upstream-reply streams under harness events."
    project_names: ["nginx"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. The public HTTP request fuzzer is protobuf-mutator based: its
      logical carrier is a proto2 HttpProto with required `request = 1` and `reply = 2`
      string fields (the latter is the upstream-reply stream), not one raw HTTP
      transcript. The official `DEFINE_PROTO_FUZZER` target consumes proto2 wire
      serialization. A separately built standalone diagnostic may choose text format,
      but that is a different wrapper and does not change the official carrier. The
      official harness exposes each field through C-string length, so an embedded NUL
      truncates that stream. It initializes fixed Nginx configuration and fake
      event/connection state, feeds `request` through the client recv callback, makes
      `reply` available only after the proxy/upstream path installs its recv callback,
      and then drives finalization. Verify the build because other targets differ.

      Trace protobuf decoding -> request line, headers and body -> location/upstream
      selection -> proxy request -> upstream status, headers and body -> filters and
      pool cleanup. Track both string lengths, parser positions, Content-Length versus
      chunked framing, header list sizes, URI normalization, upstream state,
      chain-buffer flags, event readiness and pool ownership. Recurrent checks include
      split-line transitions, conflicting lengths, chunk-size overflow, request/reply
      state confusion, filter expansion, stale cleanup links and double finalization
      after upstream error.

      Keep this HTTP/1 request/upstream route separate from HTTP/2 frame-state parsing.
      HTTP/2 frame types have stream-scoped or connection-scoped identifier semantics in
      addition to their payload layouts.
  - id: project_opencv
    summary: "Bind OpenCV image, FileStorage, encoding, and graph target carriers."
    project_names: ["opencv"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. OpenCV has independent fuzzers for compressed images,
      file-based imread, FileStorage JSON/XML/YAML, image encoding, TensorFlow graphs and
      higher-level modules. The imdecode target wraps the complete artifact in a one-row
      CV_8UC1 Mat and calls cv::imdecode unchanged; FileStorage string targets instead
      sniff explicit-length text. Do not transfer envelopes between executables.

      For images trace signature -> decoder -> dimensions, channels and depth ->
      row/plane allocation -> codec decode -> cv::Mat release. Track rows, columns, step
      in bytes, element size, channels, signed geometry, palette/subsampling, compressed
      versus decoded sizes and Mat ownership. For FileStorage track tokens, nesting,
      node type and string lifetime. Recurrent checks include dimension products,
      stride disagreement, truncated entropy data, color conversion bounds, recursive
      nodes, numeric casts, exception unwinding, shared Mat buffers and cleanup of
      partially allocated codec or storage objects.

      TIFF decode can hand channel conversion to a core matrix operation. Decoded Mat
      depth and channel count participate in that secondary dispatch, whose interface is
      distinct from the codec output contract.
  - id: project_p11_kit
    summary: "Trace p11-kit serialized RPC calls through mock PKCS#11 dispatch."
    project_names: ["p11-kit"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. The p11-kit RPC fuzzer appends the complete artifact to a
      p11_buffer, initializes a mock PKCS#11 module and virtual function table, and
      calls p11_rpc_server_handle with the same buffer for request and response. The
      carrier is p11-kit's serialized RPC request, not DER or a PKCS#11 structure dump.

      Trace 32-bit call id -> length-prefixed signature -> call-specific typed arguments
      -> virtual PKCS#11 function -> serialized response -> cleanup. Track uint32/uint64
      encoding, presence bytes, byte-array and ulong-array counts, attribute type/value
      lengths, mechanism parameters, handles, session state, parsed offset, response
      growth and input/output aliasing. Recurrent checks include
      count-times-element-size overflow, signature/argument mismatch, invalid call ids,
      nested attribute lengths, absent-versus-empty arrays, narrowing CK_ULONG,
      reallocation invalidating views, call-state violations and cleanup of extra
      allocations after partial decode.
  - id: project_pcl
    summary: "Trace PCL PLY files through property layout and point-cloud allocation."
    project_names: ["pcl"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. The PCL PLY reader target writes the complete artifact to a
      temporary file and calls PLYReader::read into a PCLPointCloud2. The carrier is a
      whole PLY file, not an isolated vertex record. Its header selects ASCII, binary
      little-endian or binary big-endian body parsing and declares the element/property
      layout.

      Trace magic and header lines -> format, element and property declarations ->
      scalar/list body decoding -> field layout and cloud allocation -> destruction.
      Track element counts, scalar widths and signedness, list count type, byte order,
      input offset, width/height, point_step and row_step in bytes, field offsets, data
      capacity and dense flags. Recurrent checks include count-times-record-size
      overflow, list counts beyond remaining data, duplicate properties, ASCII
      conversion, endian swaps, inconsistent vertex/face counts, overlapping fields,
      short binary bodies, temporary-file errors and cleanup of partially populated
      clouds.

      After ordinary vertex decoding, range-grid remapping can use stored vertex indexes
      to copy packed points. Keep index, point stride, field width, and backing-data
      capacity as distinct geometry.
  - id: project_pigweed
    summary: "Separate Pigweed protobuf bytes from provider-driven read controls."
    project_names: ["pigweed"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. Pigweed's protobuf decoder fuzzer uses a composite
      FuzzedDataProvider carrier. Provider controls choose the length of a protobuf byte
      slice; remaining bytes select which typed Read operation follows each
      StreamDecoder::Next, including packed arrays and nested decoders. It is not a raw
      protobuf-only target, and changing control bytes can alter traversal without
      changing the message.

      Trace provider split -> MemoryReader -> protobuf key and wire type -> field cursor
      -> typed scalar, packed, bytes, string or nested read -> destruction. Track varint
      bytes, field number, wire type, zigzag conversion, fixed widths,
      length-delimited bounds, stream position, packed count, caller buffer capacity,
      nesting depth and status. Recurrent checks include overlong varints, length beyond
      stream, packed-width remainder, type/wire mismatch, truncated nested messages,
      fixed-buffer exhaustion, cursor desynchronization, depth transitions and substream
      lifetime after failed reads.

      Pigweed also has raw-byte HCI UART targets: H4 framing is a packet type followed by
      a type-specific header, declared payload length, and payload before callbacks run.
      Stream adapters add a separate reader, writer, or seekable interface contract.
  - id: project_postgis
    summary: "Separate PostGIS WKB/EWKB, WKT, and GeoJSON geometry carriers."
    project_names: ["postgis"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. PostGIS has separate import targets for raw WKB/EWKB,
      NUL-terminated WKT and NUL-terminated GeoJSON. Each frees the resulting LWGEOM;
      WKB/WKT harnesses may use permissive parser checks and recover from errors through
      setjmp/longjmp. Bind the target because text and binary carriers are not
      interchangeable.

      Trace endian/type header or text lexer -> coordinate sequences -> rings,
      collections and nested geometries -> optional SRID -> LWGEOM graph -> destruction.
      Track byte order, geometry type flags, Z/M dimensions, SRID, point/ring/geometry
      counts, coordinate width, token offsets, nesting, bbox state and allocator
      ownership. Recurrent checks include count-times-coordinate-size overflow,
      truncated collections, invalid dimensional combinations, NaN/infinity, ring
      cardinality, deep recursion, longjmp across allocations, partial child ownership
      and disagreement between permissive parse state and later geometry consumers.
  - id: project_tarantool
    summary: "Separate Tarantool CSV, HTTP, URI, datetime, SWIM, and SQL carriers."
    project_names: ["tarantool"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. Tarantool exposes distinct carriers: CSV chunks copied with a
      trailing NUL but parsed by [begin,end); HTTP header lines with a movable cursor and
      explicit end; NUL-terminated URI text; datetime text with either a byte count or
      separately fuzzed strptime format; MessagePack datetime extensions; bounded SWIM
      meta/member records; and protobuf-generated SQL rendered to text before sql_fuzz.
      Trace each entry through its own setup: local parser state, memory/fiber for SWIM,
      or collation, box and SQL subsystems for SQL. Track bytes versus characters,
      cursor advancement, size-plus-terminator allocation, final-chunk state, extension
      lengths, timestamp and timezone fields, and generated SQL expansion. Recurrent
      checks include partial tokens at EOF, embedded-NUL disagreement, stale members
      after errors, nested count/length overflow, invalid datetime normalization,
      protobuf-to-SQL lifetime assumptions and teardown on every early return.

      Treat generic MessagePack validation and extension-subtype decoding as one
      contract. Fixed-shape and variable-shape extension families impose different
      payload and remainder invariants beyond the outer MessagePack length.
  - id: project_unicorn
    summary: "Bind Unicorn raw guest code to build-selected architecture and mode."
    project_names: ["unicorn"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. Unicorn emulator targets select architecture, mode, word width
      and endianness at build time; the carrier is raw guest machine code. Each run opens
      an engine, maps an executable guest region at a fixed guest address, copies Size
      bytes, then starts with end PC equal to address plus Size and an instruction-count
      budget. Trace uc_open -> uc_mem_map -> uc_mem_write -> decode -> translated block
      generation -> guest execution -> error handling -> uc_close. Track host size_t
      separately from guest address width, instruction alignment and Thumb state, byte
      order, mapping permissions, fetch span, PC updates and instruction count versus
      bytes. Recurrent checks include truncated variable-length instructions at the
      payload edge, cross-page fetches, delay slots and branch targets, overflowed or
      unmapped guest accesses, register sign extension, translated-block bounds, cache
      invalidation for self-modifying code and complete per-run reset after faults.

      On x86 targets, the chosen CPU model's feature masks gate which instruction helpers
      raw guest code can reach. Include feature-dependent translation branches in route
      reasoning and keep exposed features consistent with helper and address checks.
  - id: project_uriparser
    summary: "Separate uriparser narrow/wide URI, query, and filename operations."
    project_names: ["uriparser"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. uriparser builds narrow- and wide-character targets, so bytes
      produce different character counts and incomplete wide units may be unused. The
      parse target consumes a boolean plus two strings and exercises escape/unescape,
      filename conversion, IPv4 parsing, URI parse/recompose, equality, normalization
      and base resolution. Query targets pass [start,end) to DissectQueryMalloc, get an
      item count, request the required character count, allocate that count plus one,
      compose and free. Trace input conversion -> component ranges -> resolution ->
      allocation/recomposition -> cleanup. Track bytes, URI_CHAR units, terminators,
      exclusive ends, required versus written counts, percent escapes,
      authority/host/port/path/query boundaries and ownership after partial failure.
      Recurrent checks include odd wide-byte tails, embedded NUL differences, size
      multiplication, unterminated escapes, aliasing during in-place decode, dot-segment
      resolution, allocation rollback and freeing partially initialized members once.

      URI output capacity follows the build's character representation rather than a
      universal byte unit. Keep character counts, storage units, and destination capacity
      distinct across narrow- and wide-character builds.
  - id: project_wasm3
    summary: "Trace Wasm3 modules through parse, load, export call, and owned cleanup."
    project_names: ["wasm3"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. Wasm3's carrier is a complete WebAssembly module byte buffer,
      gated to a bounded byte range and paired with an environment and runtime whose
      stack budget is in bytes. The harness parses, loads, finds an exported function by
      name, calls it with a host integer when present, then releases runtime and
      environment; module ownership differs after parse success, load failure and
      successful load. Trace m3_NewEnvironment -> m3_NewRuntime -> m3_ParseModule ->
      m3_LoadModule -> m3_FindFunction -> m3_CallV -> ownership-aware cleanup. Track byte
      offsets, unsigned LEB128, section/body lengths, vector counts,
      type/function/table/memory/global indices, operand/control-stack depth, runtime
      stack bytes and linear-memory pages. Recurrent checks include truncated or
      overlong LEB128, count-product overflow, section boundary drift, invalid branch
      depth or stack merge, code-length disagreement, memory/table growth arithmetic,
      call-signature mismatch, trap unwinding and double-free or leaks across failure
      stages.

      Module loading evaluates initializer expressions for globals, data, and table
      elements before exported execution. These load-time fragments participate in both
      compiler stack accounting and runtime capacity, whose units must agree.
  - id: project_wavpack
    summary: "Model WavPack callback I/O, metadata, sample decoding, seek, and tags."
    project_names: ["wavpack"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. WavPack consumes a .wv byte stream through memory callbacks:
      reads use signed 32-bit counts, positions and length use signed 64-bit values, and
      pushback is separate state. WavpackOpenFileInputEx64 enables wrapper, tag-edit,
      DSD-to-PCM and normalization paths, then queries channels, sample counts, widths,
      layout, mode, tags and wrapper data. The harness decodes fixed sample batches,
      updates tags, seeks to a non-block-boundary sample and may rewrite tags. Trace
      callback I/O -> block/metadata parse -> format derivation -> sample unpack ->
      seek/reset -> tag write -> close. Track file bytes versus channel samples, channel
      count, bytes/bits per sample, callback results, tag name/value lengths, layout
      count and 64-bit seek arithmetic. Recurrent checks include pointer-position
      overflow, short reads/pushback at EOF, metadata multiplication, signed-to-size
      conversion, channel-sized buffers, corrupt block indexes, decoder state after
      seek, terminator allocation and ownership after partial open or decode.

      Query and metadata APIs can write only part of a caller buffer, or leave an output
      untouched on an error that the harness later ignores. For uninitialized-value
      tasks, trace the API's success contract, exact bytes written, and caller
      initialization even when the returned value is discarded. Do not assume the
      sample-decode buffer is the producer when tag, wrapper, channel-layout, or mode
      queries run before or after decoding.
  - id: project_wget2
    summary: "Separate wget2 direct text parsers from virtual HTTP response streams."
    project_names: ["wget2"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. wget2 has several carrier families. Direct targets terminate text
      for HTTP headers, HTML/CSS/XML URL extraction, IRI, cookies, HSTS/HPKP, netrc,
      robots, sitemaps, Metalink, Base64 and options; IRI paths run under UTF-8 and a
      single-byte encoding. The HTTP client target appends fuzz bytes to a valid response
      prefix using chunked, Content-Length or close-delimited framing, then a virtual
      socket serves the response under its mock receive policy while accepting writes.
      Trace direct parse or request creation -> connect -> send -> incremental response
      parse -> body framing -> cleanup. Track raw bytes versus decoded characters, NUL
      boundaries, declared body length, chunk sizes, header cursor, persistent-connection
      state and receive cursor/EOF behavior. Recurrent checks include line/integer overflow,
      conflicting framing, premature EOF, encoding expansion, relative-IRI
      normalization, callback-owned result cleanup and teardown after partial connection
      success.

      Configuration and options initialization is its own text carrier and can recursively
      expand include paths and path patterns before networking begins. Recursive expansion
      introduces per-level result ownership and lifetime beyond ordinary option parsing.
  - id: project_wolfmqtt
    summary: "Decode wolfMQTT datasource controls into a stateful client session."
    project_names: ["wolfmqtt"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. wolfMQTT treats input as a structured datasource that scripts
      a client, not one raw packet. It derives booleans, 16-bit packet ids, strings,
      byte vectors, QoS 0..2, up to 50 topics, last-will fields and up to 19 subscribe,
      unsubscribe, publish, ping or wait actions. Fixed transmit/receive buffers back a
      fake network: reads return datasource fragments, while writes may fail or report
      a partial count; MQTT v5 is enabled. Trace client/socket setup -> CONNECT
      encode/reply -> action encode -> fragmented acknowledgement or message decode ->
      callback -> disconnect/cleanup. Track bytes versus MQTT UTF-8 lengths, packet ids,
      base-128 Remaining Length and property lengths, topic count, payload total_len,
      QoS phase, callback new/done flags, timeout milliseconds and partial-I/O progress.
      Recurrent checks include varint overflow, zero-progress loops, truncated fields,
      packet flag mismatches, temporary string/vector lifetimes, receive-state reuse
      across actions and cleanup after mid-handshake failure.

      CONNECT serialization combines fixed fields with several length-prefixed optional
      fields. Presence state, encoded length, and emitted payload are separate but related
      representations throughout sizing and serialization.

      The public historical project harness uses the fuzzing-headers Datasource as a
      forward-only byte cursor. Each Get operation first consumes a 32-bit little-endian
      payload length, clamps that length to the requested scalar width when appropriate,
      and then consumes the payload; strings consume the declared bytes. Do not substitute
      LLVM FuzzedDataProvider tail consumption, a two-ended reservoir, or a varint grammar.
      The harness initializes CONNECT in this exact order: discarded transmit uint16,
      discarded receive uint16, clean-session boolean, client-id string, and LWT-enable
      boolean, followed by LWT fields only when enabled. It then forces both backing
      buffers to 4096 bytes and directly populates the client structure rather than calling
      MqttClient_Init, so verify the retained protocol level and optional-field nullness
      before deriving CONNECT sizing. Read back every framed field and total cursor
      consumption before submitting a historical-harness carrier.
  - id: project_wt
    summary: "Bind Wt XML, JSON, CSS, URL, and expression parser carriers."
    project_names: ["wt"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. Wt routes bounded byte strings independently to XML, JSON,
      CSS, URL and plural-expression parsers. Most preserve embedded NUL in std::string;
      RapidXML copies into mutable storage and appends a terminator before parsing and
      fixing self-closing tags. JSON is parsed as an object and a generic value, URL
      input populates Http::Client::URL, CSS uses Render::CssParser, and plural
      evaluation uses a fixed operand while expected exceptions are contained. Trace
      byte construction -> lexer -> grammar/tree construction -> normalization ->
      exception cleanup. Track bytes versus code points and C-string ends, token
      offsets, recursion depth, numeric range, XML node/attribute ownership, CSS
      escape/comment state, URL authority/port/path boundaries and expression operator
      state. Recurrent checks include embedded-NUL disagreement, unterminated
      quotes/comments/escapes, nesting exhaustion, numeric overflow, malformed UTF,
      delimiter recovery, partial-object cleanup and exception-safe parser-state
      restoration.
  - id: project_zlib
    summary: "Separate zlib compression, inflate, dictionary, sync, checksum, and gzip paths."
    project_names: ["zlib"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. zlib targets cover source bytes compressed at several levels
      and round-tripped, candidate zlib streams expanded into fixed output,
      input-derived dictionaries, full-flush corruption with inflateSync recovery,
      incremental versus one-shot checksums, and gzip APIs. One target prepends a valid
      two-byte zlib header before treating remaining bytes as DEFLATE, so distinguish
      wrapper construction from payload. Trace deflateInit/deflateInit2 ->
      dictionary/update/flush -> finish/end -> inflate init -> dictionary negotiation or
      sync -> verification/teardown. Track size_t, uLongf, z_size_t and uInt conversions;
      avail_in/out; bounds; windowBits and wrapper mode; dictionary length and Adler id;
      flush mode; output capacity and stream totals. Recurrent checks include narrowing,
      bound under-allocation, zero-progress loops, premature stream end, malformed
      Huffman tables, dictionary mismatch, trailing/concatenated streams, sync after
      corruption, checksum-combine lengths and cleanup after every status.
  - id: project_qemu
    summary: "Decode QEMU generic device command streams under build-selected targets."
    project_names: ["qemu"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. QEMU fuzz binaries select a device-specific target outside the
      artifact. The generic device target splits input on a literal command separator;
      each nonempty chunk begins with an opcode for PIO, MMIO, PCI config, DMA-pattern or
      clock operations, followed by native operands. It boots a qtest machine, flushes
      events after each command and resets after the sequence. Disk-image and protocol
      targets use different carriers.

      Trace harness command -> selected MemoryRegion/device -> register or DMA access ->
      device state machine -> timers, queues and reset. Track address-space and
      region-relative offsets, access width/alignment, endianness, PCI BAR state,
      guest-physical DMA address and length, descriptor ownership, interrupt/event
      ordering and reset lifetime. Recurrent checks include offset wrapping, invalid
      access sizes, descriptor/count products, DMA double-fetch state, queue index wrap,
      stale timers, reentrant callbacks and cleanup of device objects after partial
      commands.

      QEMU also has a separate linux-user carrier: a complete ELF image parsed by its
      loader, not a qtest command stream. For each `PT_LOAD`, keep guest virtual-address
      geometry distinct from file offset placement, and file size distinct from memory
      size before mapping.
  - id: project_quickjs
    summary: "Separate QuickJS eval, bytecode round-trip, and regexp carriers."
    project_names: ["quickjs"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. QuickJS has separate eval, compile/bytecode and regexp targets.
      Eval and compile require a trailing NUL but pass Size-1 as the JavaScript source
      length; compile-only then serializes bytecode, reads it back, resolves modules and
      evaluates it. The regexp target instead splits at the first NUL into pattern and
      subject. A persistent runtime/context uses a memory limit and interrupt handler,
      so bind the executable and carrier. Each compile-target invocation still receives
      only one artifact: a module cycle must be expressible through names and resources
      visible to that loader in the same run. Do not assume auxiliary source files or a
      second fuzzer invocation unless the bound harness creates them.

      Trace lexer/parser -> bytecode or regexp compiler -> VM/regexp execution -> jobs
      and GC -> JS_FreeValue or bytecode free. Track source bytes, UTF-8/UTF-16
      positions, atom and constant indexes, stack depth, capture count, subject offsets,
      object/array capacity, BigInt width, module state and persistent runtime ownership.
      Recurrent checks include truncated escapes, jump/index overflow, bytecode
      read/write asymmetry, malformed quantifiers, capture-vector bounds, backtracking
      or job loops, exception paths, stale atoms and GC roots retained across inputs.

      Model modules as resolve -> link/instantiate -> evaluate -> settle queued jobs.
      Cycles are valid graph structure rather than completion or failure by themselves.
      Top-level await makes evaluation asynchronous, so a resolved namespace, linked
      module, or returned Promise is not completion until its dependency cycle and job
      queue settle. Preserve the actual await operation and dependency edges when the
      behavior under test crosses asynchronous module evaluation.
  - id: project_resiprocate
    summary: "Replay shared text through reSIProcate SIP, SDP, URI, and address parsers."
    project_names: ["resiprocate"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. The reSIProcate stack fuzzer shares the complete
      explicit-length span and independently constructs a NameAddr, SDP contents, a full
      SIP message and a URI, forcing lazy SDP parsing and catching ParseException. There
      is no selector and acceptance by one parser does not identify the path. DNS
      utility fuzzers are separate.

      Trace SIP start line -> headers and lazy typed bodies -> Content-Length/body ->
      SDP session/media attributes, or text -> NameAddr/URI grammar -> parameter graph
      -> destruction. Track bytes versus text tokens, CRLF folding, header multiplicity,
      quoted strings, URI scheme/user/host/port, percent escapes, address parameters,
      SDP line boundaries, numeric ports/time fields, body length and borrowed Data
      lifetime. Recurrent checks include unterminated quotes/comments, delimiter-edge
      underflow, duplicate headers, invalid IPv6 brackets, parameter replacement, lazy
      parse after buffer sharing, list ownership and exception cleanup of partially
      constructed messages or contents.

      A standalone Contact or NameAddr route parses semicolon parameters through its
      parser category into bounded buffer helpers. Preserve quoted-value, token, and
      explicit-span state through that route.
  - id: project_s2opc
    summary: "Separate S2OPC typed objects, secure chunks, PubSub, and URI targets."
    project_names: ["s2opc"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. S2OPC exposes distinct OPC UA carriers. One decoder uses the
      first byte as an encodeable-type index and the remainder as binary object data,
      then decode-encode-decode-encode checks stability. A server-request target feeds
      the complete span through a server-side Secure Conversation chunk manager; PubSub
      and URI parsers differ. Bind the executable before adding framing.

      Trace type selector -> OPC UA fields -> arrays, strings, NodeIds and Variants ->
      re-encode, or UA-TCP header -> chunk assembly -> secure-channel headers -> request
      id and payload -> close. Track little-endian lengths, signed null versus empty
      length, array counts, namespace/id form, Variant type/rank, UA-TCP
      message/chunk size, final/continuation flag, sequence/request ids, receive capacity
      and ownership. Recurrent checks include count-size overflow, recursive Variants,
      truncated strings, chunk-length disagreement, multi-chunk state,
      decode/encode asymmetry and clearing partially initialized objects or connections.

      A Variant type byte combines a built-in type with array and dimensions flags; array
      form then carries a signed count. Keep type-domain, metadata, count,
      null-versus-empty, and scalar-versus-array state separate.
  - id: project_spice_usbredir
    summary: "Bind usbredir parser streams and filter-rule composite carriers."
    project_names: ["spice-usbredir"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. usbredir has parser-stream and filter-rule targets with
      composite FuzzedDataProvider carriers. The parser consumes capabilities, init
      flags and optional serialized state, then feeds remaining bytes through callbacks
      while intermittently serializing state and draining writes. The filter target
      consumes separators, rule text and interface/device fields. Neither is a raw USB
      packet from byte zero.

      Trace controls -> parser initialization/restore -> usbredir header and typed
      payload -> callback and queued write -> state serialization/destruction. Track
      message type, 32/64-bit id, payload length, endpoint, interface count,
      capabilities, stream/status fields, callback-owned packet buffers and queued
      output. Recurrent checks include length beyond stream, capability-dependent
      headers, interface/count products, control/bulk/iso length mismatch,
      serialize/unserialize asymmetry, read/write progress loops, rule separator edges,
      stale callback data and freeing packet or parser state after errors.

      Serialized parser state can include queued writes. Length or count back-patch state
      therefore crosses growable-buffer and serialization boundaries and must use a
      representation whose ownership and validity survive buffer growth.
  - id: project_spicy
    summary: "Bind Spicy generated parser targets to their stream and format grammar."
    project_names: ["spicy"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. Spicy fuzz binaries are generated per compiled parser:
      examples include DNS, DHCP, TFTP, HTTP request/reply streams, PNG and PE. Each
      target appends the complete artifact to a HILTI stream and invokes the named
      parser through parse1 or parse3. There is no input selector; framing and stream
      semantics come from the executable's SPICY_FUZZ_PARSER binding.

      Trace HILTI stream append -> generated parser -> unit fields and child parsers ->
      filters/sinks -> ParsedUnit and runtime cleanup. Track stream byte position,
      lookahead, endian fields, declared lengths, container counts, optional/switch
      conditions, synchronization points, line/chunk state for stream protocols, and
      ownership of borrowed bytes and generated values. Recurrent checks include
      length/offset wrap, parser non-progress, partial-unit EOF, recursive containers,
      state leakage between requests/replies, filter expansion, exception unwinding and
      references surviving stream or unit destruction.

      Generated completion and decline events can dispatch optional runtime callbacks.
      Separate the generated grammar event from callback presence, callback lifetime,
      and the stream state supplied to the runtime hook.
  - id: project_spirv_tools
    summary: "Trace SPIR-V modules through validation, mutation, IR, and writers."
    project_names: ["spirv-tools"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. SPIR-V Tools/Tint fuzzers bind complete SPIR-V binaries whose
      byte size must be a multiple of four. A tools-driven target validates a uint32_t
      word vector, mutates it through fuzz/reduce/opt passes, converts SPIR-V to WGSL,
      then may emit HLSL, MSL, SPIR-V or WGSL according to build/CLI settings. Other
      targets only read or translate; no selector is stored in the module.

      Trace five-word SPIR-V header -> instruction word-count/opcode stream -> ids,
      types, constants and control flow -> validation/mutation -> Tint IR/AST -> target
      writer. Track word units versus bytes, id bound, result/type ids, storage class,
      vector/matrix dimensions, branch/merge structure, decoration operands, entry
      points, capabilities and mutator cache ownership. Recurrent checks include
      zero/oversized word counts, instruction overrun, use-before-definition, recursive
      types, malformed CFG/phi edges, dimension products, pass-invalidated analysis,
      translator disagreement and cleanup of cached mutators after invalid output.

      In direct Tint conversion routes, storage-layout resolution is a distinct stage
      between module parsing and writer emission; it validates address-space alignment
      and can format nested member layouts. Do not assume optimize or reduce passes run.
  - id: project_swift_protobuf
    summary: "Separate SwiftProtobuf binary, delimited, JSON, and text carriers."
    project_names: ["swift-protobuf"]
    content: |
      Use these public project landmarks as search priors and verify them in the
      checked-in version. SwiftProtobuf has separate binary, delimited-stream, JSON and
      text targets against a generated message with extensions. Most may consume a
      leading zero plus option bits for depth and unknown-field policy, then parse and
      serialize the remainder. Delimited and async targets instead treat leading zero
      as a valid zero-length frame and repeatedly decode messages.

      Trace option envelope if present -> protobuf key/wire value or JSON/text token ->
      fields, maps, oneofs, extensions and unknown fields -> serialization; streams add
      varint frame length and EOF. Track field number, varint width, zigzag/fixed widths,
      length bounds, recursion limit, UTF-8, packed counts, map keys, oneof replacement,
      unknown-field retention and value ownership. Recurrent checks include overlong
      varints, frame accumulation, packed-width tails, recursive messages, malformed
      escapes, Any/type resolution, parse/serialize asymmetry, async termination and
      repeated-message memory growth.

      Text-format lookahead has tentative and committed cursor states. Keep optional
      token prefixes, end-of-input, and rejection paths in the same explicit span so a
      failed classification does not silently become consumption.
